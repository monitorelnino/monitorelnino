# Descoberta (imprensa, agregadores, sítios oficiais) — 23h30 de Brasília (02:30 UTC).
#
# Item 1 do handover de desacoplamento e cadência do item 1b. Descoberta é o que mais depende de
# fonte externa lenta, e é justamente o que não pode derrubar a coleta de diário nem a publicação.
# Nenhum destes scripts promove registro: todos produzem pista (§3.2, R7 revisada no §262).
name: Noturno — descoberta

on:
  schedule:
    - cron: "30 2 * * *"   # 23h30 de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  descoberta:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: descoberta
      # Escreve em data/pistas_*.json — grupo compartilhado da noite (seção G1).
      grupo_de_concorrencia: noturno
      timeout_minutos: 60
      # §278: `monitorar_redes_oficiais.py` e `seguir_pistas.py` consultam o metabuscador.
      precisa_searxng: true
      comandos: |
        monitorar_imprensa_regional.py --limite 40
        monitorar_imprensa_saude.py --limite 27
        monitorar_atos_resposta.py --limite 10
        monitorar_politica_por_inteiro.py
        monitorar_sinais_federais.py
        detectar_marcos_federais.py
        verificar_prazos_legais.py
        descobrir_planos.py --limite 20
        monitorar_redes_oficiais.py --limite 20
        seguir_pistas.py --limite 20
        triar_confianca_pistas.py
        # 29/09/2026 (bloco 2, fase 1): verificador da fonte das pistas de imprensa, em MODO
        # SOMBRA — grava `verificacao_fonte` e NÃO toca o cartão. Entra aqui, depois do monitor
        # de imprensa gravar as pistas novas e antes do juiz (3h) consumir as mesmas pistas.
        # O teto de páginas por noite é do orçamento compartilhado (seção G2), não deste limite.
        verificar_pista_imprensa.py --sombra
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
