# Descoberta (imprensa, agregadores, sítios oficiais) — 23h30 de Brasília (02:30 UTC).
#
# Item 1 do handover de desacoplamento e cadência do item 1b. Descoberta é o que mais depende de
# fonte externa lenta, e é justamente o que não pode derrubar a coleta de diário nem a publicação.
# Nenhum destes scripts promove registro: todos produzem pista (§3.2, R7 revisada no §262).
# Elo da corrente noturna: ordem, gatilho e reserva na skill `noite-e-coletores` (história:
# docs/HISTORICO_DE_REGIMES.md).
name: Noturno — descoberta

on:
  workflow_run:
    workflows: ["Noturno — diários oficiais"]
    # 08/10/2026 (A2-05): `workflow_run` dispara para run do workflow nomeado em QUALQUER
    # ramo. Sem esta linha, diários do `ensaio` puxavam a corrente inteira na `main` — quatro
    # descobertas medidas em 07/10, uma delas cancelando a triagem pendente.
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs (10/10/2026)

jobs:
  descoberta:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: descoberta
      # Escreve em data/pistas_*.json — grupo compartilhado da noite (seção G1).
      grupo_de_concorrencia: noturno
      timeout_minutos: 60
      # 25/10/2026 (fila reentrante, HANDOVER_FILA_DE_PISTAS_SEM_SESSAO, o mesmo do juiz): cada rodada
      # segue até 20 notícias; sobrando notícia que a noite ainda não tocou, o marcador é
      # `descoberta.parcial` e a reserva do despachante redispara o elo até 08:00 UTC.
      restante: seguir_pistas.py --restante
      # §278: `monitorar_busca_web.py --ufs` e `seguir_pistas.py` consultam o metabuscador.
      precisa_searxng: true
      comandos: |
        monitorar_imprensa_regional.py --limite 40
        monitorar_imprensa_saude.py --limite 27
        monitorar_atos_resposta.py --limite 10
        monitorar_politica_por_inteiro.py
        monitorar_sinais_federais.py
        detectar_marcos_federais.py
        prazo=12min descobrir_planos.py --limite 20
        # 26/10/2026 (Buscador 2, B1): a consulta estadual por UF, `site:<uf>.gov.br`, no lugar do
        # coletor de redes oficiais — rede social não é entrada (B3), e o rótulo de setor no campo
        # município trazia a web inteira.
        monitorar_busca_web.py --ufs
        seguir_pistas.py --limite 20
        triar_confianca_pistas.py
        # 29/09/2026 (bloco 2, fase 1): verificador da fonte das pistas de imprensa, em MODO
        # SOMBRA — grava `verificacao_fonte` e NÃO toca o cartão. Entra aqui, depois do monitor
        # de imprensa gravar as pistas novas e antes do juiz (3h) consumir as mesmas pistas.
        # O teto de páginas por noite é do orçamento compartilhado (seção G2), não deste limite.
        verificar_pista_imprensa.py --sombra
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      # 08/10/2026 (A2-28): sem o `ROBO_TOKEN`, o tique oportunista roda com o
      # `GITHUB_TOKEN`, que não alcança o `robo-registro`, e a Issue de alarme
      # falha em silêncio por causa do `|| true`.
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
