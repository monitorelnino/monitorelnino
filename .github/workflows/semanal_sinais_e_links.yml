# Sinais climáticos por município e verificação de links — 1x por semana, domingo 4h de Brasília.
#
# Item 1 do handover de desacoplamento e cadência do item 1b: "sinais climáticos e links só domingo".
# São os dois passos de maior duração e menor urgência — clima municipal tinha teto de 50 min no job
# monolítico, e a verificação de links varre o site inteiro. Semanal é o que eles precisam ser.
name: Semanal — sinais climáticos e links

on:
  schedule:
    # 28/09/2026: 4h30 e não 4h00 — às 4h em ponto roda a busca web da janela, e as duas no mesmo
    # minuto competem pelo runner sem necessidade.
    - cron: "30 7 * * 0"   # domingo, 4h30 de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sinais_e_links:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: sinais-e-links
      timeout_minutos: 150
      # §279 (item 5 da decisão da editoria, 28/09/2026): os três scripts que só rodavam na CI entram
      # aqui. Eles produzem dado que a rodada USA — `dominios_oficiais.json` alimenta
      # `descobrir_planos.py`, `saude_sinais.json` alimenta a camada de saúde — e rodar só quando um PR
      # abre significava dado envelhecendo sem ninguém notar: a última busca ativa de domínio registrada
      # era de 23/09. Semanal é a cadência que eles pedem: domínio oficial e ESPIN não mudam por dia.
      # SEM `precisa_searxng`: conferi antes de afirmar. `descobrir_dominios.py` não consulta
      # metabuscador nenhum — ele testa padrões de domínio declarados (`defesacivil.{uf}.gov.br` e
      # afins) direto por HTTP, e decide pela resposta e pelo título. Subir instância aqui seria
      # dependência inventada, que é o erro que eu cometi três vezes nestes dois dias.
      comandos: |
        # 30/09/2026: cadastro federal de municípios suscetíveis a enxurradas e inundações (Casa
        # Civil). Semanal porque a nota técnica muda por decreto, não por dia; o coletor recusa
        # gravar se a contagem não fechar 2.086 + 9 = 2.095.
        coletar_cadastro_prioritarios.py
        # 30/09/2026 (§312, item 6 da fila viva): cobertura do Querido Diário, semanal, acoplada ao
        # ciclo de atualização. O acervo do Querido Diário CRESCE — cidades entram ao longo do tempo
        # —, e o retrato antigo era de uma busca com janela de data, que envelhecia sem avisar: em
        # 30/09 o arquivo ainda trazia 1.859 municípios testados em 09/09. A rotina reconsulta só os
        # que ainda não têm diário indexado, que é onde a mudança acontece: quem já está coberto não
        # volta à fila, porque edição indexada não desaparece. Por isso ela fica barata com o tempo.
        coletar_cobertura_qd.py
        # 30/09/2026 (PR 3 do enquadramento federal de risco): municípios prioritários do MMA.
        # Semanal porque a portaria é anual; o coletor só preserva evidência quando o TEXTO do ato
        # muda, e avisa em voz alta quando a janela da atualização anual passou sem mudança.
        coletar_prioritarios_mma.py
        coletar_sinais_risco.py --municipios
        # 29/09/2026 (bloco 4): SRAG pela fonte primária, semanal como o dado. Lê o banco do
        # SIVEP-Gripe em fluxo e guarda só o agregado por UF e semana; os anos congelados
        # (2019–2024) saem do cache e não são rebaixados da rede toda semana.
        coletar_srag_sivep.py
        # 29/09/2026 (item 2): contagem de dengue e chikungunya pela fonte primária (SINAN).
        # O InfoDengue continua rodando na rodada semanal para o NÍVEL DE ALERTA, que é
        # interpretação da série e não existe no banco primário.
        coletar_arboviroses_sinan.py
        # 29/09/2026 (item 5): óbitos registrados em cartório, por UF e MÊS — sinal precoce sem
        # causa. A granularidade é a que a fonte tem: a API agrega por mês, medido.
        coletar_obitos_registro_civil.py
        # Sondas do InfoGripe, as duas: a série da Fiocruz volta a ser fonte complementar se o
        # acesso voltar, e são elas que avisam. Nenhuma escreve série.
        #
        # ERRATA (29/09/2026): o §291 afirmou que `sondar_boletim_infogripe.py` "não existe no
        # repositório". Ele existe, em `scripts/` — eu procurei na raiz e concluí demais do que
        # não achei. Ele estava ligado só ao `diagnostico_sinais.yml`, que roda por botão; o
        # bloco 4 pediu sonda SEMANAL, e é isto aqui.
        scripts/sondar_boletim_infogripe.py
        # A outra sonda cobre o que a primeira não vê: os endpoints do CSV no GitLab. O modo
        # padrão de `coletar_srag_gripe.py` passou a ser sondar — ele não escreve mais série.
        coletar_srag_gripe.py
        descobrir_dominios.py
        coletar_espin.py
        classificar_planos_municipais.py
        verificar_links.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
