# Ponte no Brasil (editoria, 15/11/2026): servidor público que não responde ao robô de fora do país é lido
# por um executor no Brasil (o computador da editoria, rótulo `brasil`), com o cliente identificado.
#
# Três jobs, porque são três lugares: a lista sai do repositório (nuvem); o download sai do executor no
# Brasil, que NÃO faz checkout nem roda código do repositório — só baixa os endereços da lista e devolve
# o artefato; a conferência e o commit voltam à nuvem pelo invólucro dos coletores. Recusa (401, 403, 429,
# 451) para a rodada; muro de robô é recusado na conferência. Só agenda e disparo manual: nenhum PR roda aqui.
name: Ponte no Brasil

on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pedidos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            /*
            !/evidencias/
            !/data/log_buscas/
            !/dados-abertos/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: lista
        run: |
          python3 scripts/ponte_brasil.py --pedidos > pedidos.txt
          echo "$(grep -c . pedidos.txt) endereço(s)"; cat pedidos.txt
          { echo "lista<<FIM"; cat pedidos.txt; echo "FIM"; } >> "$GITHUB_OUTPUT"

  trazer:
    needs: [pedidos]
    if: needs.pedidos.outputs.lista != ''
    runs-on: [self-hosted, brasil]
    timeout-minutes: 90
    steps:
      - name: Baixar no Brasil, com o cliente identificado
        shell: pwsh
        env:
          LISTA: ${{ needs.pedidos.outputs.lista }}
        run: |
          $ua = "MARE-monitorelnino/1.0 (+https://monitorelnino.com.br; ponte no Brasil)"
          New-Item -ItemType Directory -Force -Path trazidos | Out-Null
          $n = 0
          foreach ($u in ($env:LISTA -split "`n" | Where-Object { $_.Trim() })) {
            $u = $u.Trim()
            $n++
            try {
              $r = Invoke-WebRequest -Uri $u -UserAgent $ua -TimeoutSec 120 -OutFile "trazidos/$n.bin" -PassThru
              "$n`t$u`t$($r.StatusCode)" | Add-Content -Encoding utf8 trazidos/manifesto.tsv
            } catch {
              $c = $_.Exception.Response.StatusCode.value__
              "$n`t$u`terro $c" | Add-Content -Encoding utf8 trazidos/manifesto.tsv
              if ($c -in 401, 403, 429, 451) { Write-Output "recusa $c em $u: a rodada para"; break }
            }
            Start-Sleep -Seconds 3
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ponte
          path: trazidos/
          retention-days: 7

  gravar:
    needs: [trazer]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: ponte-brasil
      grupo_de_concorrencia: dia-ponte-brasil
      timeout_minutos: 30
      comandos: |
        scripts/ponte_brasil.py --do-artefato
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
