# vigia_da_abertura.yml — se a noite não abriu, abre
# ===================================================
# MEDIDO DUAS VEZES (central, 03/10 02:30 UTC e 04/10 02:40 UTC): a corrente noturna não abriu. O
# cron de `noturno_diarios` estava em 01:00 UTC e, uma hora e quarenta depois, não havia disparado.
# Em 30/09 o mesmo cron abriu com 5h30 de atraso e morreu no teto do job. O cron do GitHub é de
# MELHOR ESFORÇO — a documentação diz isso em letra de forma —, e minuto redondo é o pior horário
# possível, porque é onde todo mundo agenda.
#
# Três defesas foram instaladas em 04/10, e esta é a terceira:
#   1. minuto fora do pico (abertura às 01:07; busca web em :23, :41 e :53);
#   2. cron de RESERVA 30 min depois, idempotente pela guarda de abertura;
#   3. este VIGIA, às 02:07 UTC (23h07 de Brasília), que não é um terceiro cron da coleta: ele é um
#      job de dois minutos que PERGUNTA se a noite abriu e, se não abriu, dispara a corrente e
#      registra o atraso.
#
# A diferença entre o vigia e mais um cron importa: um terceiro cron de coleta teria a mesma chance
# de ser descartado e, se os três disparassem, a noite rodaria três vezes. O vigia é leve (sem
# dependências, sem navegador), então é o tipo de job que o GitHub atrasa menos — e, mesmo
# atrasado, ele continua correto, porque pergunta pelo ESTADO da janela, não pelo relógio.
#
# Ele NUNCA dispara fora da janela de 22h às 06h de Brasília: disparar às 10h levaria coleta e
# commit para o horário de trabalho da editoria, que é o que a janela existe para evitar.
name: Vigia da abertura da noite

on:
  schedule:
    - cron: "7 2 * * *"   # 23h07 de Brasília — uma hora depois da abertura prevista
  workflow_dispatch:

permissions:
  contents: read
  actions: write        # para disparar a corrente quando ela não abriu

concurrency:
  group: vigia-da-abertura
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      # 04/10/2026 (item 2c do handover dos temporizadores): OBSERVADOR OPORTUNISTA.
      # Cada execução de qualquer coisa vira um tique de relógio. São segundos, sem job extra, e é
      # o observador mais barato que existe: se este workflow conseguiu rodar, o agendador está
      # vivo o suficiente para despachar o que estiver devido. `|| true` porque o despachante é
      # auxiliar — a falha dele não pode derrubar a coleta que ia rodar.
      - name: Tique oportunista
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/despachar_temporizadores.py --origem oportunista \
            --so-ler-e-despachar || true


      - name: A noite abriu?
        id: olhar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JANELA="$(python3 scripts/janela_da_noite.py --inicio-da-janela)"
          NOITE="$(python3 scripts/janela_da_noite.py --noite)"
          ATRASO="$(python3 scripts/janela_da_noite.py --atraso)"
          # 08/10/2026 (A2-08, A2-17): `--branch main`, e só run que TRABALHOU.
          #
          # Sem o ramo, um disparo no `ensaio` contava como "a noite abriu" e o vigia não abria
          # nada. E `status` sozinho conta `cancelled`, `skipped` e `failure` sem trabalho: na
          # noite de 04→05/10 o elo dos diários foi cancelado dois minutos depois de começar, a
          # guarda contou aquilo como abertura, e ninguém refez a coleta.
          #
          # Trabalhou = em andamento, ou concluído com o marcador `data/noite/<noite>/<elo>.feito`
          # no commit do run. Quem decide é `scripts/painel_da_noite.py --trabalhou`.
          # 09/10/2026, medido na noite de 08->09: o filtro contava só `in_progress`, `success` e
          # `failure`. Um run CRIADO e ainda na fila de runner tem status `queued` -- e foi
          # exatamente isso que o vigia viu às 01:11:03, com a corrente aberta às 01:09: contou
          # ZERO e disparou a corrente de novo. Com um grupo de concorrência só na `main`, o
          # GitHub guarda um run em execução e UM pendente, e o terceiro disparo cancela o
          # pendente: morreram `diarios / coletar` e `triagem / coletar`, os dois antes do
          # primeiro passo, com zero passos executados.
          #
          # Run esperando runner NÃO é run que falhou. `queued`, `requested`, `waiting` e
          # `pending` passam a contar como noite aberta, junto de `in_progress`, `success` e
          # `failure`. Seguem fora `cancelled`, `skipped` e `timed_out`: ali não houve coleta, e é
          # a reserva que refaz (regra 3 de 05/10).
          EXECUCOES="$(gh run list --workflow=noturno_diarios.yml --branch main --limit 20 \
            --json databaseId,createdAt,status,conclusion \
            --jq "[.[] | select(.createdAt >= \"$JANELA\") | select((.status | test(\"queued|requested|waiting|pending|in_progress\")) or .conclusion == \"success\" or .conclusion == \"failure\")] | length")"
          if [ "${EXECUCOES:-0}" -gt 0 ] && [ -f "data/noite/$NOITE/diarios.feito" ]; then
            TRABALHOU=1
          elif [ "${EXECUCOES:-0}" -gt 0 ] && gh run list --workflow=noturno_diarios.yml --branch main --limit 5 --json status --jq '.[].status' | grep -q in_progress; then
            TRABALHOU=1
          else
            TRABALHOU=0
          fi
          echo "runs na janela: ${EXECUCOES:-0} · trabalhou: $TRABALHOU"
          EXECUCOES="$TRABALHOU"
          echo "noite de $NOITE · janela desde $JANELA · execuções da corrente: ${EXECUCOES:-0}"
          echo "noite=$NOITE" >> "$GITHUB_OUTPUT"
          echo "atraso=$ATRASO" >> "$GITHUB_OUTPUT"
          if [ "${EXECUCOES:-0}" -gt 0 ]; then
            echo "abriu=sim" >> "$GITHUB_OUTPUT"
          else
            echo "abriu=nao" >> "$GITHUB_OUTPUT"
          fi

      # O disparo é da CORRENTE, só do primeiro elo: os seguintes são acionados pelo término dele,
      # como em qualquer noite. A busca web é independente e tem os seus cinco horários, então o
      # vigia também a cobre — ela é a outra coisa que a noite precisa e que nenhum elo aciona.
      # 09/10/2026: o vigia só age quando a abertura passou da TOLERÂNCIA. O despachante o
      # disparou um minuto depois de a corrente abrir -- o critério dele é "não há execução do
      # vigia nesta janela", e ignora o cron primário do vigia (02:07 UTC). Sem esta trava, o
      # vigia compete com a corrente que ele vigia; abaixo da tolerância, atraso é fila de runner.
      - name: A abertura passou da tolerância?
        id: tolerancia
        run: |
          if python3 scripts/janela_da_noite.py --abertura-atrasada; then
            echo "atrasada=sim" >> "$GITHUB_OUTPUT"
          else
            echo "atrasada=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir a noite que não abriu
        if: steps.olhar.outputs.abriu == 'nao' && steps.tolerancia.outputs.atrasada == 'sim'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::a noite de ${{ steps.olhar.outputs.noite }} não abriu em ${{ steps.olhar.outputs.atraso }} min; o vigia está disparando a corrente"
          # 04/10/2026 (item 2d): o vigia deixa de disparar workflow por nome e passa a ser uma
          # ENTRADA DO DESPACHANTE. A diferença importa: disparar por nome sabe de um temporizador
          # só, e o despachante sabe de todos os que estão devidos naquela janela — inclusive os
          # que ninguém estava vigiando. O vigia continua existindo porque é o observador que olha
          # a abertura especificamente, e porque ele já provou o seu valor.
          python3 scripts/despachar_temporizadores.py --origem vigia

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Vigia da abertura"
            echo ""
            echo "- noite: ${{ steps.olhar.outputs.noite }}"
            echo "- abriu sozinha: ${{ steps.olhar.outputs.abriu }}"
            echo "- atraso da abertura: ${{ steps.olhar.outputs.atraso }} min"
          } >> "$GITHUB_STEP_SUMMARY"
