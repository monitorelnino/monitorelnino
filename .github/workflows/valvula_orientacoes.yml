name: Válvula orientações (temporária, não mesclar)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  orientacoes:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: orientacoes
      timeout_minutos: 30
      comandos: |
        coletar_orientacoes_oficiais.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
