# busca_web_cadencia.yml — cadência automática da busca web (§148, 22/09/2026)
# =============================================================================
# Cinco rodadas de 150 municípios por execução (SearXNG efêmero, prioritários primeiro — §143), em
# paralelo à corrente: a busca web não depende dos diários (item A.2, 03/10/2026), por isso tem grupo
# próprio e não espera a vez do grupo `noturno`; a segurança do commit simultâneo vem da união pela
# base comum no `_coletor.yml`.
#
# 13/10/2026 (F48, correção pela raiz): era um monólito com caminho de coleta próprio — guarda,
# rodadas, sincronização, commit e artefato copiados à mão — e não recebeu o prazo do F38. De 08/10
# a 13/10 todas as execuções da noite morreram no teto de 150 min sem commitar. Agora é chamador do
# `_coletor.yml`: um caminho de coleta só (prazo, janela, `.feito`, artefato, reaplicação, commit);
# a cadeia de derivados (índice, cartão por município, manifesto) é a do `verificar_derivados.sh`.
name: Busca web — cadência automática
on:
  # Janela 01:00–09:00 UTC; horários fora dos minutos de pico (04/10/2026).
  schedule:
    - cron: "23 1 * * *"   # 22h23
    - cron: "23 3 * * *"   #  0h23
    - cron: "41 5 * * *"   #  2h41
    - cron: "41 7 * * *"   #  4h41
    - cron: "53 8 * * *"   #  5h53, a última antes de fechar a janela
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  busca_web:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: busca_web
      timeout_minutos: 150
      precisa_searxng: true
      # 16/10/2026 (F66): a cadência roda FORA da vez da noite, em paralelo com o juiz; aqui ela só
      # acrescenta pistas. Triar e preparar regravam campos de pistas existentes (`nivel_confianca`,
      # `preparacao`), e dois elos regravando o mesmo campo é o que a porta recusa — o juiz perdeu
      # o commit das 09:22 de 16/10 assim. Triagem fica na descoberta; preparação, no juiz.
      comandos: |
        monitorar_busca_web.py --tamanho 150
        monitorar_busca_web.py --tamanho 150
        monitorar_busca_web.py --tamanho 150
        monitorar_busca_web.py --tamanho 150
        monitorar_busca_web.py --tamanho 150
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
