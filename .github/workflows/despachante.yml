# despachante.yml — dispara o que está DEVIDO, venha o relógio de onde vier
# ==========================================================================
# Item 2 do `HANDOVER_garantia_dos_temporizadores_04-10-2026.md` (rev. 2).
#
# O princípio é da editoria: *nada roda "às 22h07". Tudo roda quando está DEVIDO, e quem confere
# são vários observadores independentes.* O cron do GitHub é de melhor esforço — a abertura da
# noite falhou três vezes em cinco dias — e o #544 pôs minuto fora do pico, reserva e vigia TODOS
# dentro do mesmo agendador: se ele falha, caem juntos.
#
# Este job é leve (≤ 2 min, sem navegador e sem dependência de coleta) e idempotente: ele lê
# `config/temporizadores.json`, pergunta à API o que já rodou na janela de hoje, e dispara o que
# falta. Execução EM ANDAMENTO conta como rodada — é o que impede o segundo observador de disparar
# o que o primeiro acabou de começar.
#
# Os quatro observadores chamam este mesmo job:
#   (a) o cron abaixo, a cada 20 minutos, em minutos fora do pico;
#   (b) o relógio da nuvem do Claude, por `relogio.yml` (evento push, não cron);
#   (c) todo workflow agendado, no primeiro passo (oportunista);
#   (d) o vigia da abertura.
name: Despachante dos temporizadores

on:
  schedule:
    - cron: "7,27,47 * * * *"   # a cada 20 min, fora do minuto de pico
  workflow_dispatch:
    inputs:
      origem:
        description: "github-cron | relogio-claude | oportunista | vigia | manual"
        required: false
        default: "manual"

permissions:
  contents: read
  actions: write      # para disparar os workflows devidos
  issues: write       # o alarme é uma Issue no repositório privado

concurrency:
  group: despachante
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }

      - name: Despachar o que está devido
        env:
          # O `GITHUB_TOKEN` basta para `workflow run` no próprio repositório. A Issue do alarme é
          # no repositório PRIVADO, e para ela o token precisa de alcance maior — se ele não
          # existir, o despachante avisa no resumo em vez de falhar: disparar é o essencial;
          # alarmar é o aviso de que disparar não resolveu.
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/despachar_temporizadores.py \
            --origem "${{ inputs.origem || 'github-cron' }}" | tee /tmp/despacho.txt

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Despachante"
            echo ""
            echo '```'
            cat /tmp/despacho.txt 2>/dev/null || echo "sem saída"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
