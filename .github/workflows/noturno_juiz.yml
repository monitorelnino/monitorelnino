# O juiz automático — 3h de Brasília (06:00 UTC), DEPOIS dos diários e da descoberta.
#
# Item 1 do handover de desacoplamento e cadência do item 1b. "Depois" aqui é por HORÁRIO, não por
# dependência de job: se os diários falharem, o juiz roda sobre a fila que existe. A regra do item 1 é
# explícita — nenhum job espera pelo término de outro; o que não chegou fica com a data anterior,
# declarada.
#
# O juiz precisa de Node porque a rede de proteção roda a suíte de portões (jsdom) antes de aplicar, e
# desfaz em disco se algum reprovar (§262, Etapa 7).
# 30/09/2026 (item 7 da rodada 2 — certificação dos coletores). O cron do GitHub é de MELHOR
# ESFORÇO: atrasa sob carga e descarta. Medido em 30/09: `noturno_diarios`, com cron de 01:30 UTC,
# começou às 06:59 (5h30 de atraso) e morreu no teto; a busca web, com cinco crons por noite, rodou
# duas vezes por dia, uma delas às 13:22 UTC — dentro do horário de trabalho da editoria, que é
# justamente o que a janela noturna existe para evitar.
#
# A noite passa a ser UMA CORRENTE: um disparo cedo (00:05 UTC) e cada elo acionado quando o
# anterior TERMINA. Cinco horários independentes davam cinco oportunidades de atrasar; um disparo e
# uma corrente dão uma. A ordem é:
#
#   diários → descoberta → busca web → evidências → juiz → sinais
#
# RECUPERAÇÃO, de propósito: o gatilho NÃO filtra por conclusão. Se o elo anterior falhou ou foi
# cancelado, o seguinte roda assim mesmo — cada coletor processa a fila pendente independentemente
# do horário, e uma noite perdida não pode levar a seguinte junto. `workflow_dispatch` continua em
# todos, para rodar à mão quando preciso.
name: Noturno — juiz automático

on:
  workflow_run:
    workflows: ["Noturno — evidências e OCR"]
    # 08/10/2026 (A2-05): `workflow_run` dispara para run do workflow nomeado em QUALQUER
    # ramo. Sem esta linha, diários do `ensaio` puxavam a corrente inteira na `main` — quatro
    # descobertas medidas em 07/10, uma delas cancelando a triagem pendente.
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs (10/10/2026)

jobs:
  juiz:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: juiz
      # Escreve em data/pistas_*.json — grupo compartilhado da noite (seção G1).
      grupo_de_concorrencia: noturno
      timeout_minutos: 90
      precisa_node: true
      # 28/09/2026 (bloco das 17:20): a busca dirigida do ato consulta o metabuscador nas
      # rotas 2 e 3. Ligar o coletor sem a instância que ele consulta produziria lacuna
      # toda noite com cara de 'fonte fora do ar' — foi o erro do §278, e não se repete.
      precisa_searxng: true
      # 28/09/2026 (item 1 do bloco de frescor): três defeitos aqui, e o efeito somado era um juiz
      # que nunca promoveu nada desde que foi criado.
      #
      # 1. `julgar_filas.py` rodava com `--relatorio`. Sem `--aplicar` ele imprime o veredito e não
      #    escreve: nem na fila, nem em `promocoes_automaticas.json`, nem no log. Mesmo terminando,
      #    a noite inteira não deixava traço — e era por isso que `data/promocoes_automaticas.json`
      #    não existia.
      # 2. Nenhum dos dois tinha teto. A fila de imprensa tem 1.495 pendentes de documento e 1.174
      #    pendentes de codebook, cada uma com busca na rede; o job de 90 min foi CANCELADO no meio
      #    em 28/09 às 12h08. O `_coletor.yml` só commita ao final, então o trabalho feito até ali
      #    foi perdido inteiro. Teto que termina e commita vale mais que fila inteira que não chega
      #    ao fim — e o que sobra fica declarado na saída de cada script.
      # 3. O aplicador rodava ANTES do juiz de codebook. Agora o codebook julga primeiro: ele só
      #    aperta o critério (recusa mais, nunca promove por conta própria), e recusa lida antes
      #    poupa o aplicador de buscar documento de pista que o codebook já descartou.
      #
      # Os tetos são conservadores de propósito, para caber com folga nos 90 min e serem medidos na
      # primeira noite antes de subir.
      #
      # 28/09/2026: o teto do codebook caiu de 250 para 150 porque a busca dirigida entrou no
      # caminho. Cada recusa por falta de documento passa a custar até quatro consultas de rede,
      # com o ritmo de 3 s da rodada entre elas — e a noite anterior mostrou que 74% das recusas
      # são desse tipo. Teto que termina e commita vale mais que fila inteira que não chega ao fim.
      # 09/10/2026 (A1-10): o corretor de atribuicao por dominio existia desde 03/10 e NAO RODAVA
      # em lugar nenhum — nem na noite, nem a mao. Ele reatribui a pista ao dono do dominio oficial
      # do documento (o plano servido em `taio.sc.gov.br` e de Taio, nao do municipio que o texto
      # menciona) e a devolve ao juiz. Roda ANTES de julgar, porque julgar um par que nunca existiu
      # gasta busca na rede para recusar por identidade. Na arvore de hoje ele corrige 4 de 13.503
      # pistas, duas delas so depois de `prefeitura.<nome>` passar a resolver.
      comandos: |
        scripts/corrigir_atribuicao_por_dominio.py --aplicar
        revisar_pistas.py --preparar
        julgar_filas.py --aplicar --limite 150
        julgar_e_aplicar_descobertas.py --limite 150
        aplicar_promocoes_do_juiz.py --aplicar
        scripts/amostra_auditoria_semanal.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      # 08/10/2026 (A2-28): sem o `ROBO_TOKEN`, o tique oportunista roda com o
      # `GITHUB_TOKEN`, que não alcança o `robo-registro`, e a Issue de alarme
      # falha em silêncio por causa do `|| true`.
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
