# O juiz automático: nasce do fim das evidências e julga a fila de pistas até o prazo, reentrante.
# Node: a rede de proteção roda a suíte de portões (jsdom) antes de aplicar (§262, Etapa 7).
# Elo da corrente noturna: ordem, gatilho e reserva na skill `noite-e-coletores` (história:
# docs/HISTORICO_DE_REGIMES.md).
name: Noturno — juiz automático

on:
  workflow_run:
    workflows: ["Noturno — evidências e OCR"]
    # 08/10/2026 (A2-05): `workflow_run` dispara para run do workflow nomeado em QUALQUER
    # ramo. Sem esta linha, diários do `ensaio` puxavam a corrente inteira na `main` — quatro
    # descobertas medidas em 07/10, uma delas cancelando a triagem pendente.
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs (10/10/2026)

jobs:
  juiz:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: juiz
      # Escreve em data/pistas_*.json — grupo compartilhado da noite (seção G1).
      grupo_de_concorrencia: noturno
      # 17/10/2026 (fila reentrante, HANDOVER_FILA_DE_PISTAS_SEM_SESSAO): o juiz julga até o prazo e
      # grava o que julgou; sobrando fila, o marcador é `juiz.parcial` e a reserva do despachante
      # redispara o elo até 08:00 UTC (três tentativas por noite). Os tetos fixos de 28/09 saem do
      # codebook: `julgar_filas` para no `prazo` e grava o julgado (14/10, lote 7 da janela C).
      timeout_minutos: 135
      restante: julgar_filas.py --restante
      precisa_node: true
      # A busca dirigida do ato consulta o metabuscador (28/09/2026, §278).
      precisa_searxng: true
      # Ordem: corrige a atribuição por domínio, prepara, codebook, aplicador (28/09 e 09/10/2026).
      comandos: |
        scripts/corrigir_atribuicao_por_dominio.py --aplicar
        revisar_pistas.py --preparar
        prazo=75min julgar_filas.py --aplicar
        julgar_e_aplicar_descobertas.py --limite 150
        aplicar_promocoes_do_juiz.py --aplicar
        scripts/amostra_auditoria_semanal.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      # 08/10/2026 (A2-28): sem o `ROBO_TOKEN`, o tique oportunista roda com o
      # `GITHUB_TOKEN`, que não alcança o `robo-registro`, e a Issue de alarme
      # falha em silêncio por causa do `|| true`.
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
