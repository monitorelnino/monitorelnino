name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (17/10/2026), nunca mesclado: só mede SIH, SIM e Registro Civil por causa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: Coleta real do SIH por 10 minutos (sem commit)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 coletar_sih.py --sondar 2>&1 | tail -3
          python3 coletar_sih.py --prazo 10 2>&1
          python3 -c "
          import json;p=json.load(open('data/saude_desfechos/internacoes_progresso.json'))
          print('lidos',len(p['arquivos']),'faltam',p['faltam'],'falhas',p['falhas_da_rodada'][:5])
          for k in sorted(p['contagens'])[-6:]: print(k,p['contagens'][k])
          "
