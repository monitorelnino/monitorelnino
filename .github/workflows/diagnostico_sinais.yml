name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (19/10/2026), nunca mesclado: mede a leitura do SIH no executor, sem commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: SIH por 10 minutos (sem commit)
        timeout-minutes: 20
        run: |
          nproc
          time python3 coletar_sih.py --orcamento 600 2>&1 | tail -5
          python3 - <<'PY'
          import json
          o = json.load(open("data/saude_desfechos/internacoes_respiratorias.json"))
          meses = sorted({p for s in o["serie"].values() for p, v in s.items() if v is not None})
          print("meses com valor:", len(meses), meses[:2], meses[-2:])
          print("lacunas:", o["lacunas"])
          print("BR ult:", o["ultimo"].get("BR"), "cortes:", o["cortes_mapa"]["cortes"])
          print("bytes:", {n: __import__("os").path.getsize(f"data/saude_desfechos/{n}.json") for n in ("internacoes_respiratorias", "hepatite_a")})
          PY
