name: Diagnóstico pontual — fontes de sinais de risco

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Sondar a lista de municípios monitorados pelo Cemaden (A1, 17/10/2026; ramo de diagnóstico, nunca mesclado)
        run: |
          UA="MonitorElNinoBrasil/2.2.4 (+https://monitorelnino.com.br; sonda da lista do Cemaden)"
          B="https://www.gov.br/cemaden/pt-br/cemaden-amplia-a-lista-de-municipios-monitorados-de-1038-para-1133"
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          for f in MunicipiosMonitorados2021.pdf 95_munic_Lista_.pdf; do
            curl -sS -A "$UA" -m 60 -o "$f" -w "$f %{http_code} %{size_download} %{content_type}\n" "$B/$f" || true
            sha256sum "$f" || true
            pdftotext -layout "$f" "$f.txt" && wc -l "$f.txt" && head -40 "$f.txt" && echo ... && tail -15 "$f.txt"
          done
          curl -sS -A "$UA" -m 60 "https://www.gov.br/cemaden/pt-br/municipios-monitorados" -o mm.html -w "municipios-monitorados %{http_code}\n" || true
          grep -o 'href="[^"]*\(pdf\|xlsx\|csv\)"' mm.html | head -20 || true
