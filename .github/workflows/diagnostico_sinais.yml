name: Diagnóstico pontual — fontes de sinais de risco

# 04/09/2026: ferramenta de uma vez para testar, com rede real, os endpoints
# candidatos das fontes que nunca coletaram (monitor_secas, inpe_fogo,
# cemaden_alertas, iri_plume). Não faz parte do pipeline regular; roda só
# sob disparo manual e não grava nada em data/. Resultado vai para o
# repositório privado (mesmo padrão dos relatórios do robô) em vez de
# artefato do Actions — o artefato fica em blob storage externo, inacessível
# ao ambiente de edição.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Sondar o Portal da Transparência (por que a chave é recusada)
        continue-on-error: true
        env:
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
        run: |
          set -o pipefail
          python3 scripts/sondar_portal_transparencia.py 2>&1 | tee /tmp/portal.log
      - name: Sondar o TransfereGov (repositório de CSVs e APIs sem chave)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/sondar_transferegov.py 2>&1 | tee /tmp/transferegov.log
      - name: Sonda das probabilidades ENSO (IRI/CPC) — candidatos de endpoint
        continue-on-error: true
        run: |
          python3 scripts/sondar_enso_probabilidades.py 2>&1 | tee /tmp/enso.log
      - name: Diagnóstico do Querido Diário (resultado conhecido; PR-N0 §1.1)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/diagnosticar_querido_diario.py 2>&1 | tee /tmp/qd.log
      - name: Testar endpoints candidatos
        run: |
          set -o pipefail
          python3 scripts/diagnosticar_fontes_sinais.py 2>&1 | tee /tmp/diagnostico.log
      # 11/09/2026: na primeira rodada real com os quatro coletores estaduais de saúde
      # (MS, DF, PE, PB) TODOS declararam lacuna, enquanto os mesmos documentos abrem do
      # ambiente de edição e de um navegador no Brasil. Esta sonda mede código HTTP, tipo e
      # início do corpo de cada fonte com dois User-Agents, para separar bloqueio por IP do
      # runner (fora do Brasil) de bloqueio por UA. Não coleta nem grava nada.
      - name: Sondar as fontes estaduais de saúde (por que os coletores não baixam)
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/diagnostico_fontes_saude.py 2>&1 | tee /tmp/saude.log
      # 12/09/2026: as rodadas completas de atualizar.py levam 35-90 min (varredura municipal +
      # DOEs + os 4 coletores de saúde), caras demais só para testar os coletores de saúde depois
      # de cada correção. Este passo roda SÓ os quatro, com dependências reais, sem a varredura.
      # Não comita nada: só mostra se cada um lê a série real e qual o conteúdo, para depurar rápido.
      - name: Instalar dependências (para testar os coletores de saúde isoladamente)
        run: pip install -r requirements.txt --break-system-packages -q
      - name: Rodar só os 4 coletores estaduais de saúde (sem a varredura municipal)
        continue-on-error: true
        run: |
          set -o pipefail
          {
            for c in coletar_boletim_ms_dengue coletar_boletim_df_arboviroses coletar_boletim_pe_arboviroses coletar_boletim_pb_arboviroses; do
              echo "=== $c ==="
              python3 "$c.py" || true
            done
            echo "=== arquivos gerados ==="
            ls -la data/saude_desfechos/ses_*.json 2>&1 || echo "(nenhum)"
            echo "=== conteúdo (se houver) ==="
            for f in data/saude_desfechos/ses_ms_dengue.json data/saude_desfechos/ses_df_arboviroses.json data/saude_desfechos/ses_pe_arboviroses.json data/saude_desfechos/ses_pb_arboviroses.json; do
              if [ -f "$f" ]; then echo "--- $f ---"; python3 -c "import json;d=json.load(open('$f'));print(json.dumps(list((d.get('serie') or {}).values())[-1] if d.get('serie') else d, ensure_ascii=False, indent=1)[:3000])"; fi
            done
          } 2>&1 | tee /tmp/coletores_saude.log
      - name: Publicar resultado no repositório privado
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          mkdir -p /tmp/registro/relatorios
          cp /tmp/diagnostico.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_diagnostico_sinais.txt"
          cp /tmp/portal.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_portal_transparencia.txt" 2>/dev/null || true
          cp /tmp/transferegov.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_transferegov.txt" 2>/dev/null || true
          cp /tmp/qd.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_querido_diario.txt" 2>/dev/null || true
          cp /tmp/enso.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_enso_probabilidades.txt" 2>/dev/null || true
          cp /tmp/saude.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_fontes_saude.txt" 2>/dev/null || true
          cp /tmp/coletores_saude.log "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_coletores_saude_isolado.txt" 2>/dev/null || true
          mkdir -p /tmp/registro/leituras/querido_diario && cp -r leituras_qd/. "/tmp/registro/leituras/querido_diario/$(date -u +%Y-%m-%d_%H%M%S)/" 2>/dev/null || true
          cd /tmp/registro && git config user.name monitor-el-nino-bot && git config user.email bot@users.noreply.github.com
          git add -A && git commit -q -m "diagnostico_sinais ${GITHUB_SHA::7}" && git push
