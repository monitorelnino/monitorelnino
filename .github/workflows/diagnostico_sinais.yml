name: Diagnóstico pontual — fontes de sinais de risco

# 13/10/2026: ramo de diagnóstico, nunca mesclado. Sonda o painel de calor do MS (decisão 10 da central).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Sondar o painel de calor do MS
        run: |
          python3 - <<'PY'
          import re, json, urllib.parse, urllib.request
          import coletar_saude as cs
          def get(u):
              r = urllib.request.Request(u, headers={"User-Agent": "MonitorElNino/diagnostico (+https://monitorelnino.com.br)"})
              with urllib.request.urlopen(r, timeout=40) as x:
                  return x.status, x.headers.get("content-type"), x.read().decode("utf-8", "replace")
          st, ct, casca = get(cs.CALOR_MS_SITIO)
          print("casca", st, ct, len(casca))
          print("scripts:", re.findall(r'src="([^"]+\.js)"', casca)[:10])
          bundles = re.findall(r"(assets/[\w./-]+\.js)", casca)
          print("bundles:", bundles[:10])
          for b in bundles[:3]:
              st, ct, js = get(cs.CALOR_MS_SITIO + b)
              hs = list(dict.fromkeys(re.findall(r"\(`([0-9a-f]{64})`\)", js)))
              print("bundle", b, st, len(js), "handlers", len(hs))
              print("  outros hashes 64:", len(set(re.findall(r"[0-9a-f]{64}", js))))
              print("  _serverFn ocorrencias:", js.count("_serverFn"), " createServerFn:", js.count("createServerFn"))
              for m in re.finditer(r".{0,120}_serverFn.{0,160}", js):
                  print("  CTX:", m.group(0)[:280]); break
              dia = "2026-10-12"
              payload = {"t": {"t": 10, "i": 0, "p": {"k": ["data"], "v": [{"t": 10, "i": 1, "p": {"k": ["date"], "v": [{"t": 1, "s": dia}]}, "o": 0}]}, "o": 0}, "f": 63, "m": []}
              q = urllib.parse.quote(json.dumps(payload, separators=(",", ":")), safe="")
              for h in hs:
                  try:
                      st, ct, b2 = get(f"{cs.CALOR_MS_SITIO}_serverFn/{h}?payload={q}")
                      print("  H", h[:12], st, ct, len(b2), repr(b2[:300]))
                  except Exception as e:
                      print("  H", h[:12], "ERRO", type(e).__name__, str(e)[:200])
          PY
