name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (17/10/2026), nunca mesclado: só mede SIH, SIM e Registro Civil por causa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: Sondar SIH (FTP, .dbc, TabNet)
        continue-on-error: true
        timeout-minutes: 12
        run: python3 coletar_sih.py --sondar 2>&1
      - name: Tempo de baixar e ler RD grandes
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 -c "
          import time
          from coletar_datasus_dbc import baixar_ftp, ler_dbc
          from coletar_sih import agregar, CAMPOS
          for uf in ('PE','SP'):
              t0=time.time(); b=baixar_ftp('/dissemin/publicos/SIHSUS/200801_/Dados/RD%s2501.dbc'%uf); t1=time.time()
              _d,l=ler_dbc(b,CAMPOS); regs=[dict(r,_UF=uf) for r in l]; t2=time.time()
              a=agregar(regs); t3=time.time()
              print(uf, len(b)//2**20,'MB baixar %.1fs ler %.1fs agregar %.1fs'%(t1-t0,t2-t1,t3-t2), 'total', a['total'][uf])
          "
