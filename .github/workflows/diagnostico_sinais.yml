name: Diagnóstico pontual — fontes de sinais de risco
# 15/09/2026: ferramenta reaproveitada, só neste ramo (mesmo workflow id), para uma
# checagem pontual de verificar_links.py com rede real (ver histórico do arquivo para
# os usos anteriores — nunca faz parte do pipeline regular).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sondar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with: { python-version: "3.12" }
      - run: pip install --quiet requests
      - name: Rodar verificar_links.py (rede real, 11 páginas + JS externo)
        run: python3 verificar_links.py > /tmp/links_relatorio.txt 2>&1 || true
      - name: Publicar
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          cp /tmp/links_relatorio.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_verificar_links_completo.txt"
          cd /tmp/registro && git -c user.name=monitor-el-nino-bot -c user.email=bot@users.noreply.github.com add -A && git -c user.name=monitor-el-nino-bot -c user.email=bot@users.noreply.github.com commit -q -m "verificar_links_completo" && git push
