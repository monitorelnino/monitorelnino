name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (17/10/2026), nunca mesclado: só mede SIH, SIM e Registro Civil por causa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: Sondar SIH (FTP, .dbc, TabNet)
        continue-on-error: true
        timeout-minutes: 12
        run: python3 coletar_sih.py --sondar 2>&1
      - name: Tamanho dos RD do SIH por ano
        continue-on-error: true
        run: |
          python3 -c "
          from coletar_datasus_dbc import listar_ftp
          import re,collections
          t=collections.Counter();n=collections.Counter();uf=collections.Counter()
          for nome,tam in listar_ftp('/dissemin/publicos/SIHSUS/200801_/Dados'):
              m=re.match(r'RD([A-Z]{2})(\\d{2})(\\d{2})\\.DBC',nome.upper())
              if m and tam:
                  a=2000+int(m.group(2)); t[a]+=tam; n[a]+=1
                  if a==2025: uf[m.group(1)]+=tam
          for a in sorted(t):
              if a>=2019: print(a, n[a], 'arquivos', round(t[a]/2**20), 'MB')
          print('2025 por UF (MB):', {k: round(v/2**20) for k,v in uf.most_common()})
          "
