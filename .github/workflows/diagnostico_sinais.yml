name: Diagnóstico pontual — fontes de sinais de risco

# 04/09/2026: ferramenta de uma vez para testar, com rede real, os endpoints
# candidatos das fontes que nunca coletaram (monitor_secas, inpe_fogo,
# cemaden_alertas, iri_plume). Não faz parte do pipeline regular; roda só
# sob disparo manual e não grava nada em data/. Resultado vai para o
# repositório privado (mesmo padrão dos relatórios do robô) em vez de
# artefato do Actions — o artefato fica em blob storage externo, inacessível
# ao ambiente de edição.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 14/09/2026: teto explícito — a sonda do DF já segurou o runner minutos a fio em timeouts
    # de TLS; sem isto um passo travado poderia ocupar o runner por até 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Sonda rotas DOE (janela A3, ramo diag)
        run: |
          python3 coletar_edicoes_doe.py --uf RJ --desde 2026-10-14 --ate 2026-10-16
          python3 coletar_edicoes_doe.py --uf MG --desde 2026-10-13 --ate 2026-10-16
          python3 -c "import json;[print(u, json.dumps({k:{kk:v.get(kk) for kk in ('decisao','paginas','paginas_com_texto','termos_achados','url')} for k,v in json.load(open(f'data/doe_edicoes/{u}.json'))['edicoes'].items() if k>='2026-10-13'}, ensure_ascii=False)) for u in ('RJ','MG')]"
