name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (19/10/2026), nunca mesclado: lista e decodifica arquivos do DATASUS, sem commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: Sondar SINAN-TB e SIH
        run: |
          python3 - <<'PY'
          import ftplib, io, glob, importlib
          f = ftplib.FTP("ftp.datasus.gov.br", timeout=60); f.login("anonymous", "monitorelnino.com.br")
          for pasta in ("FINAIS", "PRELIM"):
              f.cwd(f"/dissemin/publicos/SINAN/DADOS/{pasta}")
              n = f.nlst()
              print(pasta, "TB:", sorted(x for x in n if x.upper().startswith(("TUBE", "TUBC", "TB")))[-8:])
          f.cwd("/dissemin/publicos/SINAN/DADOS/PRELIM")
          alvo = sorted(x for x in f.nlst() if x.upper().startswith("TUBEBR"))
          print("alvo", alvo)
          if alvo:
              b = io.BytesIO(); f.retrbinary("RETR " + alvo[-1], b.write); print("bytes", len(b.getvalue()))
              open("/tmp/tb.dbc", "wb").write(b.getvalue())
          PY
          python3 - <<'PY'
          import collections, coletar_datasus_dbc as d
          dados = open("/tmp/tb.dbc", "rb").read()
          n = 0; c = collections.Counter(); campos = None
          for r in d.ler_dbc(dados):
              n += 1
              if campos is None: campos = list(r)
              c[r.get("SITUA_ENCE")] += 1
          print("registros", n); print("campos", campos[:80] if campos else None)
          print("SITUA_ENCE", c.most_common(12))
          PY
