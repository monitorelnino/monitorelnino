name: Diagnóstico pontual — fontes de sinais de risco

# RAMO DE SONDA DA E2 (17/10/2026), nunca mesclado: só mede SIH, SIM e Registro Civil por causa.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -q
      - name: Sondar SIH (FTP, .dbc, TabNet)
        continue-on-error: true
        timeout-minutes: 12
        run: python3 coletar_sih.py --sondar 2>&1
      - name: Sondar óbitos (Registro Civil por causa, SIM no FTP e no portal)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          python3 coletar_obitos.py 2>&1
          python3 -c "
          import json;o=json.load(open('data/saude_desfechos/obitos.json'))
          print('chaves',sorted(o));print('BR ultimos',list(o['serie']['BR'].items())[-4:]);print('ultimo SP',o['ultimo']['SP']);print('cortes',o['cortes_mapa']);print('lacunas',o['lacunas']);print('faixa AC 01',o['faixa_habitual']['AC'].get('01'))
          "
