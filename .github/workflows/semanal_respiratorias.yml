# Válvula de SONDAGEM (janela E1, 17/10/2026): este ramo não vai à main. Só mede e imprime.
name: Semanal — doenças respiratórias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, sparse-checkout-cone-mode: false, sparse-checkout: "/*.py\n/requirements.txt\n/scripts/\n/config/\n/data/robots_registro.json\n/data/painel_coletores.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sondar
        run: |
          python3 sonda_e1.py tabnet || true
          python3 sonda_e1.py ckan || true
          python3 sonda_e1.py sisab || true
          python3 sonda_e1.py fontes "https://www.gov.br/saude/pt-br/centrais-de-conteudo/publicacoes/svsa/vigilancia-ambiental/plano-de-contingencia-seca-e-estiagem.pdf" "https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/e/enchentes" "https://www.gov.br/saude/pt-br/assuntos/saude-de-a-a-z/c/calor" "https://www.gov.br/saude/pt-br/centrais-de-conteudo/publicacoes/notas-tecnicas/2023/nota-tecnica-conjunta-onda-calor.pdf" || true
