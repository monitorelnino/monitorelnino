# Válvula de SONDAGEM (janela E1, 17/10/2026): este ramo não vai à main. Só mede e imprime.
name: Semanal — doenças respiratórias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, sparse-checkout-cone-mode: false, sparse-checkout: "/*.py\n/requirements.txt\n/scripts/\n/config/\n/data/robots_registro.json\n/data/painel_coletores.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sondar
        run: |
          python3 coletar_datasus_dbc.py --sondar || true
          python3 coletar_tabnet.py --sondar || true
          python3 coletar_sisab.py --sondar || true
