# Válvula coleta-dia (janela E1, 19/10/2026): leptospirose pela primeira vez, com o código da main.
# Este arquivo só existe assim neste ramo; o PR de dado volta com o original.
name: Semanal — doenças respiratórias

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  respiratorias:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: desfechos-sus
      timeout_minutos: 60
      comandos: |
        coletar_datasus_dbc.py --desfecho leptospirose
        coletar_sisab.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
