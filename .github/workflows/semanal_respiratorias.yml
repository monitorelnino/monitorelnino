# Válvula de SONDAGEM (janela E1, 17/10/2026): este ramo não vai à main. Só mede e imprime.
name: Semanal — doenças respiratórias

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false, sparse-checkout-cone-mode: false, sparse-checkout: "/*.py\n/requirements.txt\n/scripts/\n/config/\n/data/robots_registro.json\n/data/painel_coletores.json\n/data/geo_uf.json\n/data/municipios_ibge_referencia.json\n/data/populacao_censo2022.json" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sondar
        run: |
          CHAVES='(leptospirose|casos prov|casos confirmados|Semana Epidemiol|SE ?\d{1,2})' python3 sonda_e1.py fontes "https://saude.rs.gov.br/upload/arquivos/202607/20122514-informativo-epidemiologico-arboviroses-2026-ate-se-27.pdf" "https://rondonia.ro.gov.br/wp-content/uploads/2026/08/BOLETIMARBOVIROSES_-semana-28-de-2025-a-sem-27-de-2026.pdf" "https://vigilancia.saude.rr.gov.br/wp-content/uploads/2026/02/Boletim-de-Monitoramento-Epidemiologico-–-ARBOVIROSES-–-2026_001.pdf" "https://goias.gov.br/saude/boletins-epidemiologicos/" "https://saude.rs.gov.br/informativos-epidemiologicos" || true
