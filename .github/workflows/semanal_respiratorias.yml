# Válvula E1 (temporária; nunca mesclar): só a sonda do SRAG.
name: Semanal — doenças respiratórias

on:
  schedule:
    - cron: "30 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  respiratorias:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: respiratorias
      grupo_de_concorrencia: noturno
      timeout_minutos: 60
      comandos: |
        sondar_srag_e1.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
