# Doenças respiratórias — rotina própria, semanal.
#
# POR QUE ELA EXISTE (02/10/2026)
# Os dois coletores de respiratórias estavam na rotina `semanal_sinais_e_links.yml`, que tem teto de
# 150 minutos e quinze comandos — entre eles os sinais climáticos por município, que são o passo
# mais longo do projeto. Na primeira execução real, de 01/10/2026 (run 36940396433), o job BATEU NO
# TETO e foi cancelado em 2h30: nenhum dos coletores do fim da fila rodou, e o de SRAG é um deles.
# Fila longa não é cadência: o que está no fim nunca roda.
#
# Separar custa um job e resolve três coisas: SRAG e síndrome gripal passam a ter cadência própria e
# declarada, a rotina de sinais encurta, e a falha de um não arrasta o outro.
name: Semanal — doenças respiratórias

on:
  schedule:
    # Domingo, 5h30 de Brasília — depois da rotina de sinais (4h30) e antes da publicação da manhã.
    - cron: "30 8 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs (10/10/2026)

jobs:
  respiratorias:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: sonda-sih
      # Válvula coleta-dia (janela E2, 17/10/2026): sondagem SIH/SIM/Registro Civil. Este ramo não vai à main.
      timeout_minutos: 45
      comandos: |
        scripts/coletar_sih.py --sondar --uf AC --aamm 2607
        scripts/coletar_sih.py --sondar --uf CE --aamm 2607
        scripts/coletar_obitos.py --sondar --uf AC
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
