# Preservação de evidência (baixar, ler texto, OCR) — 1h de Brasília (04:00 UTC), lotes pequenos.
#
# Item 1 do handover de desacoplamento e cadência do item 1b. É o passo mais lento da rodada antiga:
# download de PDF, extração de texto e OCR de escaneado, com teto somado de 75 min dentro do job
# monolítico. Em job próprio, ele pode demorar sem levar a publicação com ele.
# 30/09/2026 (item 7 da rodada 2 — certificação dos coletores). O cron do GitHub é de MELHOR
# ESFORÇO: atrasa sob carga e descarta. Medido em 30/09: `noturno_diarios`, com cron de 01:30 UTC,
# começou às 06:59 (5h30 de atraso) e morreu no teto; a busca web, com cinco crons por noite, rodou
# duas vezes por dia, uma delas às 13:22 UTC — dentro do horário de trabalho da editoria, que é
# justamente o que a janela noturna existe para evitar.
#
# A noite passa a ser UMA CORRENTE: um disparo cedo (00:05 UTC) e cada elo acionado quando o
# anterior TERMINA. Cinco horários independentes davam cinco oportunidades de atrasar; um disparo e
# uma corrente dão uma. A ordem é:
#
#   diários → descoberta → busca web → evidências → juiz → sinais
#
# RECUPERAÇÃO, de propósito: o gatilho NÃO filtra por conclusão. Se o elo anterior falhou ou foi
# cancelado, o seguinte roda assim mesmo — cada coletor processa a fila pendente independentemente
# do horário, e uma noite perdida não pode levar a seguinte junto. `workflow_dispatch` continua em
# todos, para rodar à mão quando preciso.
name: Noturno — evidências e OCR

on:
  workflow_run:
    # 03/10/2026 (item A.3 do handover): as evidências e o OCR passam a ser acionados pela
    # **descoberta**, e não pelo funil quinzenal de saúde. Em 02→03/10 este elo NÃO RODOU: ele
    # pendia de um workflow que roda a cada quinze dias, e numa noite em que o funil não rodou a
    # corrente pulava as evidências inteiras — documento preservado é prova, e prova não pode
    # depender da quinzena. A ordem passa a ser diários → descoberta → evidências e OCR → juiz.
    workflows: ["Noturno — descoberta"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidencias:
    # 06/10/2026 (item 5): o ensaio real dispara este workflow no ramo `ensaio` e o elo
    # empurra para la, nao para a `main`. Na rotina o padrao continua sendo `main`.
    uses: ./.github/workflows/_coletor.yml
    with:
      ramo_destino: ${{ github.ref_name == 'ensaio' && 'ensaio' || 'main' }}
      nome: evidencias
      timeout_minutos: 90
      precisa_tesseract: true
      comandos: |
        preservar_evidencias.py --limite 20
        preservar_evidencias.py --ler --limite 20
        preservar_evidencias.py --ocr --limite 6
        scripts/preservar_textos_integrais.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}

  # Item 3 (28/09/2026): o binário preservado nesta noite vai para o ativo de Release do mês, com URL
  # estável, ANTES de o job terminar. Sem este passo, ignorar binário novo no git faria a prova
  # desaparecer com o runner — é ele que torna o `.gitignore` seguro.
  publicar_lote:
    needs: evidencias
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    permissions:
      contents: write          # criar e atualizar o Release do mês
    concurrency:
      group: lote-de-evidencias
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Montar o lote do mês
        id: lote
        run: |
          MES=$(date -u +%Y-%m)
          echo "mes=$MES" >> "$GITHUB_OUTPUT"
          python3 scripts/empacotar_evidencias.py --mes "$MES" --saida /tmp || true
          ls -la /tmp/evidencias-*.zip 2>/dev/null || echo "sem lote a publicar"

      - name: Publicar como ativo de Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MES="${{ steps.lote.outputs.mes }}"
          PACOTE="/tmp/evidencias-${MES}.zip"
          [ -f "$PACOTE" ] || { echo "sem pacote — nada a publicar"; exit 0; }
          # `--clobber` porque o lote do mês é regravado a cada noite: ele é cumulativo, não incremental.
          gh release view "evidencias-${MES}" >/dev/null 2>&1             || gh release create "evidencias-${MES}" --title "Evidências preservadas — ${MES}"                  --notes "Lote mensal de evidências preservadas (item 3, 28/09/2026). Índice em INDICE.tsv; a chave de cada arquivo é o sha256 do binário."
          gh release upload "evidencias-${MES}" "$PACOTE" --clobber
          echo "### Lote de evidências" >> "$GITHUB_STEP_SUMMARY"
          echo "\`evidencias-${MES}\`: $(du -h "$PACOTE" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
