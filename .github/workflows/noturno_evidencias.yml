# Preservação de evidência (baixar, ler texto, OCR) — 1h de Brasília (04:00 UTC), lotes pequenos.
#
# Item 1 do handover de desacoplamento e cadência do item 1b. É o passo mais lento da rodada antiga:
# download de PDF, extração de texto e OCR de escaneado, com teto somado de 75 min dentro do job
# monolítico. Em job próprio, ele pode demorar sem levar a publicação com ele.
# Elo da corrente noturna: ordem, gatilho e reserva na skill `noite-e-coletores` (história:
# docs/HISTORICO_DE_REGIMES.md).
name: Noturno — evidências e OCR

on:
  workflow_run:
    # 03/10/2026 (item A.3 do handover): as evidências e o OCR passam a ser acionados pela
    # **descoberta**, e não pelo funil quinzenal de saúde. Em 02→03/10 este elo NÃO RODOU: ele
    # pendia de um workflow que roda a cada quinze dias, e numa noite em que o funil não rodou a
    # corrente pulava as evidências inteiras — documento preservado é prova, e prova não pode
    # depender da quinzena. A ordem passa a ser diários → descoberta → evidências e OCR → juiz.
    workflows: ["Noturno — descoberta"]
    # 08/10/2026 (A2-05): `workflow_run` dispara para run do workflow nomeado em QUALQUER
    # ramo. Sem esta linha, diários do `ensaio` puxavam a corrente inteira na `main` — quatro
    # descobertas medidas em 07/10, uma delas cancelando a triagem pendente.
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs (10/10/2026)

jobs:
  evidencias:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: evidencias
      # 08/10/2026 (A2-27): este elo commita `data/evidencias.json`, as filas de pista,
      # o `saude_pipeline` e o manifesto -- e um dos conflitantes da noite, e corria FORA
      # da fila, em paralelo com juiz e triagem.
      grupo_de_concorrencia: noturno
      timeout_minutos: 90
      precisa_tesseract: true
      comandos: |
        preservar_evidencias.py --limite 20
        preservar_evidencias.py --ler --limite 20
        preservar_evidencias.py --ocr --limite 6
        scripts/preservar_textos_integrais.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      # 08/10/2026 (A2-28): sem o `ROBO_TOKEN`, o tique oportunista roda com o
      # `GITHUB_TOKEN`, que não alcança o `robo-registro`, e a Issue de alarme
      # falha em silêncio por causa do `|| true`.
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
