# pacote_do_blog.yml — o pacote de dados de onde a central escreve o texto da semana
# ===================================================================================
# `HANDOVER_blog_rotina_semanal_04-10-2026.md`, item 1.
#
# Dois pacotes por semana, nos horários que a editoria fixou:
#   legal  — domingo às 06:00 de Brasília (09:00 UTC); semana de domingo a sábado já encerrada.
#   saude  — quarta às 06:00 de Brasília (09:00 UTC); última semana epidemiológica fechada.
#
# MINUTO FORA DO PICO E RESERVA, como na corrente noturna: o cron do GitHub é de melhor esforço, e
# em 03 e 04/10 ele não disparou a abertura da noite por duas noites seguidas. Aqui o custo de
# perder um disparo é a central ficar sem pacote na segunda — então o mesmo desenho se aplica: cron
# em minuto ímpar e um segundo disparo meia hora depois. A reserva é segura porque o gerador é
# IDEMPOTENTE: ele reescreve o mesmo arquivo a partir do mesmo dado, e o nome do arquivo é a data
# de fim da semana, não a hora da execução.
name: Pacote do blog

on:
  schedule:
    - cron: "17 9 * * 0"    # domingo, 06h17 de Brasília — Legal e financiamento
    - cron: "47 9 * * 0"    # reserva
    - cron: "17 9 * * 3"    # quarta, 06h17 — Saúde
    - cron: "47 9 * * 3"    # reserva
  workflow_dispatch:
    inputs:
      linha:
        description: "legal | saude (vazio = pela data: domingo é legal, quarta é saúde)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pacote-do-blog
  cancel-in-progress: false

jobs:
  pacote:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # 04/10/2026 (item 2c do handover dos temporizadores): OBSERVADOR OPORTUNISTA.
      # Cada execução de qualquer coisa vira um tique de relógio. São segundos, sem job extra, e é
      # o observador mais barato que existe: se este workflow conseguiu rodar, o agendador está
      # vivo o suficiente para despachar o que estiver devido. `|| true` porque o despachante é
      # auxiliar — a falha dele não pode derrubar a coleta que ia rodar.
      - name: Tique oportunista
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/despachar_temporizadores.py --origem oportunista \
            --so-ler-e-despachar || true

      - run: pip install -r requirements.txt

      - name: Qual linha
        id: linha
        run: |
          ESCOLHA="${{ inputs.linha }}"
          if [ -z "$ESCOLHA" ]; then
            # 0 = domingo, 3 = quarta. Fora desses dias, o disparo à mão sem `linha` gera o Legal,
            # que é o pacote mais usado — e o nome do arquivo diz qual é, então nada se confunde.
            case "$(date -u +%u)" in
              7) ESCOLHA=legal ;;
              3) ESCOLHA=saude ;;
              *) ESCOLHA=legal ;;
            esac
          fi
          echo "linha=$ESCOLHA" >> "$GITHUB_OUTPUT"
          echo "pacote da linha $ESCOLHA"

      - name: Gerar o pacote
        run: python3 gerar_pacote_blog.py --linha "${{ steps.linha.outputs.linha }}" --saida pacotes

      # O pacote é material da central e vive no repositório PRIVADO — nunca no site. O mesmo
      # mecanismo que publica os relatórios de diagnóstico leva o arquivo para lá.
      # 05/10/2026 — A EDITORIA DECIDIU: O PACOTE FICA NO ARTEFATO.
      #
      # Aqui havia um passo que clonava o `robo-registro` e commitava o pacote lá. Ele nasceu
      # tentando levar o pacote ao repositório da editoria, falhou com `Repository not found`
      # (usava `ROBO_DEPLOY_KEY` por SSH, enquanto os nove outros gravadores do privado clonam por
      # HTTPS com `ROBO_TOKEN`), e a pergunta foi levada à editoria: dar acesso à chave, ou deixar o
      # pacote só no artefato?
      #
      # **Ela escolheu o artefato.** O passo sai inteiro. Isto não é uma limitação técnica
      # contornada: `ROBO_TOKEN` já alcança o privado e não exigiria acesso novo nenhum — levar o
      # pacote lá sairia de graça. A editoria decidiu que ele não deve ir, e a decisão é dela.
      #
      # O que fica, então: o pacote da semana vive no artefato do run que o gerou, e a central o
      # baixa quando vai escrever. Quem precisar dele no `robo-registro` o gera à mão, por
      # `python3 gerar_pacote_blog.py --linha legal|saude --semana AAAA-MM-DD`, que grava
      # direto em `robo-registro/blog/pacotes/` — foi assim que os dois pacotes da semana encerrada
      # em 03/10 chegaram lá.
      #
      # Consequência que fica dita: o artefato do GitHub **expira** (90 dias, o padrão do
      # repositório). Pacote que a central não baixar dentro do prazo se regera pelo comando acima,
      # com os mesmos dados, porque o gerador é função do corte e não do run.
      - name: Guardar o pacote como artefato (sempre)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pacote-do-blog
          path: pacotes/
          if-no-files-found: warn

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Pacote do blog"
            echo ""
            echo "- linha: ${{ steps.linha.outputs.linha }}"
            ls -1 pacotes/ 2>/dev/null | sed 's/^/- /' || echo "- nenhum arquivo gerado"
            echo ""
            echo "O pacote fica no **artefato \`pacote-do-blog\`** deste run, por decisão da"
            echo "editoria de 05/10/2026. Para tê-lo em \`robo-registro/blog/pacotes/\`, rode"
            echo "\`python3 gerar_pacote_blog.py --linha <legal|saude> --semana AAAA-MM-DD\`."
          } >> "$GITHUB_STEP_SUMMARY"
