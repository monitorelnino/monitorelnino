name: Verificar o site publicado (domínio real)

# 14/09/2026: camada pós-deploy. Roda por botão (modo escolhido) e todo dia às 10h UTC
# em modo neutro (sem exigir robots): páginas do sitemap em 200, cabeçalhos, integridade
# SHA-256 contra o manifesto da main, canários. Só relata — nunca publica nem reverte.
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'flag (padrão: data/publicacao.json) · noindex · index · neutro'
        type: choice
        options: [noindex, index, neutro]
        default: neutro
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "20" }
      - name: Verificar
        continue-on-error: true
        env:
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
        run: |
          # 14/09/2026 (§1.1): sem input, o modo vem de data/publicacao.json (indexar=false → noindex OBRIGATÓRIO, cabeçalho e meta).
          M="${{ inputs.modo || 'flag' }}"; F=""
          [ "$M" = "noindex" ] && F="--esperar-noindex"; [ "$M" = "index" ] && F="--esperar-index"; [ "$M" = "neutro" ] && F="--neutro"
          node scripts/verificar_publicado.js --base https://monitorelnino.com.br $F 2>&1 | tee /tmp/verificar_publicado.txt
      # 14/09/2026: o verificador vê um script /.netlify/scripts/hud injetado em toda página. A editoria não acha o interruptor
      # ("Collaboration tools" pode não existir num projeto sem Git ligado). Pergunta ao Netlify, pela API, quais campos do
      # projeto falam de HUD/colaboração/injeção de snippet — só leitura; valores mascarados; nunca imprime o token.
      # 14/09/2026: canário em Chromium real contra o domínio — nossos scripts rodam sob a CSP por caminho; só a injeção do Netlify é bloqueada
      - name: Canário no navegador (Playwright) contra o domínio
        continue-on-error: true
        timeout-minutes: 10
        env:
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
        run: |
          npm ci --silent 2>/dev/null || npm install --silent
          npx playwright install --with-deps chromium >/dev/null 2>&1 || npx playwright install chromium
          node scripts/verificar_publicado_navegador.js --base https://monitorelnino.com.br 2>&1 | tee /tmp/publicado_navegador.txt
      - name: DIAGNOSTICO_TEMP_conferir_texto_especifico
        continue-on-error: true
        env:
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
        run: |
          node -e '
          const https = require("https");
          function buscar(url) {
            return new Promise((resolve, reject) => {
              const cab = {};
              if (process.env.PREVIA_BASIC_AUTH) cab["Authorization"] = "Basic " + Buffer.from(process.env.PREVIA_BASIC_AUTH).toString("base64");
              https.get(url, { headers: cab }, res => { let d = ""; res.on("data", c => d += c); res.on("end", () => resolve({status: res.statusCode, corpo: d})); }).on("error", reject);
            });
          }
          (async () => {
            for (const pagina of ["", "saude.html"]) {
              const r = await buscar("https://monitorelnino.com.br/" + pagina);
              console.log("=== " + (pagina || "index.html") + " status " + r.status + " " + r.corpo.length + " bytes ===");
              console.log("tem contadorTempo:", r.corpo.includes("contadorTempo"));
              console.log("tem Monitor de Antecipacao:", r.corpo.includes("Monitor de Antecipa\u00e7\u00e3o"));
              console.log("tem Medida de Antecipacao (deveria ser false):", r.corpo.includes("Medida de Antecipa\u00e7\u00e3o"));
              console.log("tem MARE Legal:", r.corpo.includes("MAR\u00c9 Legal"));
              const i = r.corpo.indexOf("contadorTempo");
              console.log("trecho:", i >= 0 ? r.corpo.slice(Math.max(0,i-80), i+220) : "(NAO ENCONTRADO)");
            }
          })();
          '
      - name: Sondar as configurações do projeto no Netlify (HUD, snippets, colaboração) — só leitura
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          {
            echo "=== getSite: chaves e valores ligados a HUD / drawer / snippet / collab / processing ==="
            npx --yes netlify-cli@17 api getSite --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" 2>/dev/null | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          def walk(o,pre=""):
              if isinstance(o,dict):
                  for k,v in o.items(): walk(v,pre+"."+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o[:20]): walk(v,pre+"[%d]"%i)
              else:
                  if any(t in pre.lower() for t in ("hud","drawer","snippet","collab","processing","pretty","inject","script")): print(pre, "=", str(o)[:120])
          walk(d)
          print("(chaves de 1º nível:", ", ".join(sorted(d.keys()))[:1500], ")")'
            echo; echo "=== snippets do projeto (injeção de script pelo painel) ==="
            npx --yes netlify-cli@17 api listSiteSnippets --data "{\"site_id\":\"$NETLIFY_SITE_ID\"}" 2>/dev/null | head -c 2000
          } > /tmp/netlify_config.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g; s/${NETLIFY_SITE_ID}/[SITE_ID]/g" /tmp/netlify_config.txt
          cat /tmp/netlify_config.txt
      - name: Registrar relatório no repositório privado
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          mkdir -p /tmp/registro/relatorios
          cp /tmp/publicado_navegador.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_verificar_publicado_navegador.txt" 2>/dev/null || true
          cp /tmp/netlify_config.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_netlify_config.txt" 2>/dev/null || true
          cp /tmp/verificar_publicado.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_verificar_publicado.txt"
          cd /tmp/registro && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "verificar_publicado ${GITHUB_SHA::7}" && git push -q
