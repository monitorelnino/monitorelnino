name: Atualização semanal de dados

on:
  schedule:
    - cron: "0 3 * * 0"  # atualizacao SEMANAL (compromisso publico do site): DOMINGO 0h de Brasilia.
                         # ATENCAO AO FUSO: o cron do GitHub e UTC; meia-noite de Brasilia e 03h UTC
                         # do MESMO dia, entao o campo de dia da semana e 0 (domingo) e bate com o
                         # domingo brasileiro. O portao de cadencia em atualizar.py decide pelo dia
                         # no fuso America/Sao_Paulo. A rodada (75-105 min) termina por volta de
                         # 01h20 de Brasilia, ainda no domingo -- nao cruza a meia-noite.
                         # 20/09/2026 (editoria): segundas 09h UTC -> sabado 22h40 -> domingo 0h.
    - cron: "0 9 * * *"  # v2.2.4 (E4): execucao DIARIA (06h Brasília); atualizar.py encerra sem comitar fora da semana intensiva (INTENSIVO_ATE) se nao for o dia de publicacao
    - cron: "0 21 * * *"  # 03/09/2026: 2a rodada DIARIA (18h Brasília), so para acelerar a varredura integral (03-10/09); mesma regra de cadencia
  workflow_dispatch:       # execução manual pelo botão "Run workflow"
    inputs:
      ensaio:
        description: "Ensaio: roda tudo como se fosse dia da semana intensiva, SEM comitar nem publicar (relatório no repositório privado)"
        type: boolean
        default: false
      finalizar_varredura_hoje:
        description: "Encerrar a varredura HOJE: consulta todos os municípios pendentes numa rodada só, ignorando o ritmo por dias restantes (pedido editorial pontual)"
        type: boolean
        default: false
      apenas_repor_dominio:
        description: "Só repor o domínio com senha sobre o main atual, sem rodar a coleta semanal inteira (pedido editorial urgente — ver job separado repor_dominio_manual)"
        type: boolean
        default: false

concurrency:
  # 14/09/2026: a rodada SEMANAL ("0 9 * * 1") e a DIARIA ("0 9 * * *") caem no
  # mesmo minuto toda segunda-feira — sem essa trava, os dois jobs commitam e
  # dao push ao mesmo tempo, correndo risco real de colisao de commit/push.
  # cancel-in-progress: false faz o segundo esperar o primeiro terminar em vez
  # de cancelar um dos dois, ja que ambos podem ter trabalho valido a commitar
  # (o daily so encerra sem commit se estiver fora da semana intensiva E nao
  # for segunda — na propria segunda ele roda por completo).
  group: atualizar-dados
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  repor_dominio_manual:
    # 21/09/2026: pedido editorial urgente (o domínio estava aberto). Job independente,
    # concorrência própria — não espera nem bloqueia a rodada semanal (job `atualizar` abaixo).
    # Faz exatamente o que o passo "Repor o site completo no domínio" de dentro da rodada
    # semanal faz, mas isolado: checkout do main atual, cabeçalho Basic-Auth, deploy Netlify.
    # Não toca em data/, não comita nada, não roda coleta.
    if: github.event_name == 'workflow_dispatch' && inputs.apenas_repor_dominio
    runs-on: ubuntu-latest
    concurrency:
      group: repor-dominio-manual
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repor o site completo no domínio (main atual), atrás de senha
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          MODO=$(python3 -c "import json;print(json.load(open('data/publicacao.json')).get('dominio',''))" 2>/dev/null || echo "")
          echo "modo declarado em data/publicacao.json: '${MODO}'"
          if [ "$MODO" != "senha" ]; then
            echo "::error::Domínio não está declarado como 'senha' em data/publicacao.json — abortando para não reforçar um estado que a editoria não pediu."; exit 1
          fi
          if [ -z "$PREVIA_BASIC_AUTH" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Segredo ausente (PREVIA_BASIC_AUTH ou NETLIFY_AUTH_TOKEN) — não é possível repor."; exit 1
          fi
          set +e
          {
            echo "passo=repor_dominio_manual commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ) modo=${MODO}"
            printf '/*\n  Basic-Auth: %s\n  X-Robots-Tag: noindex, nofollow\n' "$PREVIA_BASIC_AUTH" > _headers
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
            npx --yes netlify-cli@17 deploy --prod --dir=. --message "Reposição URGENTE do site no domínio (pedido editorial 21/09) — commit ${GITHUB_SHA::7}" > /tmp/repor_out.txt 2>&1
            echo "codigo_saida=$?"
            rm -f _headers; git checkout -- robots.txt 2>/dev/null
            grep -vE "npm warn" /tmp/repor_out.txt | grep -E "Error|error|422|Deploy is live|Website URL" | head -c 1200
          } > /tmp/repor_relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/repor_relatorio.txt
          [ -n "$PREVIA_BASIC_AUTH" ] && sed -i "s/${PREVIA_BASIC_AUTH}/[SENHA]/g" /tmp/repor_relatorio.txt
          cat /tmp/repor_relatorio.txt
          if grep -q "Deploy is live" /tmp/repor_relatorio.txt; then
            echo "Domínio reposto com o site completo, atrás de senha, sobre o main atual."
          else
            echo "::error::Reposição falhou — ver relatório acima."; exit 1
          fi
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/reg_repor 2>/dev/null
          mkdir -p /tmp/reg_repor/relatorios && cp /tmp/repor_relatorio.txt "/tmp/reg_repor/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_repor_dominio_manual.txt"
          cd /tmp/reg_repor && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com" && git add -A && git commit -q -m "repor dominio manual ${GITHUB_SHA::7}" && git push -q

  atualizar:
    # 21/09/2026 (achado real, mesmo dia): disparar apenas_repor_dominio=true SEM esta guarda
    # também disparou este job inteiro — só o job novo tinha `if:`, o schedule/workflow_dispatch
    # do topo do arquivo aciona TODOS os jobs por padrão, salvo restrição própria. Corrigido para
    # não repetir: pula quando o disparo foi explicitamente só para repor o domínio.
    if: "!(github.event_name == 'workflow_dispatch' && inputs.apenas_repor_dominio)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }   # AUD-11: sem credencial git na árvore; o push é pela API com o GITHUB_TOKEN só no passo final

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt

      # Node/jsdom precisam vir ANTES do atualizar.py: o orquestrador chama
      # scripts/verificar_estrutura.js, scripts/verificar_runtime.js e (desde
      # 31/08/2026, quando mapas/gráficos ganharam página própria)
      # scripts/verificar_runtime_mapas.js — todos dependem de jsdom — como
      # portões obrigatórios da própria atualização, não um passo separado
      # depois. Corrigido em 26/08/2026: a ordem antiga rodava o Python
      # primeiro, o que faria a Action falhar com "Cannot find module 'jsdom'"
      # na primeira execução real.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }   # AUD-18: coerente com engines.node e com o lockfile
      - run: npm ci                    # AUD-11: instalação reproduzível a partir do package-lock.json

      - name: Colocar "em atualização" no domínio (início da rodada, sem corrida com auto-deploy)
        # 21/09/2026 (pedido editorial urgente: domínio ficou aberto). Substitui o mecanismo antigo
        # — push no ramo `publico` disparando auto-deploy do Netlify em paralelo, com sleep(120) e
        # torcida para a ordem dar certo (§120) — por UM deploy explícito, direto por este workflow,
        # sem depender de timing de outro gatilho. A cortina do ramo `publico` JÁ É a página "Em
        # atualização" (mesmo conteúdo, barra de progresso); publicada aqui direto no domínio, no
        # início da rodada. O passo "Repor o site completo" (fim do job) substitui por cima quando
        # a rodada termina — sem mais corrida entre os dois.
        if: github.event.inputs.ensaio != 'true'
        continue-on-error: true   # nunca bloqueia a rodada de dados por causa da cortina
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::warning::segredo do Netlify ausente — cortina de início não publicada (não bloqueia a rodada)."; exit 0
          fi
          # checkout roda com persist-credentials:false (AUD-11: sem credencial git na árvore) —
          # busca autenticada só para este fetch, sem persistir nada depois dele.
          git fetch --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" publico
          rm -rf /tmp/cortina_inicio && mkdir -p /tmp/cortina_inicio
          if ! git show FETCH_HEAD:index.html > /tmp/cortina_inicio/index.html 2>/dev/null; then
            echo "::warning::não achou index.html no ramo publico — cortina de início não publicada."; exit 0
          fi
          git show FETCH_HEAD:futura-positivo.svg > /tmp/cortina_inicio/futura-positivo.svg 2>/dev/null || true
          printf 'User-agent: *\nDisallow: /\n' > /tmp/cortina_inicio/robots.txt
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n' > /tmp/cortina_inicio/_headers
          npx --yes netlify-cli@17 deploy --prod --dir=/tmp/cortina_inicio \
            --message "Em atualização (início da rodada) — commit ${GITHUB_SHA::7}" > /tmp/cortina_out.txt 2>&1
          if grep -q "Deploy is live" /tmp/cortina_out.txt; then
            echo "Cortina 'em atualização' publicada no domínio."
          else
            echo "::warning::deploy da cortina de início não confirmou — rodada continua normalmente (o passo final ainda repõe o estado correto)."
          fi

      # C4 (auditoria 29/08/2026): com versões travadas para reprodutibilidade,
      # nenhuma atualização de segurança entra sozinha — estas duas etapas são o
      # detector semanal de CVE novo. Informativas por ora (continue-on-error);
      # promover a bloqueantes quando a política de resposta for decidida.
      - name: Auditoria de vulnerabilidades Python (informativa)
        continue-on-error: true
        run: pip install pip-audit --quiet && pip-audit -r requirements.txt --format json --output docs/pip-audit-resultado.json
      - name: Auditoria de vulnerabilidades Node (informativa)
        continue-on-error: true
        run: npm audit --json > docs/npm-audit-resultado.json || true

      - name: População do Censo 2022 (uma vez; revalida se já existir)
        run: |
          if [ -f data/populacao_censo2022.json ]; then
            python atualizar_populacao.py --check
          else
            python atualizar_populacao.py
          fi
        # Se a busca ou a validação falhar, o job para aqui: o índice nunca
        # publica um componente populacional com dado não confirmado. As
        # sentinelas do script existem porque a primeira fonte candidata
        # (projeções RIPSA rotuladas como 2022) foi rejeitada por elas.

      - name: Processar contribuições do formulário (verificação automática)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          # pypdf agora vem de requirements.txt (AUD-11)
          python processar_contribuicoes.py
        # Aprova sozinho apenas o que passa nas regras R1-R7. A R7 (27/08/2026)
        # reserva ao julgamento humano tudo que move o índice: tipo "plano" e
        # qualquer capital (maior alavanca populacional individual, v2.2) — esses ficam na fila humana (verificar_contribuicoes
        # → converter_contribuicao → aplicar_revisao). O caminho automático fica
        # restrito a decretos de não-capitais, neutros ao escore pela Correção B;
        # após aplicar, o script regrava índice/percentual derivados (--write).
        # Recusas ficam em data/contribuicoes_recusadas.json com motivo.
        # Sem os secrets, o passo apenas avisa e segue. Os portões rodam DEPOIS
        # (atualizar.py) — a checagem de média nacional idêntica no site é a
        # prova mecânica de que o caminho automático segue neutro; qualquer
        # regressão trava o job e nada é publicado.

      # §15 (29/08/2026): vigia de sinais federais novos (DOU, ADPF 743) —
      # descoberta para triagem humana, nunca classificação; e checagem de
      # prazos federais contra o banco — marcador editorial, nunca pontuação.
      - name: Vigiar sinais federais novos (descoberta; informativa)
        continue-on-error: true
        run: python3 monitorar_sinais_federais.py
      - name: Checar prazos federais contra o banco (marcador editorial)
        continue-on-error: true
        run: python3 verificar_prazos_legais.py

      # §17 (29/08/2026): vigia de imprensa nacional (Google News RSS) por
      # possíveis instrumentos ainda não registrados — descoberta pura, com
      # trava absoluta (nenhuma pista entra no banco sem confirmação humana
      # em documento oficial). Limite alto pois a rede da Action é aberta.
      - name: Vigiar imprensa nacional por novos instrumentos (descoberta; informativa)
        continue-on-error: true
        run: python3 monitorar_imprensa_regional.py --limite 40

      # 18/09/2026 (handover ponto cego saúde, §3.3, achado real: caso Bahia — um plano de
      # R$ 30,5 mi ficou fora do banco por mais de um mês porque nada vigiava imprensa por
      # secretaria de saúde). Mesma trava absoluta, fila própria (pistas_imprensa_saude.json).
      - name: Vigiar imprensa nacional por novos instrumentos de saúde (descoberta; informativa)
        continue-on-error: true
        run: python3 monitorar_imprensa_saude.py --limite 27

      # 18/09/2026 (handover ponto cego saúde, §3.4; especificado em
      # INSTRUCOES_diarios_defeso_LAI_06-09-2026.md §11): fonte 1 de 6 ("achar o plano de SC
      # e todos os demais, sem verificação humana") — API WordPress dos sítios oficiais,
      # defesa civil e saúde desde o início. 100% descoberta: nunca promove sozinho (R7).
      - name: Descobrir planos via API WordPress (descoberta; informativa)
        continue-on-error: true
        run: python3 descobrir_planos.py --limite 20

      # 18/09/2026 (handover ponto cego saúde, §3.5 — prioridade MÉDIA, o que evita a próxima
      # defasagem de duas semanas, não o que fecha a lacuna de hoje): após cada marco federal
      # relevante (assembleia do Conass, coletiva de imprensa, oficina), marca as 27 UFs com
      # requer_reverificacao=true — sinalizador interno em saude_uf.json, nunca público
      # (verificado por self-test que gerar_monitor_saude.py nunca o propaga).
      - name: Marcar reverificação por marco federal de saúde (interno; informativa)
        continue-on-error: true
        run: python3 detectar_marcos_federais.py

      # 31/08/2026 (pedido de Patricia, motivado pelo temporal de granizo em SC):
      # vigia de atos de RESPOSTA (decretos de emergência/calamidade pública) —
      # varre as 27 UFs em rodízio simples, sem priorização (um temporal pode
      # acontecer em qualquer lugar, diferente da busca de instrumentos ex-ante,
      # que prioriza UFs LAC). Alimenta a MESMA fila de pistas da vigia de
      # imprensa acima — o julgamento automático (etapa seguinte) decide se cada
      # pista é resposta (vai para o mapa "Cidades que decretaram emergência",
      # nunca pontua) ou, por engano de busca, algo ex-ante.
      - name: Vigiar imprensa nacional por novos atos de resposta (descoberta; informativa)
        continue-on-error: true
        run: python3 monitorar_atos_resposta.py --limite 10

      # 31/08/2026 (pedido de Patricia): julgamento automático do que as duas
      # vigias acima descobriram — a trava de fonte oficial não mudou (só
      # processa pistas de domínio .gov.br/.leg.br/Diário Oficial), mas o
      # julgamento ex-ante × resposta que antes esperava uma sessão humana
      # agora é automático quando o classificador está confiante: ex-ante com
      # citação completa aplica em estados.json/municipios.json; resposta com
      # município identificável aplica em data/atos_resposta.json (o mapa).
      # Continua exigindo revisão humana em qualquer outro caso — sem mudança
      # nessa parte. Roda com rede aberta (busca o documento de verdade, não só
      # a notícia sobre ele); no ambiente de edição, sem rede para .gov.br, essa
      # etapa não tem o que buscar e não faz nada (degrada graciosamente).
      - name: Vigiar o painel El Niño da Política Por Inteiro (agregador terceiro; descoberta; informativa)
        continue-on-error: true
        run: |
          # 31/08/2026 (decisão de Patricia): o painel da Talanoa entra como fonte de PISTAS,
          # nunca de registro — cada ato exige confirmação no documento oficial. O vigia
          # descobre a fonte de dados do painel em tempo de execução; se não conseguir ler,
          # enfileira uma pista de manutenção e não derruba a atualização.
          python3 monitorar_politica_por_inteiro.py

      - name: Julgar e aplicar descobertas com fonte oficial e citação completa
        continue-on-error: true
        run: python3 julgar_e_aplicar_descobertas.py

      - name: Atualizar dados (boletins + instrumentos estaduais + transferências)
        env:
          PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
          # v2.2.4 (§13): semana intensiva controlada por variáveis de repositório
          # (Settings → Secrets and variables → Actions → Variables). Fora do período,
          # a execução diária encerra sem coletar nem comitar (retorno ao semanal é automático).
          INTENSIVO_DE: ${{ vars.INTENSIVO_DE }}
          INTENSIVO_ATE: ${{ vars.INTENSIVO_ATE }}
          ENSAIO: ${{ github.event.inputs.ensaio == 'true' && '1' || '' }}
          LOTE_DIARIOS: ${{ vars.LOTE_DIARIOS }}
          TAMANHO_LOTE: ${{ vars.TAMANHO_LOTE }}
          FINALIZAR_VARREDURA_HOJE: ${{ github.event.inputs.finalizar_varredura_hoje == 'true' && '1' || '' }}
        id: atualizar
        continue-on-error: true
        run: |
          set -o pipefail
          python atualizar.py 2>&1 | tee /tmp/atualizar.log
      - name: Relatório da execução no repositório privado (sempre)
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
          ENSAIO: ${{ github.event.inputs.ensaio == 'true' && '1' || '' }}
        run: |
          { echo "workflow=atualizar evento=${{ github.event_name }} ensaio=${ENSAIO:-0} commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ) resultado=${{ steps.atualizar.outcome }}"
            echo "--- arquivos alterados ---"; git status --short | head -40
            # 21/09/2026 (§124): avisos e erros PRIMEIRO, antes do trecho truncado. O relatório
            # guardava só as últimas 220 linhas, que são sempre as dos portões finais — qualquer
            # "[aviso] fonte: rede indisponível" emitido no começo da rodada caía fora e a falha
            # de coleta ficava invisível semana após semana. Este bloco é o diagnóstico de coleta.
            echo "--- avisos e erros da rodada (todos) ---"
            grep -nE "^\[(aviso|erro)\]|recusada|indisponível|sem trimestres|Traceback" /tmp/atualizar.log 2>/dev/null | head -60 || echo "(nenhum)"
            echo "--- etapas executadas ---"
            grep -c "^=== " /tmp/atualizar.log 2>/dev/null || echo "?"
            echo "--- log (últimas 220 linhas) ---"; tail -220 /tmp/atualizar.log 2>/dev/null
          } > /tmp/relatorio.txt 2>&1
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          mkdir -p /tmp/registro/relatorios && cp /tmp/relatorio.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_atualizar.txt"
          cd /tmp/registro && git config user.name monitor-el-nino-bot && git config user.email bot@users.noreply.github.com && git add -A && git commit -q -m "atualizar ${GITHUB_SHA::7}" && git push -q
          [ "${{ steps.atualizar.outcome }}" = "success" ] || { echo "::error::atualizar.py falhou — ver relatório em robo-registro"; exit 1; }
        # atualizar.py já roda, nesta ordem e como etapas bloqueantes,
        # verificar_estrutura.js → verificar_consistencia.py →
        # recalcular_mare.py --check → verificar_runtime.js →
        # verificar_runtime_mapas.js (desde 31/08/2026) — falha aqui
        # interrompe o job antes do commit, então nada quebrado é publicado.

      - name: Regenerar PDF de documentação do índice
        run: |
          # 03/09/2026: os coletores legados (Querido Diário, recursos, vigência, decretos) passaram
          # para DENTRO de atualizar.py, antes dos derivados e dos portões. Aqui só se garante o PDF
          # com o relógio fixado no corte (determinismo; o portão 12 compara byte a byte).
          export SOURCE_DATE_EPOCH="$(python3 -c "import json,datetime;d=json.load(open('data/meta.json'))['corte'];dd,mm,aa=d.split('/');print(int(datetime.datetime(int(aa),int(mm),int(dd)).timestamp()))")"
          python gerar_pdf_indice.py
          python gerar_pdf_metodologia.py
          # 08/09/2026 (causa-raiz do portão 12 vermelho em dias de cadência): o manifesto
          # sela o pacote DEPOIS de qualquer regeneração de PDF — sem isso, um PDF regenerado
          # aqui sem atualização de dados deixava docs/MANIFEST_SHA256.txt obsoleto no commit.
          python scripts/gerar_manifesto.py
        # Roda DEPOIS dos quatro portões (dentro de atualizar.py): o PDF é
        # documentação computada ao vivo dos dados vigentes — regenerá-lo a
        # cada atualização garante que o documento público nunca envelhece
        # em relação à base (o defeito clássico de PDF montado à mão).

      - name: Avisar sobre propostas pendentes de revisão humana
        if: always()
        run: |
          if [ -f data/instrumentos_revisar.json ]; then
            echo "::warning::Há propostas em data/instrumentos_revisar.json aguardando revisão humana (não aplicadas automaticamente)."
          fi
          if [ -f data/pistas_imprensa.json ]; then
            python3 -c "import json; f = json.load(open('data/pistas_imprensa.json', encoding='utf-8')); pendentes = [p for p in f['pistas'] if p.get('status') == 'pendente_confirmacao_documento']; print(f'::warning::{len(pendentes)} pista(s) de imprensa aguardando revisão humana em data/pistas_imprensa.json (dúvida do classificador, citação incompleta, ou fonte não confirmada como oficial).') if pendentes else None"
          fi

      - name: Verificar links externos (informativa; nunca remove link — decisão humana)
        if: always()
        continue-on-error: true
        run: |
          # 31/08/2026: verificar_links.py existia, mas não rodava em lugar nenhum — o
          # sandbox de edição não alcança gov.br; só aqui há rede de verdade. Cobre os
          # href das 5 páginas, as URLs em constantes JS (portais, diários oficiais,
          # guias, links do PDF do cidadão), estados.json e as 104 urls do banco
          # municipal. Link quebrado vira ::warning:: e relatório no artefato, nunca
          # remoção automática (regra de ouro do projeto).
          python3 verificar_links.py > links_relatorio.txt 2>&1 || true
          QUEBRADOS=$(grep -c "QUEBRADO" links_relatorio.txt || true)
          tail -40 links_relatorio.txt
          if [ "$QUEBRADOS" != "0" ]; then echo "::warning::$QUEBRADOS link(s) externos com problema — ver artefato links_relatorio.txt e decidir (remover, substituir ou manter nomeado sem link)."; fi
      - name: Guardar relatório de links
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: links-relatorio
          path: links_relatorio.txt
          retention-days: 30

      - name: Completar evidências com texto integral (autocura, 10/09/2026)
        # Pistas antigas sem .txt (inclusive evidência perdida, via recuperação por URL)
        # são completadas a cada rodada; o commit abaixo já inclui evidencias/.
        continue-on-error: true
        run: python3 scripts/preservar_textos_integrais.py

      - name: Commit das alterações de dados
        if: github.event.inputs.ensaio != 'true'
        run: |
          git config user.name "monitor-el-nino-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ index.html defesa-civil.html recalcular_mare.py MARE_Indice_Documentacao.pdf METODOLOGIA.pdf selos/ feeds/ dados-abertos/ evidencias/ docs/MANIFEST_SHA256.txt
          # Escopo do commit ampliado em 31/08/2026, e revisado depois no mesmo
          # dia quando mapas/gráficos ganharam página própria: index.html
          # (o número fixo do medidor), mapas-e-graficos.html (AREAS —
          # CONSIST mudou de JS embutido para data/consist.json, já coberto
          # por data/) e recalcular_mare.py (o dicionário ESTADOS, a fonte de
          # verdade real do cálculo) são os únicos arquivos fora de data/ que
          # a automação pode tocar, e só através das funções testadas e
          # protegidas por rollback de julgar_e_aplicar_descobertas.py — nunca
          # edição livre. O resto (demais páginas, scripts, metodologia) segue
          # fora do alcance da automação.
          git diff --cached --quiet && { echo "Sem alterações."; echo "HOUVE_ALTERACAO=0" >> $GITHUB_ENV; } \
            || { git commit -m "Atualização automática de dados ($(date +%d/%m/%Y))"; echo "HOUVE_ALTERACAO=1" >> $GITHUB_ENV; }
          # 03/09/2026 (achado da 1a rodada com rebase): checkout do runner é raso (depth=1) e
          # arquivos gerados fora do escopo do commit (ex.: docs/pip-audit-resultado.json) ficam
          # modificados e não staged; isso faz o checkout interno do rebase abaixo falhar com
          # "local changes would be overwritten". Descarta qualquer modificação não commitada
          # em arquivos rastreados antes do rebase — nada aqui é dado do índice, é regenerado
          # a cada rodada.
          git checkout -- .
          # AUD-06: a main tem ruleset (PR + checagem obrigatória). O robô é a única exceção,
          # via deploy key (segredo ROBO_DEPLOY_KEY) — push por SSH. Em repositório de USUÁRIO o
          # GitHub não aceita "GitHub Actions" como ator de bypass; por isso o commit assinado
          # pela API (scripts/comitar_via_api.py, AUD-21) fica reservado para quando a conta
          # virar organização (decisão da editoria). Até lá, o commit do robô não sai "Verified".
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > ~/.ssh/robo && chmod 600 ~/.ssh/robo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # 03/09/2026: se a main andou durante a rodada (merge editorial), rebase antes do push —
          # senão o push é recusado e o dia inteiro de coleta se perde. Conflito real (raro: o robô só
          # toca data/) aborta o rebase e o push falha com aviso, sem commit parcial.
          # depth=50 (em vez do padrão herdado do checkout raso) para o merge-base do rebase
          # ter história o bastante mesmo com PRs editoriais mesclados no meio da rodada.
          GIT_SSH_COMMAND="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes" git fetch --depth=50 git@github.com:${GITHUB_REPOSITORY}.git main
          git rebase FETCH_HEAD || { git rebase --abort; echo "::error::main avançou com conflito em data/; rodada não comitada"; rm -f ~/.ssh/robo; exit 1; }
          GIT_SSH_COMMAND="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes" git push git@github.com:${GITHUB_REPOSITORY}.git HEAD:main
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}

      - name: Atualizar contador da cortina pública (ramo publico)
        # 03/09/2026: publica só um número operacional (consultados/total da varredura
        # dos diários municipais) no domínio, para a editoria acompanhar sem precisar da
        # prévia com senha. Nunca dado do índice, nunca afirma existência de plano.
        if: env.HOUVE_ALTERACAO == '1'
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > "$RUNNER_TEMP/robo_cortina" && chmod 600 "$RUNNER_TEMP/robo_cortina"
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          ROBO_DEPLOY_KEY_SSH_DIR="$RUNNER_TEMP/robo_cortina" python3 scripts/atualizar_contador_cortina.py
          rm -f "$RUNNER_TEMP/robo_cortina"
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}

      - name: Repor o site completo no domínio (quando publicacao.json = senha)
        # 21/09/2026: o defeito estrutural de §120 (dois deploys competindo — push no ramo
        # `publico` disparando auto-deploy do Netlify EM PARALELO com este passo, resolvido só por
        # um sleep(120) torcendo para a ordem dar certo) foi eliminado, não remendado — o passo
        # "Colocar 'em atualização' no domínio" (início do job) já publica a cortina de forma
        # EXPLÍCITA e SEQUENCIAL, sem depender do gatilho do ramo `publico`. Este passo aqui roda
        # sempre por último, incondicionalmente (ver diretiva logo abaixo) — não há mais deploy
        # concorrente para esperar assentar.
        # Restaura o estado declarado em data/publicacao.json ao final da rodada:
        #   dominio: "senha"   -> site completo, Basic-Auth + noindex (este passo)
        #   dominio: "cortina" -> cortina/"em atualização" (nada a fazer: já é o que ficou do passo inicial)
        #   dominio: "aberto"  -> lançamento; fora do escopo deste passo, que sempre põe noindex
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          MODO=$(python3 -c "import json;print(json.load(open('data/publicacao.json')).get('dominio',''))" 2>/dev/null || echo "")
          echo "modo declarado em data/publicacao.json: '${MODO}'"
          if [ "$MODO" != "senha" ]; then
            echo "Domínio não está em modo senha — nada a repor."; exit 0
          fi
          if [ -z "$PREVIA_BASIC_AUTH" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Segredo ausente (PREVIA_BASIC_AUTH ou NETLIFY_AUTH_TOKEN) — domínio fica na cortina; repor pelo workflow de ensaio."; exit 0
          fi
          set +e
          {
            echo "passo=repor_dominio commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ) modo=${MODO}"
            printf '/*\n  Basic-Auth: %s\n  X-Robots-Tag: noindex, nofollow\n' "$PREVIA_BASIC_AUTH" > _headers
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
            npx --yes netlify-cli@17 deploy --prod --dir=. --message "Reposição do site no domínio apos rodada ${GITHUB_SHA::7}" > /tmp/repor_out.txt 2>&1
            echo "codigo_saida=$?"
            rm -f _headers; git checkout -- robots.txt 2>/dev/null
            grep -vE "npm warn" /tmp/repor_out.txt | grep -E "Error|error|422|Deploy is live|Website URL" | head -c 1200
          } > /tmp/repor_relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/repor_relatorio.txt
          [ -n "$PREVIA_BASIC_AUTH" ] && sed -i "s/${PREVIA_BASIC_AUTH}/[SENHA]/g" /tmp/repor_relatorio.txt
          if grep -q "Deploy is live" /tmp/repor_relatorio.txt; then
            echo "Domínio reposto com o site completo, atrás de senha."
          else
            echo "::warning::Reposição falhou — o domínio pode ter ficado na cortina. Ver robo-registro."
          fi
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/reg_repor 2>/dev/null
          mkdir -p /tmp/reg_repor/relatorios && cp /tmp/repor_relatorio.txt "/tmp/reg_repor/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_repor_dominio.txt"
          cd /tmp/reg_repor && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com" && git add -A && git commit -q -m "repor dominio ${GITHUB_SHA::7}" && git push -q
