name: Atualização semanal de dados

on:
  # A rodada completa de domingo (`scripts/testar_cadencia_publicacao.py` confere que a cadência é
  # decidida por uma constante só; desde 16/10 nenhuma página promete dia). Desde 14/10/2026 (decisão 2 da editoria, consolidação item 2)
  # ela é um chamador do `_coletor.yml`, como todo elo: janela, prazo, `.feito`, commit com união pela
  # base comum e coleta perdida em artefato vêm de lá. Saíram a cortina "em atualização", a reposição
  # própria do domínio (o publicador repõe depois do commit, por `workflow_run`), o contador da
  # cortina, o vigia do desfecho e os disparos `ensaio`, `rodada_completa_agora` e
  # `finalizar_varredura_hoje` (a válvula `coleta-dia/*` os substitui). Fica a reposição urgente.
  schedule:
    - cron: "10 3 * * 0"   # domingo, 0h10 de Brasília (o cron é UTC; 3 UTC = 0h BRT do mesmo domingo)
  workflow_dispatch:
    inputs:
      apenas_repor_dominio:
        description: "Só repor o domínio com senha sobre o main atual, sem rodar a coleta semanal inteira (pedido editorial urgente)"
        type: boolean
        default: false

# §259: a reposição urgente não espera a rodada na fila.
concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.apenas_repor_dominio == 'true') && 'repor-dominio-urgente' || 'atualizar-dados' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read        # o job `vez` do coletor pede `actions: read`; sem ela o run nem começa (F35)

jobs:
  repor_dominio_manual:
    # 21/09/2026: pedido editorial urgente (o domínio estava aberto). Job independente,
    timeout-minutes: 20
    # concorrência própria — não espera nem bloqueia a rodada semanal (job `atualizar` abaixo).
    # Faz exatamente o que o passo "Repor o site completo no domínio" de dentro da rodada
    # semanal faz, mas isolado: checkout do main atual, cabeçalho Basic-Auth, deploy Netlify.
    # Não toca em data/, não comita nada, não roda coleta.
    if: github.event_name == 'workflow_dispatch' && inputs.apenas_repor_dominio
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    concurrency:
      group: repor-dominio-manual
      cancel-in-progress: false
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Repor o site completo no domínio (main atual), atrás de senha
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          MODO=$(python3 -c "import json;print(json.load(open('data/publicacao.json')).get('dominio',''))" 2>/dev/null || echo "")
          echo "modo declarado em data/publicacao.json: '${MODO}'"
          if [ "$MODO" != "senha" ]; then
            echo "::error::Domínio não está declarado como 'senha' em data/publicacao.json — abortando para não reforçar um estado que a editoria não pediu."; exit 1
          fi
          if [ -z "$PREVIA_BASIC_AUTH" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Segredo ausente (PREVIA_BASIC_AUTH ou NETLIFY_AUTH_TOKEN) — não é possível repor."; exit 1
          fi
          set +e
          {
            echo "passo=repor_dominio_manual commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ) modo=${MODO}"
            printf '/*\n  Basic-Auth: %s\n  X-Robots-Tag: noindex, nofollow\n' "$PREVIA_BASIC_AUTH" > _headers
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
            npx --yes netlify-cli@17 deploy --prod --dir=. --message "Reposição URGENTE do site no domínio (pedido editorial 21/09) — commit ${GITHUB_SHA::7}" > /tmp/repor_out.txt 2>&1
            echo "codigo_saida=$?"
            rm -f _headers; git checkout -- robots.txt 2>/dev/null
            grep -vE "npm warn" /tmp/repor_out.txt | grep -E "Error|error|422|Deploy is live|Website URL" | head -c 1200
          } > /tmp/repor_relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/repor_relatorio.txt
          [ -n "$PREVIA_BASIC_AUTH" ] && sed -i "s/${PREVIA_BASIC_AUTH}/[SENHA]/g" /tmp/repor_relatorio.txt
          cat /tmp/repor_relatorio.txt
          if grep -q "Deploy is live" /tmp/repor_relatorio.txt; then
            echo "Domínio reposto com o site completo, atrás de senha, sobre o main atual."
          else
            echo "::error::Reposição falhou — ver relatório acima."; exit 1
          fi
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/reg_repor 2>/dev/null
          mkdir -p /tmp/reg_repor/relatorios && cp /tmp/repor_relatorio.txt "/tmp/reg_repor/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_repor_dominio_manual.txt"
          cd /tmp/reg_repor && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com" && git add -A && git commit -q -m "repor dominio manual ${GITHUB_SHA::7}" && git push -q


  atualizar:
    if: "!(github.event_name == 'workflow_dispatch' && inputs.apenas_repor_dominio)"
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: atualizar
      timeout_minutos: 300
      precisa_tesseract: true
      precisa_searxng: true
      precisa_node: true
      comandos: |
        atualizar_populacao.py --check
        processar_contribuicoes.py
        monitorar_sinais_federais.py
        monitorar_busca_web.py --tamanho 150
        scripts/verificar_funil.py --modo rodada
        monitorar_imprensa_regional.py --limite 40
        monitorar_imprensa_saude.py --limite 27
        descobrir_planos.py --limite 20
        detectar_marcos_federais.py
        monitorar_atos_resposta.py --limite 10
        monitorar_politica_por_inteiro.py
        julgar_e_aplicar_descobertas.py
        # Clima municipal: as duas variáveis na rodada semanal (alternavam por dia quando ela era diária).
        coletar_sinais_risco.py --municipios --apenas tempo
        coletar_sinais_risco.py --municipios --apenas ar
        atualizar.py
        preservar_evidencias.py --limite 20
        preservar_evidencias.py --ler --limite 20
        preservar_evidencias.py --ocr --limite 6
        scripts/preservar_textos_integrais.py
        # F66 (16/10/2026): triagem e preparação das pistas só na descoberta e no juiz, dentro da
        # vez da noite — esta rodada corre fora dela e regravaria os mesmos campos.
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      INMET_API_TOKEN: ${{ secrets.INMET_API_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
