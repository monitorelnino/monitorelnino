# Diários oficiais — 1x por noite, 22h30 de Brasília (01:30 UTC).
#
# Item 1 do handover de desacoplamento (27/09/2026) e cadência do item 1b, aprovada pela editoria em
# 27/09/2026 (noite): coleta e commit automáticos só na janela de 22h às 06h de Brasília.
#
# Saía de dentro do `atualizar.yml`, que somava ~30 scripts num job só: quando o diário municipal
# demorava, tudo o que vinha depois morria com ele. Aqui o coletor tem teto próprio e a sua falha não
# arrasta ninguém.
# 30/09/2026 (item 7 da rodada 2 — certificação dos coletores). O cron do GitHub é de MELHOR
# ESFORÇO: atrasa sob carga e descarta. Medido em 30/09: `noturno_diarios`, com cron de 01:30 UTC,
# começou às 06:59 (5h30 de atraso) e morreu no teto; a busca web, com cinco crons por noite, rodou
# duas vezes por dia, uma delas às 13:22 UTC — dentro do horário de trabalho da editoria, que é
# justamente o que a janela noturna existe para evitar.
#
# A noite passa a ser UMA CORRENTE: um disparo cedo (00:05 UTC) e cada elo acionado quando o
# anterior TERMINA. Cinco horários independentes davam cinco oportunidades de atrasar; um disparo e
# uma corrente dão uma. A ordem é:
#
#   diários → descoberta → busca web → evidências → juiz → sinais
#
# RECUPERAÇÃO, de propósito: o gatilho NÃO filtra por conclusão. Se o elo anterior falhou ou foi
# cancelado, o seguinte roda assim mesmo — cada coletor processa a fila pendente independentemente
# do horário, e uma noite perdida não pode levar a seguinte junto. `workflow_dispatch` continua em
# todos, para rodar à mão quando preciso.
name: Noturno — diários oficiais

on:
  schedule:
    # 03/10/2026 (item A.1 do handover da corrente noturna): a corrente começa às **22h de
    # Brasília**, que é 01:00 UTC. O disparo anterior era 00:05 UTC — 21h05 de Brasília —, e a
    # editoria fixou 22h: é a hora em que a redação para, e a janela vai até as 06h.
    # Continua sendo o ÚNICO cron da corrente: os elos seguintes são acionados pelo TÉRMINO deste.
    # 04/10/2026 (medição da central, duas noites seguidas): com cron de 01:00 o GitHub não
    # disparou — 1h40 de atraso em 04/10, 5h30 em 30/09. `:00`, `:10` e `:30` são os minutos de
    # PICO, porque é onde todo mundo agenda, e o cron do GitHub é de melhor esforço: sob carga ele
    # atrasa e descarta. Daqui em diante a abertura tem minuto ímpar e fora do pico, e uma RESERVA
    # meia hora depois. Os dois disparos são seguros porque a abertura é idempotente: o primeiro
    # passo pergunta a `scripts/janela_da_noite.py` se esta noite já abriu e, se abriu, não
    # trabalha — sem isso a reserva duplicaria lote de diários e commit na mesma janela.
    - cron: "7 1 * * *"    # 22h07 de Brasília, abre a noite
    - cron: "37 1 * * *"   # 22h37, reserva — não faz nada se a noite já abriu
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # 04/10/2026 — A GUARDA DA ABERTURA.
  #
  # A noite tem agora três chances de abrir: o cron de 01:07, a reserva de 01:37 e o vigia de 02:07
  # (`vigia_da_abertura.yml`). Três chances só são seguras se a segunda e a terceira souberem que a
  # primeira já aconteceu — senão a reserva duplicaria o lote de diários e dois commits competiriam
  # pela mesma janela.
  #
  # A pergunta NÃO pode ser feita ao painel da noite: a linha dele é escrita quando o elo TERMINA, e
  # a reserva dispara meia hora depois da abertura, quando os diários costumam estar no meio do
  # lote. O painel diria "não abriu" e a reserva duplicaria exatamente no caso que ela existe para
  # cobrir. Então a pergunta é à API: houve execução DESTE workflow desde o início desta janela?
  # Execução em andamento conta — é o caso da reserva — e execução que falhou também: o que a
  # reserva cobre é cron que não disparou, não coletor que deu errado. Repetir por causa de falha
  # duplicaria lote e commit, que é a decisão errada aqui.
  #
  # Disparo à mão (`workflow_dispatch`) passa sempre: quando a editoria manda rodar, roda.
  abertura:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    # 06/10/2026: era 5 minutos, e o job gastava isso so em checkout e setup-python quando o
    # runner esta lento -- nas rodadas 1 e 2 da campanha ele morreu em 5:03, exatamente no teto,
    # e levou os diarios junto. O teto existe para conter guarda travada, nao para competir com
    # o tempo de provisionamento.
    timeout-minutes: 12
    outputs:
      abrir: ${{ steps.guarda.outputs.abrir }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: Esta noite já abriu?
        id: guarda
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "disparo à mão: abre sempre"
            echo "abrir=sim" >> "$GITHUB_OUTPUT"; exit 0
          fi
          JANELA="$(python3 scripts/janela_da_noite.py --inicio-da-janela)"
          NOITE="$(python3 scripts/janela_da_noite.py --noite)"
          # 05/10/2026 (item 3.1 do handover da noite confiável) — CANCELADO NÃO É FEITO.
          #
          # Esta contagem incluía QUALQUER run criado na janela, inclusive `cancelled`, `failure`,
          # `skipped` e `timed_out`. Medido na noite de 04→05/10: o job `diarios / coletar` foi
          # cancelado às 01:14:09 UTC, dois minutos depois de começar; a guarda contou aquele run
          # como abertura, a reserva e o despachante acharam que a noite tinha aberto, e NINGUÉM
          # refez a coleta perdida. As tentativas das 03:56 e 04:38 saíram sem trabalhar.
          #
          # Agora contam só os runs que TRABALHARAM. `in_progress` conta: está coletando agora, e
          # disparar outro duplicaria lote. `success` e `failure` contam, porque um elo que coletou
          # e perdeu o push trabalhou e refazê-lo duplicaria commit — e é por isso que o marcador
          # existe, gravado pelo elo depois dos comandos e antes do commit. `cancelled`, `skipped` e
          # `timed_out` NÃO contam: ali não houve coleta, e a reserva tem de refazer.
          #
          # `created:>=` na busca de execuções: a API aceita o filtro, e assim a contagem é da
          # JANELA, não das últimas N execuções — uma noite movimentada não esconde a abertura.
          FILTRO='[.[] | select(.createdAt >= "JANELA_AQUI") | select(.databaseId != RUN_AQUI) | select(.status == "in_progress" or .conclusion == "success" or .conclusion == "failure")] | length'
          FILTRO="${FILTRO/JANELA_AQUI/$JANELA}"
          FILTRO="${FILTRO/RUN_AQUI/${{ github.run_id }}}"
          TRABALHARAM="$(gh run list --workflow=noturno_diarios.yml --limit 20 \
            --json databaseId,createdAt,status,conclusion --jq "$FILTRO")"
          # O marcador é a prova de que houve COLETA, e não só de que houve run. Ele chega à `main`
          # no mesmo commit do dado.
          MARCADOR="data/noite/$NOITE/diarios.feito"
          TEM_MARCADOR=0
          if [ -f "$MARCADOR" ]; then TEM_MARCADOR=1; fi
          echo "noite de $NOITE · janela desde $JANELA · runs que trabalharam: ${TRABALHARAM:-0} · marcador: $TEM_MARCADOR"
          if [ "${TRABALHARAM:-0}" -gt 0 ] || [ "$TEM_MARCADOR" = "1" ]; then
            echo "a noite já abriu COM TRABALHO FEITO — esta é a reserva, e ela não trabalha"
            echo "abrir=nao" >> "$GITHUB_OUTPUT"
          else
            echo "nenhum run desta janela trabalhou (cancelado e pulado não contam) — abre"
            echo "abrir=sim" >> "$GITHUB_OUTPUT"
          fi

  diarios:
    needs: abertura
    if: needs.abertura.outputs.abrir == 'sim'
    # 06/10/2026 (item 5): o ensaio real dispara este workflow no ramo `ensaio` e o elo
    # empurra para la, nao para a `main`. Na rotina o padrao continua sendo `main`.
    uses: ./.github/workflows/_coletor.yml
    with:
      ramo_destino: ${{ github.ref_name == 'ensaio' && 'ensaio' || 'main' }}
      nome: diarios
      # Escreve em data/pistas_*.json — grupo compartilhado da noite (seção G1).
      grupo_de_concorrencia: noturno
      # 30/09/2026 (item 7): 90 min não comportava o lote — duas das três últimas noites
      # foram CANCELADAS no teto, e diários municipais, DOE e S2iD ficaram sem coleta. Um job
      # cancelado não deixa rastro de erro: ele só some, e o dado envelhece em silêncio. Teto
      # de 240 min, que é claro e não aberto, mais lotes menores abaixo: cada coletor commita
      # o que já colheu, então uma noite que não termina não perde o que colheu até ali.
      timeout_minutos: 240
      comandos: |
        consultar_querido_diario.py --alvos data/fila_qd_169.json --limite 40
        # 30/09/2026 (item 7): o lote de 150 num comando só era o que estourava o teto. Três lotes
        # de 50, cada um como comando próprio, passam pelo invólucro de saúde um a um — e o
        # invólucro grava a linha de saúde de cada um. Se o terceiro não couber na noite, os dois
        # primeiros já entraram, e a fila continua de onde parou na noite seguinte.
        coletar_diarios_municipais.py --tamanho 50
        coletar_diarios_municipais.py --tamanho 50
        coletar_diarios_municipais.py --tamanho 50
        # 28/09/2026 (§276): a janela era `--desde 2026-06-29`, ou seja TRÊS MESES revarridos a cada
        # noite — 87 dos 90 min do teto, e o job cancelado a segundos do fim. O orquestrador sempre
        # usou oito dias corridos (`atualizar.py`, linha 250), e é isso que faz sentido para um coletor
        # que roda todas as noites: a janela cobre o atraso de publicação do diário, não o histórico.
        coletar_diarios_consorciados.py --desde-dias 8
        coletar_doe.py
        coletar_s2id.py
        # 02/10/2026 (item 7 do handover): recursos federais de defesa civil AUTORIZADOS por
        # municipio, das portarias da SEDEC no mesmo DOU que o coletor acima le. Diario porque
        # o ato sai todo dia util; a janela e incremental e relê sete dias para pegar ato
        # publicado com atraso ou retificado.
        coletar_recursos_resposta.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
