name: Publicar o site completo no endereço reservado (prévia)

# Fase de testes (01/09/2026): o domínio mostra a página em branco (ramo
# "publico"). Este workflow publica o conteúdo do main — o site completo — num
# endereço reservado do Netlify, main--<nome-do-site>.netlify.app, que o
# Netlify serve com "noindex". O nome do site é o segredo NETLIFY_SITE_NAME
# (renomeado aqui, de forma idempotente, a partir do nome gerado pelo Netlify).
# Dispara a cada push no main — inclusive os commits da atualização semanal.
# Também roda por workflow_dispatch em QUALQUER ramo: publica o ramo no alias
# derivado do nome (ex.: edicao-2026-09-02-pr-a--<site>.netlify.app) — é a
# prévia de PR do protocolo (§3.1 passo 8), já que o site não é ligado ao GitHub.
# Relatórios vão para o repositório privado monitorelnino/robo-registro.
# Ver docs/PROTOCOLO_ATUALIZACAO.md §7.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: previa
  cancel-in-progress: false

jobs:
  previa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Garantir o nome reservado do site e publicar a prévia
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_SITE_NAME: ${{ secrets.NETLIFY_SITE_NAME }}
        run: |
          set +e
          {
            echo "workflow=publicar_previa ramo=main commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ -n "$NETLIFY_SITE_NAME" ]; then
              npx --yes netlify-cli@17 api updateSite --data "{\"site_id\":\"$NETLIFY_SITE_ID\",\"body\":{\"name\":\"$NETLIFY_SITE_NAME\"}}" > /tmp/rename.txt 2>&1
              echo "rename_codigo=$? $(grep -oE '"name": *"[^"]+"' /tmp/rename.txt | head -1)"
            fi
            ALIAS=$(echo "${GITHUB_REF_NAME}" | tr '/_.' '---' | tr -cd 'a-zA-Z0-9-' | cut -c1-37 | sed 's/-*$//')
            npx --yes netlify-cli@17 deploy --alias="$ALIAS" --dir=. --message "Prévia de ${GITHUB_REF_NAME} ${GITHUB_SHA::7}" > /tmp/deploy_out.txt 2>&1
            echo "codigo_saida=$?"
            grep -vE "npm warn" /tmp/deploy_out.txt | grep -E "Error|error|422|Deploy is live|Website|Unique deploy|Deployed to" | head -c 1500
          } > /tmp/relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/relatorio.txt
          grep -q "Deploy is live" /tmp/relatorio.txt && echo "DEPLOY_OK=1" >> $GITHUB_ENV || echo "DEPLOY_OK=0" >> $GITHUB_ENV
      - name: Registrar relatório no repositório privado
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          mkdir -p /tmp/registro/relatorios
          cp /tmp/relatorio.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_publicar_previa.txt"
          cd /tmp/registro && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "publicar_previa ${GITHUB_SHA::7}" && git push -q
      - name: Resultado
        run: |
          [ "$DEPLOY_OK" = "1" ] && echo "Prévia publicada." || { echo "::error::Deploy da prévia falhou — ver robo-registro"; exit 1; }
