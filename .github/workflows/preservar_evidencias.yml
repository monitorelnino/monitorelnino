# Completa evidências de diário municipal com o TEXTO INTEGRAL da edição (txt_url do
# Querido Diário), para o julgamento humano de pistas ler o documento inteiro offline.
# Decisão editorial de 10/09/2026: a coleta é o único momento garantidamente sem bloqueio
# de acesso; excerto localiza a menção, documento inteiro é o que se julga.
# Só toca evidencias/ e data/evidencias.json — nunca pista, registro ou nota.
name: Preservar textos integrais das evidências

on:
  workflow_dispatch:
    inputs:
      n:
        description: "Máximo de downloads nesta execução (0 = todos os pendentes)"
        type: number
        default: 0

permissions:
  contents: write

jobs:
  preservar:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }   # AUD-11: sem credencial git na árvore; push por deploy key no passo final

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt

      - name: Baixar textos integrais pendentes (Querido Diário)
        run: python3 scripts/preservar_textos_integrais.py --n "${{ inputs.n }}"

      - name: Commit das evidências completadas
        run: |
          git config user.name "monitor-el-nino-bot"
          git config user.email "bot@users.noreply.github.com"
          # 06/10/2026 (item 1): quem comita e `scripts/commit_do_elo.py`, pela declaracao
          # de `config/escritores.json`. `git add` de pasta levava arquivo de outro elo.
          # O status e do commit, nao do `tee`: commit que falha e passa por verde
          # deixa a rodada inteira contada como feita sem que nada tenha sido gravado.
          python3 scripts/commit_do_elo.py preservar_evidencias --mensagem "evidencias: texto integral das pistas de diario ($(date +%d/%m/%Y))" > /tmp/commit_do_elo.txt 2>&1
          rc=$?
          cat /tmp/commit_do_elo.txt
          [ "$rc" = "0" ] || exit $rc
          grep -q "^houve=1" /tmp/commit_do_elo.txt || { echo "Sem alteracoes deste elo."; exit 0; }
          # AUD-06: mesmo caminho do robô semanal — push por deploy key, com rebase se a main andou.
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > ~/.ssh/robo && chmod 600 ~/.ssh/robo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes" git fetch --depth=50 git@github.com:${GITHUB_REPOSITORY}.git "${{ github.ref_name }}"
          git rebase FETCH_HEAD || { git rebase --abort; echo "::error::main avançou com conflito; rode o workflow de novo"; rm -f ~/.ssh/robo; exit 1; }
          GIT_SSH_COMMAND="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes" git push git@github.com:${GITHUB_REPOSITORY}.git "HEAD:${{ github.ref_name }}"
          rm -f ~/.ssh/robo
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
