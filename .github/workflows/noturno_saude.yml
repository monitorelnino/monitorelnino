# Saúde do ciclo — uma vez por noite (11/10/2026, HANDOVER_SAUDE_10-10-2026, item 1).
#
# POR QUE ESTE WORKFLOW EXISTE
# A camada observada de saúde (InfoDengue, painel de calor do MS, desfechos, DDA, boletins das
# SES) só rodava dentro de `atualizar.py`, o monólito semanal. Em 08/10 o passo `janela` daquele
# job foi parar no job vizinho e todo passo de coleta saiu `skipped` com o run verde (F40); antes
# disso, a rodada de 04/10 falhou e a de 28/09 foi cancelada. Resultado medido em 10/10:
# `saude_sinais.json` com `gerado_em` 26/09 — catorze dias sem coleta, com a página mostrando o dado
# como se fosse da semana.
#
# Aqui a camada sai do monólito (item 5.4: migrar o que resta para elos) e vira elo próprio, diário,
# dentro da janela. Os coletores são os mesmos, na mesma ordem em que `atualizar.py` os chamava; o
# prazo da coleta (`_coletor.yml`) garante que o elo chega ao commit mesmo com fonte lenta.
name: Noturno — saúde

on:
  schedule:
    - cron: "50 5 * * *"   # 2h50 de Brasília, depois da abertura e antes dos sinais físicos
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor pede `actions: read` (F35)

jobs:
  saude:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: saude
      timeout_minutos: 60
      comandos: |
        coletar_saude.py
        coletar_desfechos_saude.py
        coletar_desfechos_saude.py --doenca chikungunya
        coletar_dda.py
        coletar_boletim_ms_dengue.py
        coletar_boletim_df_arboviroses.py
        coletar_boletim_pe_arboviroses.py
        coletar_boletim_pb_arboviroses.py
        # Contagem de dengue e chikungunya pela fonte primária (SINAN) e óbitos registrados em
        # cartório, por UF e mês: vinham da rotina semanal de sinais, que não commitava (F38).
        coletar_arboviroses_sinan.py
        coletar_obitos_registro_civil.py
        classificar_saude_no_plano.py
        # 16/10/2026 (HANDOVER_SAUDE_PAGINA §6b): a consulta do município, depois de tudo o que ela lê.
        gerar_saude_municipio.py
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
