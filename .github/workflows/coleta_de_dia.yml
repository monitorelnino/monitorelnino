# Válvula de dia: coleta de rede fora da janela da noite, uma por nome, em paralelo.
#
# 23/10/2026 (central, 12:15): a válvula era a troca de `comandos` em `recuperar_edicoes_doe.yml`,
# que roda no grupo `noturno` (job `vez`, um run de cada vez): as faixas a tratavam como exclusiva e
# paravam com "fila vazia". Aqui os comandos são entrada do disparo e o grupo de concorrência é
# `dia-<nome>` (fila por nome, nunca cancelamento, nunca o grupo `noturno`), então faixas com nomes
# diferentes rodam juntas. Cada faixa escreve no próprio ramo `coleta-dia/*`, e o `_coletor.yml`
# abre o PR de dado ao fim. Sem horário, sem temporizador.
#
# Disparo: `gh workflow run coleta_de_dia.yml --ref coleta-dia/AAAA-MM-DD-faixa-tema -f nome=<faixa>
# -f comandos=$'prazo=280min script.py ...'`, num ramo criado da `main` (o ramo nunca é mesclado, só
# o PR de dado). Na `main` o `_coletor.yml` só deixa coletar de noite. Para a matriz de planos por
# grupo de UF, `busca_planos.yml`. Acesso: Crawl-delay por host, cliente identificado, recusa respeitada.
name: Coleta de dia (válvula, uma por nome)

on:
  workflow_dispatch:
    inputs:
      nome:
        description: "Nome curto da coleta (faixa-tema); define a fila `dia-<nome>`"
        required: true
        type: string
      comandos:
        description: "Um comando por linha, como no `_coletor.yml`"
        required: true
        type: string
      timeout_minutos:
        description: "Teto do job (máximo 340)"
        required: false
        default: 300
        type: number
      precisa_searxng:
        description: "true quando algum comando consulta o metabuscador (busca web)"
        required: false
        default: false
        type: boolean
      precisa_node:
        description: "true quando algum comando roda portão em Node (ex.: aplicar_promocoes_do_juiz.py)"
        required: false
        default: false
        type: boolean
      precisa_tesseract:
        description: "true quando o juiz pode ler PDF escaneado (OCR)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read        # o job `vez` do coletor lê a fila de runs

jobs:
  # 24/11/2026 (handover de erros do GitHub, item 6): em 17/11 a entrada trouxe linhas de Python soltas
  # e o executor rodou cada uma como programa. A entrada se confere antes de subir o executor: só a
  # lista de arquivos do repositório, sem o conteúdo (nada de `evidencias/`).
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false, filter: "blob:none", sparse-checkout: "scripts/saude_pipeline.py\ncoletores_base.py", sparse-checkout-cone-mode: false }
      - name: Uma linha, um comando com script do repositório
        env:
          COMANDOS: ${{ inputs.comandos }}
        run: printf '%s\n' "$COMANDOS" | python3 scripts/saude_pipeline.py --conferir-comandos
      # 27/11/2026: dois lotes do Buscador 2 (26 e 27/11) partiram de um `origin/main` local parado
      # em 24/11 (a37cdb64, 345 commits atrás): rodaram o código antigo, sem SearXNG nem a busca no
      # veículo corrigida, fecharam 2.711 pistas com 0 resolvidas e abriram PR de dado sujo. O ramo da
      # válvula nasce da `main` de agora: se ela tem commit que o ramo não tem há mais de 6 h, recusa.
      - name: O ramo parte da `main` de agora
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read -r falta desde < <(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...main" -q '[.ahead_by, (.commits[0].commit.committer.date // "-")] | @tsv')
          [ "$falta" = 0 ] || [ $(( $(date -u +%s) - $(date -u -d "$desde" +%s) )) -le 21600 ] && { echo "✓ ramo em dia (${falta} commit(s) da main fora)"; exit 0; }
          echo "✗ o ramo parte de uma main velha: ${falta} commit(s) da main fora dele, o mais antigo de ${desde}. Recrie o ramo de origin/main depois de git fetch."; exit 1
  coletar:
    needs: conferir
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: ${{ inputs.nome }}
      grupo_de_concorrencia: dia-${{ inputs.nome }}
      # `fromJSON`: o GitHub entrega o número do disparo como texto à entrada `number` do workflow
      # chamado (mesma razão de `busca_planos.yml`).
      timeout_minutos: ${{ fromJSON(inputs.timeout_minutos) }}
      # 24/11/2026: as válvulas de planos de MG e RJ pediram S24/S27 sem a chave e gravaram `Connection refused`
      # em todo município. Quem roda o metabuscador já o pede, como o Node e o OCR abaixo.
      precisa_searxng: ${{ inputs.precisa_searxng || contains(inputs.comandos, 'S24') || contains(inputs.comandos, 'S27') || contains(inputs.comandos, 'seguir_pistas') || contains(inputs.comandos, 'monitorar_busca_web') }}
      # 17/11/2026: o aplicador roda portão em Node e o juiz lê PDF escaneado; esquecer a chave no disparo
      # reverteu a aplicação de Mesquita/RJ (portão sem módulos). Quem roda o juiz ou o aplicador já os pede.
      precisa_node: ${{ inputs.precisa_node || contains(inputs.comandos, 'aplicar_promocoes_do_juiz') }}
      precisa_tesseract: ${{ inputs.precisa_tesseract || contains(inputs.comandos, 'julgar_filas') || contains(inputs.comandos, 'aplicar_promocoes_do_juiz') }}
      comandos: ${{ inputs.comandos }}
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
      # 26/10/2026: a válvula não repassava as chaves; o OpenAQ e o INMET ficavam sem credencial
      # numa coleta de dia (a noite repassa, em noturno_sinais.yml). Mesmas chaves, mesmo nome.
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      INMET_API_TOKEN: ${{ secrets.INMET_API_TOKEN }}
      PORTAL_TRANSPARENCIA_API_KEY: ${{ secrets.PORTAL_TRANSPARENCIA_API_KEY }}
      # 15/11/2026: a indicação do leitor (formulário) também se lê de dia, pela válvula.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
