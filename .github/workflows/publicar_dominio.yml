name: Publicar este ramo no domínio (produção)

# Fase de testes (01/09/2026): este ramo "publico" contém só a página em branco.
# A cada push aqui, o robô envia o conteúdo ao Netlify como deploy de PRODUÇÃO
# (monitorelnino.com.br). O site completo (ramo main) é publicado à parte,
# num endereço reservado, por outro workflow. Lançar = mover este workflow
# para o ramo main (ver docs/PROTOCOLO_ATUALIZACAO.md §7).
on:
  push:
    branches: [publico]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy de produção no Netlify
        id: deploy
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          {
            echo "execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "token_presente=$([ -n "$NETLIFY_AUTH_TOKEN" ] && echo sim || echo nao) site_id_presente=$([ -n "$NETLIFY_SITE_ID" ] && echo sim || echo nao)"
            echo "--- netlify deploy --prod ---"
            npx --yes netlify-cli@17 deploy --prod --dir=. --message "Página em branco (ramo publico)" > deploy_out.txt 2>&1; echo "codigo_saida=$?"
            grep -vE "npm warn" deploy_out.txt | head -c 2500
          } > resultado_robo.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN:-NUNCA_VAZIO_X}/[TOKEN]/g" resultado_robo.txt
          cat resultado_robo.txt
      - name: Gravar resultado no ramo (para leitura pelo Claude)
        if: always()
        run: |
          mkdir -p .robo && mv resultado_robo.txt .robo/ultimo_resultado.txt
          git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com"
          git add .robo/ultimo_resultado.txt && git commit -m "robô: resultado da publicação [skip ci]" && git push
