name: Publicar este ramo no domínio (produção)

# Fase de testes (01/09/2026): este ramo "publico" contém só a página em branco.
# A cada push aqui, o robô envia o conteúdo ao Netlify como deploy de PRODUÇÃO
# (monitorelnino.com.br). O site completo (ramo main) é publicado à parte,
# num endereço reservado, pelo workflow publicar_previa.yml do próprio main.
# Lançar = copiar este workflow para o main com branches: [main]
# (ver docs/PROTOCOLO_ATUALIZACAO.md §7). Relatórios de execução vão para o
# repositório privado monitorelnino/robo-registro — nunca para este ramo.
on:
  push:
    branches: [publico]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Deploy de produção no Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set +e
          mkdir -p /tmp/site && cp index.html robots.txt netlify.toml progresso.json futura-positivo.svg /tmp/site/
          {
            echo "workflow=publicar_dominio ramo=publico commit=${GITHUB_SHA::7} execucao=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            npx --yes netlify-cli@17 deploy --prod --dir=/tmp/site --message "Página em branco (ramo publico) ${GITHUB_SHA::7}" > /tmp/deploy_out.txt 2>&1
            echo "codigo_saida=$?"
            grep -vE "npm warn" /tmp/deploy_out.txt | grep -E "Error|error|422|Deploy is live|Website URL|Unique deploy" | head -c 1500
          } > /tmp/relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/relatorio.txt
          grep -q "Deploy is live" /tmp/relatorio.txt && echo "DEPLOY_OK=1" >> $GITHUB_ENV || echo "DEPLOY_OK=0" >> $GITHUB_ENV
      - name: Registrar relatório no repositório privado
        if: always()
        env:
          ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
        run: |
          git clone -q "https://x-access-token:${ROBO_TOKEN}@github.com/monitorelnino/robo-registro.git" /tmp/registro
          mkdir -p /tmp/registro/relatorios
          cp /tmp/relatorio.txt "/tmp/registro/relatorios/$(date -u +%Y-%m-%d_%H%M%S)_publicar_dominio.txt"
          cd /tmp/registro && git config user.name "monitor-el-nino-bot" && git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "publicar_dominio ${GITHUB_SHA::7}" && git push -q
      - name: Resultado
        run: |
          [ "$DEPLOY_OK" = "1" ] && echo "Domínio publicado." || { echo "::error::Deploy falhou — ver robo-registro"; exit 1; }
