name: Recuperar edições dos diários estaduais
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  edicoes-doe:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: edicoes-doe-rj-df
      grupo_de_concorrencia: noturno
      timeout_minutos: 120
      comandos: |
        prazo=45min coletar_edicoes_doe.py --uf RJ --desde 2026-10-05
        prazo=45min coletar_edicoes_doe.py --uf DF --desde 2026-10-05
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
