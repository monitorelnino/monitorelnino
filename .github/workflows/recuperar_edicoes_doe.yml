name: Recuperar edições dos diários estaduais
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  edicoes-doe:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: edicoes-doe-rs
      grupo_de_concorrencia: noturno
      timeout_minutos: 170
      comandos: |
        prazo=150min coletar_edicoes_doe.py --uf RS --desde 2026-06-29
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
