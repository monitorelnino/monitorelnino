name: Recuperar edições dos diários estaduais
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  ocr:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: ocr-doe
      timeout_minutos: 90
      precisa_tesseract: true
      comandos: |
        prazo=20min preservar_evidencias.py --ler --limite 6 --alvo mostra_edicao
        prazo=60min preservar_evidencias.py --ocr --limite 3 --alvo mostra_edicao
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
