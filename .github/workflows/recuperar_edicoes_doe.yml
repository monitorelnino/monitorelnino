name: Recuperar edições dos diários estaduais
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs separadas por espaço"
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  sonda:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: sonda-doe
      timeout_minutos: 120
      precisa_tesseract: true
      comandos: |
        sonda_url_doe.py ${{ inputs.urls }}
        prazo=45min coletar_edicoes_doe.py --uf DF --desde 2026-06-29
        prazo=20min preservar_evidencias.py --ocr --limite 3
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
