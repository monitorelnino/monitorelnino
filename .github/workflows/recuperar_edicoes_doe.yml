name: Recuperar edições dos diários estaduais
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  reler:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: reler-rj
      timeout_minutos: 60
      precisa_tesseract: false
      comandos: |
        prazo=45min coletar_edicoes_doe.py --uf RJ --desde 2026-06-29
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
      ROBO_TOKEN: ${{ secrets.ROBO_TOKEN }}
