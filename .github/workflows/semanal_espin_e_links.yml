# ESPIN e verificação de links — rotina própria, semanal.
#
# POR QUE ELA EXISTE (09/10/2026, item 8.6/9.3 dos ajustes da editoria)
# `coletar_espin.py` e `verificar_links.py` eram os dois últimos comandos de
# `semanal_sinais_e_links.yml`. As duas últimas execuções daquela rotina bateram no teto de 150 min
# e foram canceladas antes de chegar a eles: o ESPIN não era reconferido e os links não eram
# verificados. Fila longa não é cadência (mesmo diagnóstico de `semanal_respiratorias.yml`, 02/10).
# Separados, os dois rodam curtos e a falha de um não depende do comprimento da outra fila.
name: Semanal — ESPIN e links

on:
  schedule:
    # Domingo, 3h15 de Brasília — antes da rotina de sinais (4h30) e da busca web (4h00).
    - cron: "15 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: read        # o job `vez` do coletor pede `actions: read`; sem ela o run nem começa (F35)

jobs:
  espin_e_links:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: sonda-doe
      # `coletar_espin.py` escreve em data/saude_sinais.json; `verificar_links.py --historico`, em
      # data/links_historico.json.
      timeout_minutos: 45
      # Válvula coleta-dia (janela A3, 17/10/2026): sondagem das rotas dos diários. Este ramo não vai à main.
      # Válvula coleta-dia (janela A3, 17/10/2026): sondagem das rotas dos diários. Este ramo não vai à main.
      comandos: |
        scripts/sondar_rotas_doe.py --trecho https://diario.imprensaoficial.al.gov.br/assets/index-344f66e8.js~fetchEditions(~Ze.get(~/search|https://www.jornalminasgerais.mg.gov.br/main-A77B4DKJ.js~Gi.API+~.API+"|https://www.diariooficial.rs.gov.br/main-WOM4SM2S.js~getRestEndpoint(){~restEndpoint|https://www.lexml.gov.br/sru?operation=searchRetrieve&version=1.1&maximumRecords=2&query=decreto|http://www.diariooficial.rn.gov.br/dei/dorn3~pdf~__VIEWSTATE~Pesquis|https://www.imprensaoficial.rr.gov.br/~pdf~_visualizar|https://www.ioerj.com.br/portal/modules/conteudoonline/~pdf~edicao~mostra|http://www.ioepa.com.br/pesquisa~form~input
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
