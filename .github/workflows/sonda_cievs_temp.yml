# TEMPORÁRIO — nunca mesclar. Sonda de leitura dos boletins PR, AM e PA (E1, 21/10/2026). Só mede.
name: Sonda CIEVS (temporário)
on:
  push:
    branches: ["coleta-dia/2026-10-21-sonda-cievs"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Sondar
        run: |
          python3 - <<'PY'
          import re, collections
          import coletores_base as cb
          u = "http://www.dengue.pr.gov.br/Pagina/Boletins-da-Dengue"
          t = cb.buscar(u, timeout=40, origem="sonda_cievs").decode("utf-8", "replace")
          pdfs = list(dict.fromkeys(re.findall(r'href="([^"]+\.pdf)"', t, re.I)))
          mes = collections.Counter(m.group(1) for m in (re.search(r"documento/(\d{4}-\d{2})", x) for x in pdfs) if m)
          print("PDFs distintos:", len(pdfs))
          print("por mês de upload (últimos 10):", sorted(mes.items())[-10:])
          for x in pdfs:
              if re.search(r"documento/202[56]", x):
                  print("  R", x)
          PY
