# Ensaio da noite — a corrente noturna em miniatura, de dia, sem tocar a `main`
#
# Item 5.1 do `HANDOVER_noite_confiavel_05-10-2026.md`: **só fechar o handover com o ensaio verde.**
#
# POR QUE ELE EXISTE. As quatro causas da noite de 04→05/10 só apareceram *na* noite: a publicação
# reprovada oito vezes por 655 pistas fora do esquema, um elo cancelado que a guarda contou como
# feito, 114 minutos de busca web perdidos em conflito de rebase, e o pacote do blog com a
# credencial errada. Cada uma foi consertada na raiz — e consertar na raiz sem prova é a mesma
# aposta outra vez.
#
# O QUE ELE NÃO FAZ. Ele não dispara os workflows noturnos reais. Aqueles commitam na `main`, e um
# ensaio que publica não é ensaio: seria a noite, de dia. Ele exercita os MECANISMOS que a noite usa
# — a porta única da fila, a união pela base comum num repositório temporário de verdade, a guarda
# "já trabalhou?", a quarentena do portão de esquema e os marcadores `.feito` — cada um no caso que
# a noite provou que faltava. Quando uma das quatro causas voltar, este workflow fica vermelho.
#
# ONDE ELE RODA. `workflow_dispatch`, em qualquer ramo (a editoria usa `ensaio`). Permissão de
# leitura só; nenhum passo escreve na `main`, e `scripts/ensaio_da_noite.py` trabalha em
# `tempfile`, fora da árvore.
#
# O SEGUNDO JOB roda os coletores de verdade com `--limite` pequeno, para provar que a migração para
# a porta única não os quebrou. Ele também não empurra nada: o commit não existe neste workflow, e
# `git diff` ao fim diz o que a rodada tocaria.
name: Ensaio da noite

on:
  # 08/10/2026 (A2-15, A7-05): este workflow tinha ZERO runs na API. Ensaio que nunca roda nao
  # prova nada, e a regra 6 da corrente exige o ensaio antes de a mudanca entrar. Agora ele e
  # disparado no PR que toca a corrente, e e check obrigatorio ali.
  pull_request:
    paths:
      - ".github/workflows/_coletor.yml"
      - ".github/workflows/noturno_*.yml"
      - ".github/workflows/publicar_dados.yml"
      - ".github/workflows/consolidar_noite.yml"
      - ".github/workflows/busca_web_cadencia.yml"
      - ".github/workflows/ensaio_da_noite.yml"
      - "scripts/unir_conflito_de_rodada.py"
      - "scripts/guarda_da_janela.py"
      - "scripts/janela_da_noite.py"
      - "scripts/painel_da_noite.py"
      - "scripts/pistas.py"
      - "scripts/commit_do_elo.py"
      - "scripts/consolidar_noite.py"
      - "scripts/reaplicar_noite.py"
      - "scripts/ensaio_da_noite.py"
      - "config/escritores.json"
  workflow_dispatch:
    inputs:
      limite:
        description: "quantos alvos por coletor na rodada em miniatura"
        required: false
        default: "2"

permissions:
  contents: read

concurrency:
  group: ensaio-da-noite
  cancel-in-progress: false

jobs:
  mecanismos:
    name: Os seis ensaios dos mecanismos da noite
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # O git do runner precisa de identidade para o ensaio 1 criar commits no repositório
      # temporário. Isto NÃO toca o repositório do projeto: o ensaio trabalha em `tempfile`.
      - name: Identidade do git para o repositório temporário do ensaio
        run: |
          git config --global user.name "ensaio-da-noite"
          git config --global user.email "ensaio@users.noreply.github.com"

      - name: Os seis ensaios
        run: python3 scripts/ensaio_da_noite.py | tee -a "$GITHUB_STEP_SUMMARY"

      # As travas que a noite de 04→05/10 produziu, conferidas aqui também: uma porta só para a
      # fila, um escritor declarado por arquivo, e nenhum autoteste gravando no banco.
      - name: As travas estruturais da corrente
        run: |
          {
            python3 scripts/pistas.py --autoteste
            python3 scripts/verificar_escritor_de_pista.py
            python3 scripts/verificar_escritores.py
            python3 scripts/verificar_esquema_de_pista.py --autoteste
            python3 scripts/unir_conflito_de_rodada.py --autoteste
            python3 scripts/janela_da_noite.py --autoteste
            python3 scripts/painel_da_noite.py --autoteste
            python3 scripts/verificar_autoteste_nao_escreve.py
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A árvore do projeto ficou intocada?
        run: |
          # A prova de que o ensaio não tocou a `main`: nada mudou na árvore. Se mudou, o ensaio
          # está escrevendo onde não devia, e isso é vermelho mesmo que os seis ensaios passem.
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::o ensaio alterou a árvore do projeto — ele tem de trabalhar em tempfile"
            git status --porcelain | head -20
            exit 1
          fi
          echo "✓ a árvore do projeto está intocada: o ensaio não escreveu no repositório"

  corrente_em_miniatura:
    name: Os coletores de verdade, com limite pequeno e sem commit
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    needs: mecanismos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      # Os oito coletores migrados para a porta única, cada um no seu autoteste offline. É o que
      # prova que a migração não os quebrou, sem gastar rede nem tocar fonte externa.
      - name: Autoteste dos coletores migrados
        run: |
          falhou=0
          for c in monitorar_redes_oficiais monitorar_busca_web seguir_pistas \
                   coletar_diarios_municipais coletar_diarios_consorciados coletar_doe \
                   descobrir_planos; do
            echo "::group::$c"
            python3 "$c.py" --autoteste || falhou=1
            echo "::endgroup::"
          done
          [ "$falhou" = "0" ] || { echo "::error::coletor migrado com autoteste vermelho"; exit 1; }

      # A rodada em miniatura: a descoberta com limite pequeno, que é o elo mais barato e o que
      # exercita a porta única de ponta a ponta (coleta → `pistas.sincronizar` → fila).
      - name: Descoberta em miniatura
        continue-on-error: true
        timeout-minutes: 12
        env:
          LIMITE: ${{ inputs.limite }}
        run: python3 descobrir_planos.py --limite "${LIMITE:-2}" || true

      - name: O que a rodada tocaria (sem commitar nada)
        run: |
          {
            echo "### O que a rodada em miniatura tocou"
            echo ""
            echo '```'
            git status --porcelain | head -30
            echo '```'
            echo ""
            echo "Nenhum commit e nenhum push neste workflow: o ensaio não publica."
          } >> "$GITHUB_STEP_SUMMARY"

      # A fila continua no esquema depois da rodada: é a prova de que a porta única está de pé em
      # execução real, e não só no autoteste.
      - name: A fila ativa continua no esquema
        run: |
          # Regra 5 (05/10/2026): a quarentena não bloqueia a publicação por achar pista fora
          # do esquema — ela a tira da fila. Bloqueia quando a PRÓPRIA quarentena falha, e o
          # status vem do script, não do `tee`.
          rc=0
          python3 scripts/verificar_esquema_de_pista.py > /tmp/quarentena.txt 2>&1 || rc=$?
          cat /tmp/quarentena.txt | tee -a "$GITHUB_STEP_SUMMARY"
          exit $rc
