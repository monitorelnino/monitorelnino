# Publicador — rápido, 2x por dia: 06h (fecha a noite) e 22h (abre a noite) de Brasília.
#
# Item 1 do handover de desacoplamento (27/09/2026) e cadência do item 1b, aprovada pela editoria em
# 27/09/2026 (noite).
#
# ELE NUNCA COLETA. Lê os arquivos que os coletores noturnos deixaram, recalcula, regenera os
# derivados, roda os portões e repõe o domínio.
#
# 28/09/2026: a meta declarada era 'menos de 10 min', e ela foi medida sobre um publicador
# que morria no portão 12 antes de rodar a suíte inteira. Com os portões de navegador
# incluídos, a rodada honesta passa disso. A meta agora é **publicar conferido**; o teto do
# job (25 min) é o limite, não a meta.
#
# É o único workflow com `cancel-in-progress: true`: publicar duas vezes o mesmo estado não tem
# valor, e a publicação mais nova sempre substitui a mais velha. Os coletores fazem o oposto — fila,
# nunca cancelamento —, porque coleta interrompida perde o que já achou.
#
# Regra de dependência (item 1): nenhum job espera pelo término de outro. O que não chegou fica com a
# data anterior, declarada — é o que `verificar_vigencia.py` e os carimbos de corte já dizem ao
# leitor. Se o commit se perder para uma `main` em movimento, vale o laço de rebase-e-push do item 1a.
name: Publicar dados

on:
  schedule:
    # 28/09/2026: os MINUTOS saíram do zero porque 22h00 e 06h00 em ponto colidem com a rodada da
    # busca web (`busca_web_cadencia.yml`, nas horas 22, 0, 2, 4 e 6). Colisão no mesmo minuto não
    # cancela — os grupos de concorrência são separados —, mas põe o publicador lendo enquanto a busca
    # commita, que é o cenário de "main em movimento" que o laço de rebase-e-push do item 1a existe
    # para sobreviver. Cinco minutos custam nada e tiram a corrida do caminho. As HORAS não mudam:
    # 06h e 22h são compromisso público declarado em obrigado.html e na METODOLOGIA.
    - cron: "5 9 * * *"    # 06h05 de Brasília — fecha a noite
    - cron: "5 1 * * *"    # 22h05 de Brasília — abre a noite, com o que a editoria mesclou de dia
  workflow_dispatch:
  # 28/09/2026 (item 2 do bloco de frescor): CONTRATO — toda coleta que muda dado termina em
  # publicação. Até aqui o publicador só tinha horário, e uma noite que commitava dado às 06h30
  # esperava até as 22h05 para aparecer; noite em que o publicador falhava, o dado esperava o dia
  # seguinte, e ninguém era avisado. Os horários fixos continuam — eles são o compromisso público de
  # obrigado.html e da METODOLOGIA, e cobrem o caso de nenhum coletor ter rodado.
  #
  # `cancel-in-progress: true` no grupo faz o trabalho pesado aqui: uma noite com cinco coletores
  # não gera cinco publicações: a mais nova substitui a mais velha, e a última publica tudo o que
  # todas commitaram. Publicação cancelada por uma mais nova NÃO é dado não publicado.
  workflow_run:
    workflows:
      - "Noturno — diários oficiais"
      - "Noturno — descoberta"
      - "Noturno — evidências e OCR"
      - "Noturno — juiz automático"
      - "Noturno — sinais físicos"
      # 03/10/2026: a triagem da fila é o último elo da corrente (item C.2), e é o término dela que
      # fecha a noite — publicar antes dela publicaria sem o que a triagem acabou de promover.
      - "Noturno — triagem da fila"
      - "Semanal — sinais climáticos e links"
      - "Busca web — cadência automática"
      - "Atualização semanal de dados"
      - "Preservar textos integrais das evidências"
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publicar-dados
  # 04/10/2026 (item 3 do handover dos temporizadores): era `true`, e isso cancelava publicação EM
  # ANDAMENTO por causa de um `workflow_run` que, quando começasse, seria SKIPPED — o gatilho de
  # coletor que falhou. Medido três vezes em 04/10: o dispatch válido morreu `cancelled` e o
  # suposto substituto não publicou nada. Publicar duas vezes seguidas é inofensivo (a segunda
  # execução encontra a árvore limpa e diz "sem alterações"); perder a publicação não é. Fila, e
  # não cancelamento.
  cancel-in-progress: false

jobs:
  publicar:
    # Coletor que falhou não tem dado novo para publicar; só o `success` dispara. Os outros
    # gatilhos (horário e botão) não têm `workflow_run` e passam sempre.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25   # meta é < 10 min; o teto existe para que um travamento não fique pendurado
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      - name: Partir do main atual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet --depth=50 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git reset --hard FETCH_HEAD
          echo "main atual: $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      # 04/10/2026 (item 2c do handover dos temporizadores): OBSERVADOR OPORTUNISTA.
      # Cada execução de qualquer coisa vira um tique de relógio. São segundos, sem job extra, e é
      # o observador mais barato que existe: se este workflow conseguiu rodar, o agendador está
      # vivo o suficiente para despachar o que estiver devido. `|| true` porque o despachante é
      # auxiliar — a falha dele não pode derrubar a coleta que ia rodar.
      - name: Tique oportunista
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/despachar_temporizadores.py --origem oportunista \
            --so-ler-e-despachar || true

      - run: pip install -r requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", cache: npm }
      - run: npm ci

      # 28/09/2026: o carimbo da data de atualização vinha SÓ de `atualizar.py`, a rotina semanal
      # monolítica. O desacoplamento (§266, §267) moveu a coleta para os noturnos e a publicação
      # para cá, e o carimbo ficou para trás: o publicador publicava dado novo e o site seguia
      # declarando a data da última rodada semanal. Era por isso que o rodapé dizia 25/09 com dado
      # de 28/09 no ar.
      #
      # Vem ANTES de recalcular porque os geradores de derivado carimbam `gerado_em` a partir dele;
      # depois, ficariam um dia atrás e o portão 12 cobraria a diferença. A data sai do repositório
      # (último commit que tocou `data/`), nunca do relógio: rodada sem dado novo não avança nada.
      # 04/10/2026 (item 4 do bloco de prioridade): o publicador é o último elo da corrente e
      # não aparecia no painel da noite. Nas duas falhas de 03→04 (04:51 e 05:16 UTC) o painel
      # ficou sem a linha `publicar`, e quem olhasse de manhã veria "elo que não rodou" sem saber
      # que ele rodou e foi REPROVADO por um portão. A hora de início vem antes de qualquer passo.
      - name: Marcar o início do elo
        run: echo "ELO_INICIO=$(date -u +%H:%M)" >> "$GITHUB_ENV"

      - name: Carimbar a data de atualização
        timeout-minutes: 3
        run: python3 scripts/frescor.py --carimbar

      - name: Recalcular o índice
        timeout-minutes: 5
        run: python3 scripts/saude_pipeline.py --rodar recalcular_mare.py --write

      # 28/09/2026 (item 1 do bloco de frescor): este passo usava o modo `git`, que exige árvore
      # limpa DEPOIS de regenerar — e é exatamente o que nunca vale aqui. O publicador existe para
      # trazer os derivados em dia depois de a coleta noturna commitar dado novo; no modo `git` ele
      # regenerava, encontrava a diferença que ele mesmo acabou de produzir e reprovava. Foi assim
      # que as duas execuções de 28/09 (04h14 e 09h07) morreram no portão 12, e nada do que foi
      # coletado desde 25/09 chegou ao site: o publicador falhava precisamente porque tinha
      # trabalho a fazer.
      #
      # `--idempotencia` é o modo escrito para árvore suja: regenera e exige que uma SEGUNDA
      # regeneração não altere nada, que é a propriedade de verdade (derivado é função pura do dado
      # desta rodada). O portão 12 no modo `git` continua valendo onde ele faz sentido — na suíte,
      # abaixo, DEPOIS do commit local, quando a árvore está limpa de novo.
      # 01/10/2026 (bloco das 23h10, itens 3 e 4): o publicador mede o fechamento do MARÉ Saúde,
      # imprime quantas UFs faltam e por quê, e TROCA para a v0.4 sozinho quando as 27 estiverem
      # verificadas no plano e na coordenação. Sem a condição cumprida, `trocar_para_v04.py` não
      # altera nada — e é por isso que ele pode rodar em toda publicação.
      - name: Fechamento do MARÉ Saúde e troca para a v0.4
        timeout-minutes: 6
        run: |
          python3 scripts/fechar_saude.py --aplicar | tee -a "$GITHUB_STEP_SUMMARY"
          python3 trocar_para_v04.py | tee -a "$GITHUB_STEP_SUMMARY"

      # 01/10/2026 (handover da imprensa dinâmica): os números da semana são gerados A CADA
      # publicação, depois do recálculo e antes dos derivados — a página Imprensa não pode mostrar
      # a semana da edição anterior, que foi o defeito do item 0 do handover.
      # 02/10/2026: a faixa de cada unidade é registrada ANTES de a imprensa ser gerada, porque o
      # cartão "estados que mudaram de faixa" compara a edição anterior com esta — e a edição de
      # hoje tem de estar na série antes de a comparação ser feita.
      - name: Registrar a faixa de cada estado nesta edição
        timeout-minutes: 3
        run: python3 scripts/registrar_faixas.py

      # 03/10/2026: os INSTANTÂNEOS do topo de cada página são gerados ANTES da imprensa, porque é
      # deles que ela lê (handover do redesenho, item 1). Sem este passo o instantâneo ficava
      # congelado na rodada anterior enquanto as páginas seguiam coletando — e o portão de
      # coerência reprovou a publicação com três divergências de alerta ("a Imprensa diz 14 e a
      # Defesa civil diz 16"). O portão estava certo: faltava o passo.
      - name: Gerar os instantâneos do topo das páginas
        timeout-minutes: 5
        run: python3 scripts/gerar_topo_das_paginas.py

      - name: Gerar os números da semana (Imprensa)
        timeout-minutes: 5
        run: python3 gerar_imprensa_semana.py

      # 02/10/2026 (item 4 do contrato de layout): os cartões do topo do Financiamento vêm de um
      # arquivo gerado, e por isso ele é regerado a cada publicação — logo depois da imprensa,
      # porque o portão de coerência compara os dois. Sem este passo a página mostraria o mês
      # fechado da edição anterior, que é o mesmo defeito que a imprensa teve no item 0.
      # 03/10/2026 (handover do blog e da imprensa): o boletim da semana é CONGELADO por edição, e
      # a página de mudanças nasce do CHANGELOG. Os dois depois da imprensa, porque leem dela.
      - name: Congelar o boletim da semana
        timeout-minutes: 3
        run: python3 scripts/gerar_boletim.py

      - name: Gerar a página de mudanças
        timeout-minutes: 3
        run: python3 scripts/gerar_mudancas.py

      - name: Gerar os cartões do Financiamento
        timeout-minutes: 5
        run: python3 gerar_financiamento_semana.py

      # 05/10/2026 (item 1.3 do handover da noite confiável) — A QUARENTENA, ANTES DOS PORTÕES.
      #
      # A publicação reprovou OITO vezes entre 21:23 e 03:57 BRT de 04→05/10, e o site ficou com
      # dado de 04/10, por 655 pistas novas sem `url_final`, `tipo`, `alvo` nem `nivel` — de
      # coletores que nunca foram migrados para o esquema de 03/10. O portão acusava o certo e a
      # consequência era desproporcional.
      #
      # Aqui a pista fora do esquema SAI DA FILA ATIVA e a publicação segue. Ela continua no
      # arquivo, marcada, contável por coletor, e o passo imprime quem gravou errado. Bloqueio só
      # quando a quarentena FALHA — aí o dado malformado seguiria a caminho do juiz. Por isso o
      # passo NÃO é `continue-on-error`: ele é a condição de a fila ativa estar limpa.
      #
      # A porta de entrada está fechada em outro lugar: `scripts/pistas.py` é o único escritor da
      # fila, e `scripts/verificar_escritor_de_pista.py` reprova no PR quem abrir o arquivo por
      # fora. Este passo é a rede de segurança da corrente, não a regra.
      - name: Quarentenar pista fora do esquema (a publicação não para por ela)
        timeout-minutes: 4
        run: python3 scripts/verificar_esquema_de_pista.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Regenerar a cadeia canônica de derivados
        timeout-minutes: 8
        # 04/10/2026: era `--idempotencia`, que mede determinismo e não comparação
        # com o git — e por isso a árvore ficava igual ao commit anterior, o commit
        # dizia "sem alterações" e a suíte, depois, achava 49 derivados obsoletos.
        # Duas publicações morreram assim em 04/10. Aqui a cadeia só precisa
        # REGENERAR; quem compara é a suíte, depois do commit.
        run: bash scripts/verificar_derivados.sh --regenerar-para-commit

      # §273: o painel é gerado AQUI, depois dos portões e antes do commit, porque ele resume a
      # execução em curso — inclusive a linha de saúde que o passo de recalcular acabou de gravar.
      # Na cadeia canônica ele reprovava o portão 12, com razão.
      - name: Gerar o painel de saúde
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/gerar_saude_pipeline.py

      # 28/09/2026: o commit LOCAL vem antes da suíte, e o push depois dela. A ordem importa por um
      # motivo só: o portão 12 no modo `git` exige árvore limpa, e a árvore só fica limpa depois de
      # o dado novo e os derivados regenerados estarem commitados. Antes, a suíte rodava sobre a
      # árvore suja e o portão 12 reprovava o publicador pelo trabalho dele mesmo. Nada sobe sem a
      # suíte: o push está condicionado a ela, e commit local que não passe nos portões morre no
      # runner sem chegar à `main`.
      - name: Commit local
        id: commit
        run: |
          git config user.name "monitor-el-nino-bot"
          git config user.email "bot@users.noreply.github.com"
          # 29/09/2026: os PDFs da RAIZ entram. A cadeia canônica regenera
          # `MARE_Indice_Documentacao.pdf` e `METODOLOGIA.pdf`, e eles não estavam em nenhum
          # dos diretórios listados — ficavam regenerados e NÃO commitados, e o portão 12,
          # que roda logo depois sobre árvore que deveria estar limpa, via a diferença e
          # reprovava o publicador. 02/10/2026: a MESMA família, agora com CITATION.cff —
          # a cadeia escreve `date-released` a partir de meta.json, e desde que o carimbo
          # do corte passou a andar todo dia ele muda em TODA publicação. `blog/` e
          # `assets/` entram porque `*.html` não alcança subdiretório e `carimbar_assets.py`
          # escreve em assets/.
          # que roda logo depois sobre árvore que deveria estar limpa, via a diferença e
          # reprovava o publicador. Mesma família do §297: o `git add` que não inclui o que
          # a própria rotina produz.
          # 04/10/2026 — A CAUSA RAIZ DE TRÊS PUBLICAÇÕES PERDIDAS.
          #
          # Este `git add` listava `blog/`, que deixou de existir em 03/10, quando os posts saíram.
          # Um pathspec que não casa faz o `git add` INTEIRO falhar — e o `|| true` engolia o erro.
          # Resultado: nada era staged, o passo dizia "Sem alterações a publicar", e a suíte, que
          # roda depois, encontrava os 49 derivados que a cadeia havia regenerado. Três execuções
          # morreram assim (07:41, 08:05 e 08:30 UTC), cada uma acusando o portão 12 por um defeito
          # que estava aqui.
          #
          # Agora cada caminho é adicionado por conta própria, e o que não existe é DITO — a lista
          # envelhece sozinha quando uma pasta sai do site, e envelhecer em silêncio foi o defeito.
          falhou=0
          for alvo in data/ dados-abertos/ feeds/ selos/ docs/ blog/ assets/ CITATION.cff *.html *.pdf; do
            # `-e` e não `compgen`: o `for` já expandiu `*.html` e `*.pdf`, então cada `$alvo`
            # é um caminho concreto — e `compgen -G "blog/"` responde "casou" mesmo sem a pasta,
            # porque trata a barra como padrão. Medido antes de confiar.
            if [ ! -e "$alvo" ]; then
              echo "::notice::git add ignorou $alvo: nao existe mais nesta arvore"
              continue
            fi
            git add -A "$alvo" || falhou=1
          done
          if [ "$falhou" = "1" ]; then
            echo "::error::git add falhou em um dos caminhos — nada será publicado nesta execução"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Sem alterações a publicar."; echo "houve=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "Publicação automática ($(date -u +%d/%m/%Y\ %H:%M) UTC)"
          echo "houve=1" >> "$GITHUB_OUTPUT"
          git checkout -- . 2>/dev/null || true

      # 28/09/2026: a suíte inclui portões de página que rodam em Chromium real (móvel 390 px e
      # consistência visual). O publicador nunca tinha chegado neles — morria antes, no portão 12 —,
      # e quando chegou, reprovou por navegador ausente. Instalar aqui é o que mantém a regra
      # inteira: nada sobe com portão vermelho, e "não consegui rodar o portão" não é verde.
      - name: Navegador para os portões de página
        timeout-minutes: 6
        run: npx playwright install --with-deps chromium >/dev/null 2>&1 || npx playwright install chromium

      # O teto subiu de 12 para 20 min por causa dos portões de navegador. A meta de "menos de 10
      # min" era do publicador que não rodava a suíte inteira; publicar rápido nunca valeu mais do
      # que publicar conferido.
      # O QUE BARRA A PUBLICACAO, E O QUE NAO BARRA (item 4 do handover de 06/10/2026).
      #
      # Entre 03 e 06/10 a publicacao falhou 33 vezes, e as 33 foram portao de CODIGO reprovando
      # num publicador de DADO: 29 por derivado obsoleto, 3 por corrida no medidor de layout. Em
      # nenhuma o dado estava errado. Codigo que esta na `main` ja passou por esses portoes no
      # PR -- quando reprovam de novo aqui, o que pegam e nao determinismo, nao erro. E parar a
      # publicacao do dia por isso troca um problema pequeno por um grande: o site fica velho.
      #
      # Os portoes NAO mudam: seguem bloqueantes no PR, e a conformidade diaria do site
      # publicado segue igual. Muda so o que barra a PUBLICACAO.
      - name: Portões que barram a publicação (dado, segredo, vocabulário, runtime)
        timeout-minutes: 20
        run: python3 scripts/portoes_locais.py publicacao

      # Os de codigo rodam e NAO barram: reprovacao aqui publica mesmo assim e abre Issue.
      - name: Portões de código (avisam, não barram)
        id: portoes_codigo
        continue-on-error: true
        timeout-minutes: 25
        run: python3 scripts/portoes_locais.py tudo | tee /tmp/portoes_codigo.txt

      # Reprovacao de portao que NAO barra nao some: ela vira Issue no repositorio privado,
      # com o portao e a saida. Publicar mesmo assim e a decisao; esconder nao faz parte dela.
      - name: Issue quando um portão de código reprova
        if: steps.portoes_codigo.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "A publicacao seguiu, como manda a politica de 06/10/2026: portao que so mede"
            echo "codigo nao barra a publicacao de dado. Os portoes seguem bloqueantes no PR."
            echo
            echo "Run: $RUN_URL"
            echo
            echo '```'
            tail -60 /tmp/portoes_codigo.txt 2>/dev/null || echo "sem saida registrada"
            echo '```'
          } > /tmp/corpo_issue.md
          gh issue create --repo monitorelnino/robo-registro \
            --title "Portao de codigo reprovou na publicacao de $(date -u +%d/%m/%Y) (publicou mesmo assim)" \
            --body-file /tmp/corpo_issue.md \
            || echo "::warning::nao consegui abrir a Issue; a saida esta no log deste run"

      - name: Empurrar com rebase (item 1a)
        if: steps.commit.outputs.houve == '1'
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > ~/.ssh/robo && chmod 600 ~/.ssh/robo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes"
          EMPURROU=0
          for TENTATIVA in 1 2 3 4 5; do
            GIT_SSH_COMMAND="$SSH" git fetch --depth=50 git@github.com:${GITHUB_REPOSITORY}.git main || true
            if ! git rebase FETCH_HEAD; then
              git rebase --abort || true
              echo "tentativa $TENTATIVA: rebase conflitou; regenerando derivados e tentando de novo"
              GIT_SSH_COMMAND="$SSH" git fetch --depth=50 git@github.com:${GITHUB_REPOSITORY}.git main || true
              git rebase -X theirs FETCH_HEAD || { git rebase --abort || true; sleep $((TENTATIVA * 10)); continue; }
              python3 recalcular_mare.py --write || true
              bash scripts/verificar_derivados.sh --idempotencia || true
              git add -A data/ dados-abertos/ feeds/ selos/ docs/ blog/ assets/ CITATION.cff *.html *.pdf 2>/dev/null || true
              git diff --cached --quiet || git commit --amend --no-edit
            fi
            if GIT_SSH_COMMAND="$SSH" git push git@github.com:${GITHUB_REPOSITORY}.git HEAD:main; then
              EMPURROU=1; echo "empurrado na tentativa $TENTATIVA"; break
            fi
            echo "tentativa $TENTATIVA: push recusado (main avançou); nova tentativa"
            sleep $((TENTATIVA * 10))
          done
          rm -f ~/.ssh/robo
          if [ "$EMPURROU" != "1" ]; then
            echo "::error::commit perdido para main em movimento"
            exit 1
          fi

      - name: Repor o site no domínio, atrás de senha
        if: always()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          PREVIA_BASIC_AUTH: ${{ secrets.PREVIA_BASIC_AUTH }}
        run: |
          MODO=$(python3 -c "import json;print(json.load(open('data/publicacao.json')).get('dominio',''))" 2>/dev/null || echo "")
          echo "modo declarado em data/publicacao.json: '${MODO}'"
          if [ "$MODO" != "senha" ]; then
            echo "Domínio não está em modo senha — nada a repor."; exit 0
          fi
          if [ -z "$PREVIA_BASIC_AUTH" ] || [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::warning::Segredo ausente — domínio fica como está; repor pelo workflow de ensaio."; exit 0
          fi
          set +e
          {
            printf '/*\n  Basic-Auth: %s\n  X-Robots-Tag: noindex, nofollow\n' "$PREVIA_BASIC_AUTH" > _headers
            printf 'User-agent: *\nDisallow: /\n' > robots.txt
            npx --yes netlify-cli@17 deploy --prod --dir=. --message "Publicação ${GITHUB_SHA::7}" > /tmp/repor_out.txt 2>&1
            echo "codigo_saida=$?"
            rm -f _headers; git checkout -- robots.txt 2>/dev/null
            grep -vE "npm warn" /tmp/repor_out.txt | grep -E "Error|error|422|Deploy is live|Website URL" | head -c 1200
          } > /tmp/repor_relatorio.txt 2>&1
          sed -i "s/${NETLIFY_AUTH_TOKEN}/[TOKEN]/g" /tmp/repor_relatorio.txt
          [ -n "$PREVIA_BASIC_AUTH" ] && sed -i "s/${PREVIA_BASIC_AUTH}/[SENHA]/g" /tmp/repor_relatorio.txt
          cat /tmp/repor_relatorio.txt
          grep -q "Deploy is live" /tmp/repor_relatorio.txt \
            && echo "Domínio reposto com o site completo, atrás de senha." \
            || echo "::warning::Reposição falhou — ver o relatório acima."

      # A linha do elo `publicar` no painel da noite, com a conclusão do job. Falha aqui é
      # diferente de ausência: "publicou e reprovou no portão" tem conserto (o portão diz qual) e
      # "não rodou" tem outro (o vigia da abertura). O painel passa a distinguir os dois.
      - name: Registrar no painel da noite
        if: always()
        run: |
          python3 scripts/painel_da_noite.py --registrar publicar \
            --inicio "${ELO_INICIO:-}" --conclusao "${{ job.status }}" || true

      - name: Resumo no job
        if: always()
        run: |
          echo "### Publicação" >> "$GITHUB_STEP_SUMMARY"
          echo "commit: ${{ steps.commit.outputs.houve == '1' && 'sim' || 'sem alterações' }}" >> "$GITHUB_STEP_SUMMARY"
          # Item 2 do bloco de frescor: se o publicador falhou, o resumo diz "dado novo não
          # publicado desde <data>" em vez de deixar o quadrado vermelho falar sozinho. `if:
          # always()` garante que esta linha apareça justamente no caso em que ela importa.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "frescor: $(python3 scripts/frescor.py --resumo 2>&1 | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/saude_pipeline.py --listar | tail -15 >> "$GITHUB_STEP_SUMMARY" || true
          # 30/09/2026 (item 7 da rodada 2): a lista de coletores ATRASADOS fecha o resumo.
          # O painel dizia o que rodou; faltava dizer o que DEVIA ter rodado e não rodou —
          # e foi por isso que duas noites canceladas de diários passaram sem ninguém notar.
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Cadência dos coletores" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/verificar_cadencia_coletores.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
