name: Uso único — força histórico reescrito (LGPD) para a main

# Criado em 13/09/2026, autorizado por Patricia em resposta a "faça". Sobrescreve a
# main com o histórico já reescrito por git-filter-repo (verificado: zero CPF em
# todos os 407 commits, MARÉ e integridade de evidências idênticos ao estado atual —
# ver PR #152 e CHANGELOG, seção LGPD). Usa o deploy key (mesmo mecanismo de
# AUD-06/atualizar.yml) porque é o único ator autorizado a contornar a proteção de
# non-fast-forward da main — o token do Claude tem só Contents+PRs+Workflows, de
# propósito (ACESSO_GITHUB_claude.txt), nunca Administration.
# Apagar este arquivo e o branch historico-reescrito-lgpd-temp depois de rodar uma vez.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  forcar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: historico-reescrito-lgpd-temp
          fetch-depth: 0
      - name: Force-push do histórico reescrito para main, via deploy key
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > ~/.ssh/robo && chmod 600 ~/.ssh/robo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          GIT_SSH_COMMAND="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes" git push --force git@github.com:${GITHUB_REPOSITORY}.git HEAD:main
          rm -f ~/.ssh/robo
