# Funil de saúde estadual — campanha QUINZENAL (dias 1 e 15), não mais elo da corrente noturna.
#
# Bloco A do handover do MARÉ Saúde (editoria, 01/10/2026): verificar os 27 estados e manter
# verificado, com as fontes e os termos da SAÚDE. Roda aqui, e não na máquina de quem edita, porque
# a busca aberta precisa da instância efêmera de SearXNG que o `_coletor.yml` sobe no próprio job.
#
# Ele produz PISTA e nada mais: a promoção a registro é do `juiz.py`, com documento primário lido,
# e o elo do juiz vem depois na mesma corrente. A ordem da noite é
#
#   diários → descoberta → busca web → evidências → juiz → sinais
#
# Ele saiu dessa corrente em 02/10/2026: roda por calendário próprio, nos dias 1 e 15, e processa
# a fila pendente independentemente do que aconteceu na noite anterior — rodada perdida não leva a
# seguinte junto.
name: Quinzenal — funil de saúde estadual

on:
  # 02/10/2026 (bloco C.3 do handover de coordenação): a cadência passa a ser QUINZENAL, e o
  # gatilho noturno sai. A razão é do objeto: ato estadual é publicado uma vez, e varrer todas as
  # noites o que já foi localizado gasta a instância de busca sem produzir informação nova. A
  # campanha única dos 27 e as atualizações (ato novo, plano publicado, prazo vencido) cabem numa
  # rodada a cada duas semanas. O `workflow_dispatch` fica, para rodar à mão quando a editoria
  # pedir.
  schedule:
    - cron: "40 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saude-estadual:
    # 06/10/2026 (item 5): o ensaio real dispara este workflow no ramo `ensaio` e o elo
    # empurra para la, nao para a `main`. Na rotina o padrao continua sendo `main`.
    uses: ./.github/workflows/_coletor.yml
    with:
      ramo_destino: ${{ github.ref_name == 'ensaio' && 'ensaio' || 'main' }}
      nome: saude-estadual
      # Escreve em data/pistas_imprensa_saude.json — grupo compartilhado da noite.
      grupo_de_concorrencia: noturno
      timeout_minutos: 90
      precisa_searxng: true
      # Os quatro canais da bateria (handover de 01/10/2026). Nenhum "não localizado" se afirma com
      # menos do que isto, e cada canal registra a sua própria decisão: canal que não rodou é erro
      # no log, nunca "consultado sem achado".
      comandos: |
        coletar_saude_estadual.py --bateria
        coletar_saude_estadual.py --fontes
        coletar_saude_estadual.py --canais
        coletar_saude_estadual.py --doe --desde 2026-06-29
        # 02/10/2026 (diretriz da central): o canal 2 e BAIXAR A EDICAO. O localizador roda
        # antes do juiz, porque e dele que sai o indice de ocorrencias que a campanha consome.
        coletar_edicoes_doe.py --recuperacao --desde 2026-06-29
        # 01/10/2026 (bloco das 23h10): o juiz roda LOGO DEPOIS dos quatro canais, toda
        # noite, e o fechamento mede quantas UFs podem ser marcadas "nao localizado" —
        # so onde os quatro canais rodaram sem motor doente. Nada disso espera instrucao.
        julgar_saude.py --aplicar
        scripts/fechar_saude.py --aplicar
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
