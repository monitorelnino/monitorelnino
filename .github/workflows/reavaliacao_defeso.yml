# Reavaliação diária das fontes suspensas por defeso (decisão da central, 26/10/2026 15:25 UTC).
#
# Fim do período eleitoral em 25/10: as 41 fontes em data/calendario/fontes_suspensas.json voltam a
# ser lidas todo dia, pela mesma régua do §182 (scripts/reavaliar_fontes_suspensas.py). Até 25/11;
# depois disso, este workflow sai (PR que remove o cron) e a cadência volta a semanal, em
# semanal_espin_e_links.yml. Falha de rede mantém o estado (§170).
name: Reavaliação diária do defeso

on:
  schedule:
    # Todo dia, 02h20 de Brasília (05h20 UTC): dentro da janela da noite (01-09 UTC), onde a guarda
    # deixa gravar na `main`. Às 10h20 UTC ela parava em verde e nada era gravado (30/10/2026).
    - cron: "20 5 * * *"
    - cron: "26 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  reavaliar:
    uses: ./.github/workflows/_coletor.yml
    with:
      nome: reavaliacao-defeso
      timeout_minutos: 60
      comandos: |
        scripts/reavaliar_fontes_suspensas.py --refazer-busca
    secrets:
      ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
