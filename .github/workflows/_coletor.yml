# Workflow REUTILIZÁVEL: um coletor noturno.
#
# Handover `HANDOVER_desacoplar_pipeline_e_emagrecer_repositorio_27-09-2026.md`, itens 1, 1a e 1b.
#
# POR QUE ELE EXISTE
# ------------------
# O `atualizar.yml` é um job monolítico com cerca de trinta scripts em sequência: mediana de 92 min,
# máximo de 240, e de 12 execuções medidas em 27/09 sete foram canceladas, duas falharam e uma deu
# certo. Com cadência de 6 h e duração de 1,5 a 4 h, as execuções se sobrepõem e se cancelam — e uma
# fonte lenta derruba tudo o que vem depois dela.
#
# Aqui cada coletor roda no seu próprio job, com teto curto, `continue-on-error` por script, o seu
# arquivo de saída e a sua linha de saúde. Coletor grava; o publicador lê. **Nenhum job espera por
# outro:** o que não chegou fica com a data anterior, declarada.
#
# ITEM 1a (correção obrigatória, 27/09 23h50 UTC): a rodada longa não falhava na coleta, falhava no
# COMMIT. O run 36338485886 passou por todas as etapas de coleta e perdeu tudo no passo 37, porque
# entre o início e o commit entraram três PRs e duas rodadas de busca web na `main`. Por isso o commit
# aqui é um LAÇO de rebase-e-push, com até cinco tentativas; conflito em arquivo de dado gerado se
# resolve regenerando depois do rebase, nunca à mão.
name: Coletor noturno (reutilizável)

on:
  workflow_call:
    inputs:
      nome:
        description: "Nome curto do coletor, usado na mensagem de commit e no resumo do job"
        required: true
        type: string
      comandos:
        description: "Um comando por linha. Cada um roda pelo invólucro de saúde e NUNCA derruba o job."
        required: true
        type: string
      timeout_minutos:
        description: "Teto do job inteiro"
        required: false
        default: 45
        type: number
      grupo_de_concorrencia:
        description: >-
          Grupo de concorrência do job. Padrão: um por coletor, que é o que serve à maioria — dois
          coletores diferentes podem rodar ao mesmo tempo sem se atrapalhar. Os que ESCREVEM em
          `data/pistas_*.json` passam `noturno` (seção G1 do handover de 29/09/2026): o monitor de
          imprensa grava a pista, o verificador escreve `verificacao_fonte` nela e o juiz escreve
          `juiz` — três escritores no mesmo arquivo, e um só campo cada. Com o grupo compartilhado,
          se dois se cruzarem o segundo ESPERA; nunca cancela nem escreve por cima.
        required: false
        default: ""
        type: string
      precisa_tesseract:
        description: "true só para o coletor de evidências (OCR)"
        required: false
        default: false
        type: boolean
      precisa_node:
        description: "true quando algum comando aciona portão em Node (jsdom)"
        required: false
        default: false
        type: boolean
      precisa_searxng:
        description: "true quando algum comando consulta o metabuscador (busca web, perfis oficiais)"
        required: false
        default: false
        type: boolean
    secrets:
      ROBO_TOKEN:
        # 08/10/2026 (A2-28): sem ele, o tique oportunista roda com o `GITHUB_TOKEN`,
        # que não alcança o `robo-registro`, e a Issue de alarme falha em silêncio
        # (`|| true`). Opcional porque o ensaio roda sem segredo.
        required: false
      ROBO_DEPLOY_KEY:
        required: true

permissions:
  contents: read

jobs:
  # 10/10/2026 (janela A, item 2): A VEZ NA NOITE. O grupo `noturno` era um grupo de concorrência
  # só, e o GitHub guarda nele um run em execução e UM pendente — o terceiro cancela o pendente,
  # com `cancel-in-progress: false` ou sem. Foi o que matou `diarios / coletar` às 01:14 de 10/10
  # (pendente, zero passos). Agora cada elo tem o seu grupo (`noturno-<elo>`), e a exclusão mútua
  # entre os escritores das filas é este job: espera, por ordem de chegada (id do run), que nenhum
  # run anterior dos workflows do antigo grupo esteja aberto. Ninguém é cancelado, ninguém escreve
  # ao mesmo tempo. Fora do grupo `noturno` o job sai na hora.
  vez:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: inputs.grupo_de_concorrencia == 'noturno'
        with: { persist-credentials: false, sparse-checkout: scripts }
      - name: Esperar a vez na noite
        if: inputs.grupo_de_concorrencia == 'noturno'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/vez_na_noite.py --esperar --run-id "${{ github.run_id }}" --ramo "${GITHUB_REF_NAME}" --teto-min 300

  coletar:
    needs: [vez]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    timeout-minutes: ${{ inputs.timeout_minutos }}
    # Fila, não cancelamento: uma coleta interrompida no meio perde o que já achou. Só o publicador
    # cancela o anterior, porque publicar duas vezes o mesmo estado não tem valor.
    # 10/10/2026: `noturno` vira `noturno-<elo>` — um pendente só é substituído por outro run do
    # MESMO elo; a exclusão mútua entre elos diferentes é o job `vez`, acima.
    concurrency:
      group: ${{ inputs.grupo_de_concorrencia == 'noturno' && format('noturno-{0}', inputs.nome) || (inputs.grupo_de_concorrencia != '' && inputs.grupo_de_concorrencia || format('coletor-{0}', inputs.nome)) }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }

      # Partir do main REAL, não do SHA fixado no disparo (§148): com vários jobs noturnos e a
      # editoria mesclando de dia, o SHA do disparo envelhece entre a fila e a execução.
      - name: Partir do main atual
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet --depth=50 "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          git reset --hard FETCH_HEAD
          echo "main atual: $(git rev-parse --short HEAD)"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip                       # item 5: instalação abaixo de 1 min por job
      - run: pip install -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: inputs.precisa_node
        with: { node-version: "22", cache: npm }
      - run: npm ci
        if: inputs.precisa_node

      # §278: instância efêmera do metabuscador, para os comandos que consultam a web. Sem ela, um
      # coletor que depende do SearXNG produz lacuna a cada noite em vez de pista — e a lacuna pareceria
      # "fonte fora do ar". Quem depende dela pede `precisa_searxng: true`.
      - name: Subir SearXNG efêmero
        if: inputs.precisa_searxng
        id: searxng
        continue-on-error: true
        run: |
          docker run -d --name searxng -p 127.0.0.1:8080:8080             -v "$PWD/scripts/searxng_settings.yml:/etc/searxng/settings.yml:ro"             searxng/searxng:latest
          ok=""
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:8080/search?q=teste&format=json" > /dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          [ -n "$ok" ] && echo "pronto=1" >> "$GITHUB_OUTPUT" || echo "SearXNG não subiu a tempo"

      - name: Instalar Tesseract com o modelo português (§177)
        if: inputs.precisa_tesseract
        timeout-minutes: 5
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-por

      # 03/10/2026 (item A.5 do handover da corrente noturna): a hora de INÍCIO do elo, guardada
      # antes de qualquer comando. O painel da noite precisa dela para dizer quanto durou e se
      # terminou dentro da janela de 22h às 06h — e foi a falta desse registro que deixou a noite de
      # 02→03/10 passar sem ninguém ver que as evidências não rodaram.
      # 04/10/2026 (item 2c do handover dos temporizadores): OBSERVADOR OPORTUNISTA.
      # Cada execução de qualquer coisa vira um tique de relógio. São segundos, sem job extra, e é
      # o observador mais barato que existe: se este workflow conseguiu rodar, o agendador está
      # vivo o suficiente para despachar o que estiver devido. `|| true` porque o despachante é
      # auxiliar — a falha dele não pode derrubar a coleta que ia rodar.
      - name: Tique oportunista
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/despachar_temporizadores.py --origem oportunista \
            --so-ler-e-despachar || true

      # Causa F (06/10/2026): a regra de 27/09 -- nenhum commit automatico na `main` de dia --
      # dependia de os `cron` estarem certos, e `cron` certo nao impede disparo manual, cadeia de
      # `workflow_run` nem reexecucao de run antigo. Em 06/10 a publicacao da fase 0 encadeou a
      # corrente antiga e cinco elos coletaram de dia na `main`, dois deles perdendo o commit.
      # A guarda pergunta antes de coletar, e para em SUCESSO: nao coletar fora da hora e o
      # comportamento certo, nao um defeito. Fora da `main` ela nunca barra -- e no ramo `ensaio`
      # que a campanha roda de dia. O publicador e a excecao unica, quando a editoria chama.
      - name: Janela da noite — na `main`, só de noite
        id: janela
        timeout-minutes: 2
        run: |
          # A decisão NÃO passa por cano (08/10/2026, A2-01): o passo não declarava `shell:`,
          # o Actions rodava `bash -e` sem `pipefail`, e o `if` lia o status do `tee`, que é
          # sempre 0. Entre 05 e 08/10 foram 96 commits de coletor fora da janela, todos com
          # este passo verde. O status agora vem do script, e a saída vai ao resumo depois.
          # O `if` existe por causa do `-e`: com `shell: bash` o Actions roda `bash -eo
          # pipefail`, e `cmd; rc=$?` aborta no proprio cmd que falha, antes de ler o rc.
          rc=0
          python3 scripts/guarda_da_janela.py --ramo "${GITHUB_REF_NAME}" --elo "${{ inputs.nome }}" > /tmp/guarda.txt 2>&1 || rc=$?
          cat /tmp/guarda.txt | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -eq 0 ]; then
            echo "pode=1" >> "$GITHUB_OUTPUT"
          else
            echo "pode=0" >> "$GITHUB_OUTPUT"
          fi

      # 08/10/2026 (A2-26): o painel e preenchido pelo elo SEGUINTE, pela API. A linha gravada
      # pelo proprio elo, antes do push, dizia `success` sempre -- 138 linhas desde 04/10, todas
      # `success` -- e sumia junto com o commit perdido. A conclusao real esta na API, e o trabalho
      # esta no marcador `.feito`, que o elo grava antes de commitar.
      - name: Recuperar no painel a noite que ficou sem linha
        if: steps.janela.outputs.pode == '1'
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.ROBO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/painel_da_noite.py --recuperar-da-api | tee -a "$GITHUB_STEP_SUMMARY" || true

      # 09/10/2026 (defeito (a), passo 1a): O ARTEFATO DA COLETA PERDIDA VOLTA PARA DENTRO.
      #
      # O passo 1a guarda o trabalho num artefato quando o push morre, e o comentario dele dizia
      # que "o elo seguinte o reaplica (`scripts/reaplicar_noite.py`)". O script existe desde
      # 08/10 e NADA o chamava: os cinco artefatos da noite de 08->09 (18 MB cada) ficaram no
      # GitHub esperando alguem, e expiram em catorze dias. Agora todo elo reaplica no comeco, pela
      # porta de cada arquivo, antes de coletar — o que voltou entra no commit desta noite.
      # Idempotente pelo marcador `.reaplicado`; `continue-on-error` porque reaplicar nao e a
      # tarefa do elo, e falha aqui nao derruba a coleta.
      - name: Reaplicar o que a noite perdeu
        if: steps.janela.outputs.pode == '1'
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/reaplicar_noite.py --aplicar | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Marcar o início do elo
        run: echo "ELO_INICIO=$(date -u +%H:%M)" >> "$GITHUB_ENV"

      # Cada comando passa pelo invólucro, que cronometra e grava a linha de saúde. `|| true` é
      # deliberado: coletor que falha não derruba os outros nem impede o commit do que já foi achado.
      - name: Coletar
        if: steps.janela.outputs.pode == '1'
        run: |
          while IFS= read -r cmd; do
            [ -z "$(echo "$cmd" | tr -d '[:space:]')" ] && continue
            echo "::group::$cmd"
            python3 scripts/saude_pipeline.py --rodar $cmd || true
            echo "::endgroup::"
          done <<'COMANDOS'
          ${{ inputs.comandos }}
          COMANDOS

      # 05/10/2026 (item 3.1 do handover da noite confiável) — CANCELADO NÃO É FEITO.
      # O marcador é gravado AQUI: depois dos comandos de coleta, antes do commit. A ordem é a
      # regra. Um elo que coletou e perdeu o push trabalhou, e refazê-lo duplicaria lote e commit;
      # um elo cancelado antes de coletar não trabalhou, e tem de ser refeito. Medido na noite de
      # 04→05/10: `diarios / coletar` foi cancelado dois minutos depois de começar, a guarda contou
      # aquele run como abertura da noite, e ninguém refez a coleta perdida.
      - name: Marcar que este elo trabalhou
        if: steps.janela.outputs.pode == '1'
        id: feito
        run: |
          NOITE="$(python3 scripts/janela_da_noite.py --noite)"
          mkdir -p "data/noite/$NOITE"
          echo "${{ inputs.nome }} · $(date -u +%FT%TZ) · run ${{ github.run_id }}" \
            > "data/noite/$NOITE/${{ inputs.nome }}.feito"
          # 10/10/2026: o passo seguinte lê `env.NOITE`, e ninguém o exportava — o artefato saía
          # como `feito-<elo>-` com caminho `data/noite//<elo>.feito`, ou seja, não saía. A
          # segunda prova do marcador (`marcador_de_elo.py`) nunca existiu de fato.
          echo "NOITE=$NOITE" >> "$GITHUB_ENV"
          echo "feito=1" >> "$GITHUB_OUTPUT"
          echo "marcador: data/noite/$NOITE/${{ inputs.nome }}.feito"

      # 09/10/2026 (defeito (b) da noite de 08->09): O MARCADOR SOBREVIVE AO PUSH PERDIDO.
      #
      # O `.feito` era gravado na arvore e chegava a `main` NO MESMO COMMIT DO DADO. Push que se
      # perde leva o marcador junto: `diarios` (run 37875038703) coletou onze minutos, o laco de
      # rebase-e-push falhou nas cinco tentativas, e para a guarda e para o vigia aquela coleta
      # nunca aconteceu. Artefato nao depende de `git push`, e sobe AQUI, antes do commit. Quem le
      # as duas provas e `scripts/marcador_de_elo.py`, que e o dono da pergunta.
      - name: Guardar o marcador fora do commit
        if: steps.feito.outputs.feito == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: feito-${{ inputs.nome }}-${{ env.NOITE }}
          path: data/noite/${{ env.NOITE }}/${{ inputs.nome }}.feito
          retention-days: 14
          if-no-files-found: warn

      - name: Regenerar derivados
        continue-on-error: true
        timeout-minutes: 10
        run: bash scripts/verificar_derivados.sh || true

      # §273: o painel resume a execução em curso, então é gerado depois dos comandos e antes do
      # commit — não na cadeia canônica, onde o portão 12 o cobraria por não mudar.
      - name: Gerar o painel de saúde
        continue-on-error: true
        timeout-minutes: 3
        run: python3 scripts/gerar_saude_pipeline.py

      # O painel da NOITE é outro: ele não resume os comandos, resume os ELOS — um por noite, com
      # início, fim e "terminou dentro da janela". `inputs.nome` é o nome do elo.
      - name: Registrar o elo no painel da noite
        continue-on-error: true
        timeout-minutes: 2
        env:
          FEITO: ${{ steps.feito.outputs.feito }}
        run: |
          # `--feito` vem do passo do marcador: é o elo dizendo "eu coletei". Sem ele, o painel
          # cai na conclusão do job, e um job cancelado passa a NÃO contar como noite aberta.
          # A decisão fica no `run`, não numa expressão de contexto dentro da linha de comando: foi
          # expressão em lugar errado que fez o GitHub rejeitar dois workflows em 04/10.
          #
          # 05/10/2026 — e ESTE comentário fez o mesmo, pela terceira vez na série. Ele trazia a
          # expressão VAZIA, com as duas chaves e nada dentro, como ilustração da lição. O GitHub
          # resolve expressão em TODO o arquivo — inclusive dentro de `run:`, que é justamente por
          # que `inputs.nome` funciona aqui — e expressão vazia é erro de sintaxe. Resultado: o
          # arquivo inteiro rejeitado, com o caminho no lugar do nome e zero job, e a corrente
          # noturna parada das 09:10 UTC em diante, porque TODO noturno chama este arquivo.
          # Não se escreve a expressão como exemplo, nem em comentário: descreve-se.
          MARCA="--nao-feito"
          if [ "${FEITO:-}" = "1" ]; then MARCA="--feito"; fi
          python3 scripts/painel_da_noite.py --registrar "${{ inputs.nome }}"             --inicio "${ELO_INICIO:-}" --conclusao "${{ job.status }}" "$MARCA" || true

      - name: Commit com rebase-e-push (item 1a)
        if: steps.janela.outputs.pode == '1'
        id: commit
        env:
          ROBO_DEPLOY_KEY: ${{ secrets.ROBO_DEPLOY_KEY }}
        run: |
          git config user.name "monitor-el-nino-bot"
          git config user.email "bot@users.noreply.github.com"
          # 29/09/2026: `evidencias/` ENTRA no commit. Sem ela, todo coletor que chama
          # `preservar_evidencia` gravava o índice em `data/evidencias.json` e deixava o
          # arquivo para trás no runner — o índice afirmando cópia preservada que não existe.
          # Foram 216 numa noite. É o §270 outra vez, por outro caminho: lá o `.gitignore`
          # descartava o binário, aqui o `git add` nunca o incluiu. O §275 consertou o
          # primeiro e não viu o segundo, porque o portão só reprova quando o índice chega
          # à `main` — e ele chegava junto, no mesmo commit.
          git add -A data/ dados-abertos/ feeds/ selos/ evidencias/ docs/MANIFEST_SHA256.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sem alterações."; echo "houve=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git commit -m "${{ inputs.nome }} automático ($(date -u +%d/%m/%Y\ %H:%M) UTC)"
          echo "houve=1" >> "$GITHUB_OUTPUT"
          git checkout -- . 2>/dev/null || true
          mkdir -p ~/.ssh && printf '%s\n' "$ROBO_DEPLOY_KEY" > ~/.ssh/robo && chmod 600 ~/.ssh/robo
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/robo -o IdentitiesOnly=yes"
          EMPURROU=0
          for TENTATIVA in 1 2 3 4 5; do
            GIT_SSH_COMMAND="$SSH" git fetch --depth=50 git@github.com:${GITHUB_REPOSITORY}.git main || true
            if ! git rebase FETCH_HEAD; then
              # 05/10/2026 (item 2 do handover da noite confiável) — A UNIÃO, NÃO O DESCARTE.
              #
              # Era `git rebase -X theirs`. Num arquivo de FILA isso não resolve, apaga: `-X theirs`
              # manda o git escolher um lado inteiro, e o lado perdedor são as pistas que o outro elo
              # acabou de achar. Medido na noite de 04→05/10: a busca web perdeu 114 minutos de
              # trabalho em quatro tentativas de rebase conflitando em `data/pistas_imprensa.json`,
              # `data/pistas_revisao.json` e `docs/MANIFEST_SHA256.txt`.
              #
              # A lei do projeto para arquivo que só cresce é unir pela BASE COMUM, nunca escolher um
              # lado nem deduplicar por conteúdo (23/09: uma união por conteúdo produziu um log menor
              # que cada lado e apagou quase 3.000 execuções). `scripts/unir_conflito_de_rodada.py`
              # faz isso, e desde hoje sabe resolver as filas de pista com a política declarada por
              # `scripts/pistas.py`: acréscimo dos dois lados entra, campo que só um lado tocou entra,
              # MESMO campo com valores diferentes é RECUSADO em vez de adivinhado.
              #
              # Só se a união recusar é que se desiste desta tentativa. Desistir aqui não perde o
              # trabalho: ele sai como artefato no passo abaixo.
              echo "tentativa $TENTATIVA: rebase conflitou; unindo pela base comum"
              if python3 scripts/unir_conflito_de_rodada.py; then
                bash scripts/verificar_derivados.sh || true
                git add -A data/ dados-abertos/ feeds/ selos/ evidencias/ docs/MANIFEST_SHA256.txt 2>/dev/null || true
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                  echo "::warning::a união resolveu mas o rebase não seguiu; nova tentativa"
                  sleep $((TENTATIVA * 10)); continue
                fi
              else
                # Recusa registrada: a política daquele caminho não está decidida, e adivinhar
                # apagaria dado. O trabalho vira artefato, e a editoria vê o nome do arquivo no log.
                # 08/10/2026 (A2-02): SAIR NA PRIMEIRA RECUSA. Repetir não muda nada — a recusa
                # é da política daquele caminho, não da corrida —, e as outras quatro tentativas
                # custaram 2 min 50 s de espera por elo na noite de 07→08/10, sem alterar o
                # desfecho. O trabalho sai como artefato no passo abaixo, e o elo seguinte o
                # reaplica (`scripts/reaplicar_noite.py`).
                git rebase --abort || true
                echo "::error::a união RECUSOU um caminho — ver o nome no log acima; o trabalho vai no artefato"
                break
              fi
            fi

            # 08/10/2026 (A2-09): REBASE SEM CONFLITO TAMBEM MOVE O DADO. Os derivados e o
            # manifesto sao funcao do dado; se a `main` andou e o rebase passou limpo, o que este
            # elo traz foi recalculado sobre outra base — e o manifesto chega obsoleto, que e o
            # portao 12 vermelho na `main`. Regenerar e emendar ANTES do push, sempre que a `main`
            # tiver andado.
            if ! git diff --quiet FETCH_HEAD..HEAD -- data/; then
              bash scripts/verificar_derivados.sh --regenerar-para-commit || true
              git add -A dados-abertos/ feeds/ selos/ docs/MANIFEST_SHA256.txt 2>/dev/null || true
              git diff --cached --quiet || git commit --amend --no-edit
            fi

            if GIT_SSH_COMMAND="$SSH" git push git@github.com:${GITHUB_REPOSITORY}.git HEAD:main; then
              EMPURROU=1; echo "empurrado na tentativa $TENTATIVA"; break
            fi
            echo "tentativa $TENTATIVA: push recusado (main avançou); nova tentativa"
            sleep $((TENTATIVA * 10))
          done
          rm -f ~/.ssh/robo
          if [ "$EMPURROU" != "1" ]; then
            echo "empurrou=0" >> "$GITHUB_OUTPUT"
            echo "::error::commit perdido para main em movimento"
            exit 1
          fi
          echo "empurrou=1" >> "$GITHUB_OUTPUT"

      # As saídas viram artefato quando o commit se perde: o dado coletado não desaparece junto com
      # o job (item 1a).
      - name: Guardar as saídas quando o commit se perde
        if: failure() && steps.commit.outputs.houve == '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coleta-perdida-${{ inputs.nome }}-${{ github.run_id }}
          path: |
            data/
            docs/MANIFEST_SHA256.txt
          retention-days: 14
          if-no-files-found: warn

      - name: Resumo no job
        if: always()
        run: |
          echo "### Coletor ${{ inputs.nome }}" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/saude_pipeline.py --listar | tail -20 >> "$GITHUB_STEP_SUMMARY" || true
          # 29/09/2026 (item 5): o funil do verificador de imprensa sai no resumo da noite em que
          # ele rodou. Sem isso, "0 exibíveis" chegaria à editoria sem a causa ao lado.
          # A linha abaixo lia um input que nunca foi declarado -- o nome estava no plural, em
          # ingles, e o input que existe e `comandos`. (Nao se escreve o nome errado nem em
          # comentario: o portao varre o arquivo inteiro, e a mencao basta para acusar.) A
          # expressao resolvia para vazio, o teste era sempre falso, e o funil do verificador de
          # imprensa NUNCA saiu no resumo da noite -- o item 5 de 29/09 estava escrito e nao
          # acontecia. Defeito calado: nada falha, so deixa de aparecer.
          if printf '%s' '${{ inputs.comandos }}' | grep -q verificar_pista_imprensa; then
            python3 verificar_pista_imprensa.py --funil >> "$GITHUB_STEP_SUMMARY" || true
          fi
