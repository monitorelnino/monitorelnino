<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Monitor El Niño Brasil · Em atualização</title>
  <style>
    :root{--fundo:#EDE6D8;--tinta:#15201A;--apoio:#5b6660;--barra:#5E7C93;--trilho:#d9d1c1}
    html,body{margin:0;height:100%;background:var(--fundo);color:var(--tinta);
      font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
    main{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
    .caixa{width:min(520px,100%);text-align:center}
    .marca{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--apoio);margin:0 0 18px}
    h1{font-weight:400;font-size:clamp(28px,5vw,40px);margin:0 0 10px;letter-spacing:-.01em}
    p{margin:0 0 28px;color:var(--apoio);font-size:16px;line-height:1.5}
    .progresso{height:6px;background:var(--trilho);border-radius:999px;overflow:hidden;position:relative}
    .progresso span{position:absolute;top:0;bottom:0;width:38%;background:var(--barra);border-radius:999px;
      animation:desliza 1.8s cubic-bezier(.4,0,.2,1) infinite}
    @keyframes desliza{0%{left:-40%}100%{left:105%}}
    @media (prefers-reduced-motion:reduce){.progresso span{animation:none;width:60%;left:20%}}
    footer{margin-top:40px;font-size:12px;color:var(--apoio)}
  </style>
</head>
<body>
  <main>
    <div class="caixa">
      <p class="marca">Monitor El Niño Brasil</p>
      <h1>Em atualização</h1>
      <p>Estamos preparando uma nova edição. Voltamos em breve.</p>
      <div class="progresso" role="progressbar" aria-label="Site em atualização"><span></span></div>
      <footer>Futura Evidence Lab</footer>
    </div>
  </main>
</body>
</html>
