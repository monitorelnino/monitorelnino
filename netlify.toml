# Configuração de deploy do Monitor El Niño Brasil no Netlify.
# O site é estático (sem framework, sem empacotador): publicar a raiz do
# repositório é suficiente. Este arquivo documenta o deploy para o auditor
# reproduzir; ele NÃO é obrigatório caso a hospedagem seja feita por outro
# meio (ver docs/COMO_RODAR_E_PENDENCIAS.md para alternativas).

[build]
  publish = "."
  # Sem comando de build: os arquivos data/*.json já vêm prontos no
  # repositório (gerados pelo pipeline Python/Node antes do commit,
  # tipicamente pela Action semanal). Não há passo de compilação do site.

[[redirects]]
  from = "/obrigado"
  to = "/obrigado.html"
  status = 200

# --- Formulário público (envie-dados.html) ---
# O formulário usa Netlify Forms (atributo data-netlify="true" na marcação),
# detectado automaticamente pelo Netlify no build — nenhuma configuração
# adicional é necessária aqui. As submissões ficam disponíveis no painel
# Netlify (Site → Forms) e são lidas programaticamente por
# verificar_contribuicoes.py via API, que requer NETLIFY_AUTH_TOKEN e
# NETLIFY_SITE_ID (ver .env.example). Nenhum dado do formulário, incluindo
# o campo de e-mail, é publicado no site ou entra em data/*.json: ver
# docs/LGPD_PRIVACIDADE.md para o fluxo completo do dado pessoal coletado.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # AUD-12 (auditoria externa 02/09/2026): CSP. Os scripts das páginas são inline (site
    # estático sem empacotador) — 'unsafe-inline' em script-src é uma limitação declarada;
    # a defesa principal contra XSS é o escape na carga (index.html) + validação no
    # processador de contribuições. VLibras precisa de script + frame + conexão.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://vlibras.gov.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://vlibras.gov.br https://*.vlibras.gov.br; frame-src https://vlibras.gov.br; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# ── Cache para lançamento com muitos acessos simultâneos (03/09/2026) ──────────────────
# O site é estático e servido pela CDN do Netlify (escala horizontal por padrão; brotli/gzip
# automáticos). O que controla o custo por visita é o cache no navegador e na borda:
# HTML sempre revalidado (mudanças aparecem em minutos); dados JSON por 5 min com
# revalidação em segundo plano (a rotina publica no máximo uma vez por dia); folhas,
# módulo, fontes, selos e PDFs por mais tempo. Peso por visita ≈ 300 KB comprimidos na
# página inicial (medido em 03/09/2026).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=900"
[[headers]]
  for = "/data/financiamento/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=900"
[[headers]]
  for = "/data/painel/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=900"
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=86400"
[[headers]]
  for = "/selos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=3600"
[[headers]]
  for = "/feeds/*"
  [headers.values]
    Cache-Control = "public, max-age=600"
[[headers]]
  for = "/dados-abertos/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
