<!DOCTYPE html><html lang="pt-br"><head><meta charSet="utf-8"/><meta name="viewport" content="width=device-width"/><title>Por que o El Niño aumenta o risco de incêndios na Amazônia - Nexo Jornal</title><meta property="copyrightHolder" content="Nexo Jornal Ltda"/><meta name="description" content="Agência do governo americano estima em 81% probabilidade de fenômeno muito forte em 2026. Situação deve ser de altas temperaturas e condições hídricas ruins"/><meta property="editor" content="Conrado Corsalette"/><meta property="image" content="https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-1536x864.webp"/><meta itemProp="thumbnailUrl" content="https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-1536x864.webp"/><meta property="url" content="https://www.nexojornal.com.br/externo/2026/07/24/el-nino-no-brasil-2026-incendios-amazonia"/><link rel="canonical" href="https://www.nexojornal.com.br/externo/2026/07/24/el-nino-no-brasil-2026-incendios-amazonia"/><meta property="nexo-id" content="380158"/><meta property="nexo-section" content="Externo"/><meta property="nexo-unique-section" content="Externo"/><meta property="og:article:section" content="Externo"/><meta property="update" content="2026-07-24T21:20:01"/><meta property="articleUpdateTime" content="2026-07-24T21:20:01"/><meta property="pubdate" content="2026-07-24T21:20:01"/><meta property="articlePublishTime" content="2026-07-24T17:32:26"/><meta property="article:content_tier" content="metered"/><meta name="twitter:label2" content="Leia mais"/><meta name="twitter:data2" content="nexojornal.com.br"/><meta property="og:type" content="article"/><meta property="authors" content="Nicoly Ambrosio"/><meta property="tags" content="Brasil, Meio Ambiente"/><meta property="og:article:tag" content="Brasil, Meio Ambiente"/><meta name="twitter:url" content="https://www.nexojornal.com.br/externo/2026/07/24/el-nino-no-brasil-2026-in 102d074733.js" defer=""></script><script src="/_next/static/chunks/3308-bf5e32dee6e20842.js" defer=""></script><script src="/_next/static/chunks/9567-d86940e6afc640a0.js" defer=""></script><script src="/_next/static/chunks/5675-1143b4e05607e631.js" defer=""></script><script src="/_next/static/chunks/9788-e47e615f690f1d69.js" defer=""></script><script src="/_next/static/chunks/9207-f50fa2e4a9da4513.js" defer=""></script><script src="/_next/static/chunks/9816-4d255d001331c389.js" defer=""></script><script src="/_next/static/chunks/9036-04fb3e5f3021b6a3.js" defer=""></script><script src="/_next/static/chunks/3519-e77cde7fd9d63f21.js" defer=""></script><script src="/_next/static/chunks/7357-ce87da47b55de4b4.js" defer=""></script><script src="/_next/static/chunks/pages/%5B...post%5D-6be9466763604d71.js" defer=""></script><script src="/_next/static/mX-9WY9qElrgRA4pjtoi2/_buildManifest.js" defer=""></script><script src="/_next/static/mX-9WY9qElrgRA4pjtoi2/_ssgManifest.js" defer=""></script></head><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"post":{"quiz":null,"status":"publish","academic":null,"author":"Nicoly Ambrosio","content":"\u003cdiv id=\"attachment_380165\" style=\"width: 1930px\" class=\"wp-caption alignnone\"\u003e\u003cimg fetchpriority=\"high\" decoding=\"async\" aria-describedby=\"caption-attachment-380165\" class=\"size-full wp-image-380165\" src=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide.webp\" alt=\"Queimada no sul do Amazonas, em 29/ 08/2025\" width=\"1920\" height=\"1080\" data-agency=\"Greenpeace\" data-photographer=\"Marizilda Cruppe\" data-url-landscape-640=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-640x399.webp\" srcset=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide.webp 1920w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-295x166.webp 295w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-600x338.webp 600w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-768x432.webp 768w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-1536x864.webp 1536w\" sizes=\"(max-width: 1920px) 100vw, 1920px\" /\u003e\u003cp id=\"caption-attachment-380165\" class=\"wp-caption-text\"\u003eQueimada no sul do Amazonas em agosto de 2025\u003c/p\u003e\u003c/div\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eUm Super El Niño anunciado pela \u003ca href=\"https://www.noaa.gov/news-release/el-nino-forms-expected-to-strengthen-say-noaa-forecasters\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eAdministração Nacional Oceânica e Atmosférica dos Estados Unidos (NOAA)\u003c/a\u003e expôs um alerta climático sob as regiões tropicais como a Amazônia pela probabilidade de 81% do fenômeno atingir a categoria “muito forte” no último trimestre deste ano:  entre os meses de outubro, novembro e dezembro. Modelos climáticos indicam que a superfície do oceano Pacífico atingirá a temperatura de 2 graus acima da média.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eNa região amazônica, o evento que aquece as águas do mar se intensificará na estação seca, conhecida como “verão amazônico”. O período de estiagem (redução de chuvas), que começou este mês na maioria dos estados na região Norte, entre eles, Amazonas, Acre e Pará, se estende até novembro. O volume de chuvas diminui, os rios e igarapés secam, num ciclo sazonal, sem danos à população.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eMas com um eventual super El Niño, essa condição climatológica e hidrológica se exacerba drasticamente ao ponto de deixar a população sofrendo os efeitos destes eventos: altas temperaturas, níveis dos rios abaixo da média, aquecimento das águas, agravamento das atividades humanas na floresta, como desmatamento, grilagem, queimadas, incêndios florestais e fumaça que se espalha nas cidades.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eNo extremo norte da Amazônia, a atenção se volta para Roraima. Diferente de outros estados da região Norte, a estação seca em Roraima começa em outubro, se estendendo até março ou abril de 2027 – o que apresenta risco de graves incêndios florestais. Em 2015 e em 2016, quando foi registrado um outro El Niño intenso, o chamado ‘El Niño Godzilla’, o estado f\u003ca href=\"https://amazoniareal.com.br/12872el-nino-godzilla-afeta-norte-da-amazonia-com-seca-prolongada/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eoi um dos  mais afetados\u003c/a\u003e pelo fenômeno climático com secas extremas e incêndios.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm 2023 e 2024, quando a bacia amazônica enfrentou uma\u003ca href=\"https://amazoniareal.com.br/os-isolados-da-seca/\"\u003e seca sem precedentes na história recente\u003c/a\u003e, as consequências do El Niño naqueles dois anos foram agravadas por altas temperaturas no Oceano Atlântico (o Dipolo do Atlântico), condição que, até o momento, ainda não foi identificada pelos especialistas em 2026.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eApesar da redução do desmatamento na Amazônia, os especialistas alertam que o risco de incêndios permanece elevado. O Inpe \u003ca href=\"https://www.gov.br/inpe/pt-br/assuntos/ultimas-noticias/ciencia-e-tecnologia-do-inpe-tem-papel-de-destaque-na-reducao-historica-do-desmatamento-na-amazonia\"\u003eregistrou  uma redução de 37,5% nos alertas de desmatamento na região \u003c/a\u003eentre agosto de 2025 e maio de 2026, o menor valor já registrado pela série histórica para o período.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO cientista Philip Fearnside, do Instituto Nacional de Pesquisas da Amazônia (Inpa), avalia que o cenário exige atenção, principalmente em relação aos incêndios florestais, embora a seca não deva repetir, em princípio, os níveis extremos registrados em 2023 e 2024. Ele destaca que o El Niño vai deixar a temperatura 2°C mais altas acima da média de 30 anos.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Com relação aos incêndios, deve ser grave na parte norte da Amazônia, mas temos uma vantagem com relação a 2024, porque o ano anterior não foi tão seco como foi naquele ano trágico. \u003ca href=\"https://amazoniareal.com.br/seca-de-2023/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eEm 2023 a seca foi pior \u003c/a\u003edo que em 2024; mas os incêndios foram muito piores em 2024 do que em 2023 devido à floresta e o solo embaixo dela terem sido ressecados pela seca do ano anterior, o que não é o caso do mesmo grau no momento”, explicou o pesquisador em entrevista à \u003cstrong\u003eAmazônia Real\u003c/strong\u003e.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eFearnside explicou que o risco de incêndios florestais é elevado, principalmente na parte norte da Amazônia, onde estados como Roraima podem sentir primeiro os efeitos do Super El Niño. “Há fatores que vão nas duas direções. Este ano as temperaturas da água no Pacífico estão chegando em níveis recordes, levando a um El Niño mais forte do que os anteriores. Ao mesmo tempo, este ano não tem o El Niño junto com um Dipolo do Atlântico, diferente do que ocorreu nos eventos de 2023 e 2024”, afirmou\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO Dipolo do Atlântico é caracterizado pelo aquecimento das águas do Atlântico Norte, ao norte da linha do Equador, em relação ao Atlântico Sul. Segundo Fearnside, quando esse fenômeno ocorre simultaneamente ao El Niño, que aquece de forma anormal as águas superficiais do Oceano Pacífico Equatorial, as chuvas diminuem ainda mais sobre a Amazônia, ampliando a intensidade da seca e seus impactos.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eSegundo Fearnside, embora o fenômeno esteja associado, de forma geral, à redução das chuvas, ao aumento das temperaturas, aos incêndios florestais, à mortalidade de árvores e à queda do nível dos rios, a intensidade desses impactos varia entre as diferentes sub-bacias amazônicas, dependendo da combinação entre o aquecimento do oceano Pacífico e das diferentes regiões do oceano Atlântico. “Os impactos são bem mais complexos do que a simples generalização de que El Niño causa seca na Amazônia”, afirmou.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eComo exemplo, ele cita que, em determinadas configurações climáticas, a presença simultânea do Dipolo do Atlântico e do El Niño pode fazer com que a sub-bacia do rio Javari registre condições mais úmidas, em vez de mais secas.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e\u003ca href=\"https://www.ihu.unisinos.br/categorias/173-noticias-2011/40414-seca-amazonica-de-2010-foi-ainda-pior-para-a-floresta-que-a-de-2005-\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eEm 2005 e 2010, a combinação desses fenômenos causou grandes incêndios no Acre e levou o rio Purus\u003c/a\u003e a níveis excepcionalmente baixos. De acordo com o pesquisador, foi justamente esse mesmo cenário que também contribuiu para a\u003ca href=\"https://amazoniareal.com.br/especiais/puraquequara/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e seca extrema registrada\u003c/a\u003e em 2023 e  2024 na Amazônia, quando rios atingiram a níveis historicamente baixos e episódios\u003ca href=\"https://amazoniareal.com.br/mortes-de-botos/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e como a morte de mais de 150 botos em Tefé\u003c/a\u003e, no interior do Amazonas, chamaram a atenção para a gravidade da crise climática.\u003c/p\u003e\n\u003ch2 class=\"wp-block-paragraph\"\u003e\u003cstrong\u003eImpactos não são homogêneos\u003c/strong\u003e\u003c/h2\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eGilvan Sampaio, pesquisador e meteorologista do Instituto Nacional de Pesquisas Espaciais (Inpe), também confirma que os principais impactos do Super El Niño previstos para a Amazônia são o aumento da temperatura do ar e o risco de incêndios florestais, principalmente em áreas de florestas degradadas. Apesar disso, Sampaio diz que ainda não é possível prever uma seca semelhante à registrada em 2023 e 2024.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Tendência de chuvas abaixo da média no norte e leste da Amazônia, com maior impacto no primeiro semestre de 2027. Ainda não dá para falar sobre seca e intensidade de seca, pois é necessário avaliar a evolução da temperatura do oceano no Atlântico Tropical. Ao longo dos próximos meses será possível avaliar essa questão. Atenção ao sul da Amazônia nos próximos meses, pois as temperaturas altas podem aumentar o potencial de queimadas na região, principalmente porque é o período seco nesta região”, disse Sampaio à \u003cstrong\u003eAmazônia Real\u003c/strong\u003e.\u003c/p\u003e\n\u003cdiv id=\"code-type\"\u003e\u003cstyle\u003e\r\n    #om-as33g2wut6dyaarpt96b-holder {\r\n        display: block;\r\n        width: 100%;\r\n        margin: 0 !important;\r\n        padding: 0 !important;\r\n        background: transparent !important;\r\n        border: 0 !important;\r\n        border-radius: 0 !important;\r\n        box-shadow: none !important;\r\n    }\r\n\r\n    #om-as33g2wut6dyaarpt96b-holder iframe {\r\n        display: block;\r\n        width: 100% !important;\r\n        margin: 0 !important;\r\n        padding: 0 !important;\r\n        background: transparent !important;\r\n        border: 0 !important;\r\n        border-radius: 0 !important;\r\n        box-shadow: none !important;\r\n    }\r\n\u003c/style\u003e\r\n\r\n\u003cdiv id=\"om-as33g2wut6dyaarpt96b-holder\"\u003e\u003c/div\u003e\u003c/div\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO pesquisador destacou que os impactos não serão homogêneos na região. A tendência de redução das chuvas se concentra no norte e leste da região, incluindo o leste do Amazonas, Pará, Roraima, Amapá e norte do Tocantins, enquanto o Acre não deve registrar alterações significativas no regime de precipitação.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Não há impactos nas chuvas no Acre e demais regiões. Em relação à temperatura, toda a Amazônia fica com temperaturas acima da média”.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eNo final de junho, uma\u003ca href=\"https://www.gov.br/inpe/pt-br/assuntos/ultimas-noticias/nota-tecnica-conjunta-aponta-alta-probabilidade-de-el-nino-no-segundo-semestre-de-2026\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e nota técnica\u003c/a\u003e do Inpe em conjunto com o Instituto Nacional de Meteorologia (INMET), a Fundação Cearense de Meteorologia e Recursos Hídricos (Funceme) e o Centro Gestor e Operacional do Sistema de Proteção da Amazônia (CENSIPAM) reforçou a possibilidade do El Niño deste ano reduzir o volume de chuvas na Amazônia, com impactos para a navegação, a pesca e o abastecimento de comunidades.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eAs maiores secas na Amazônia, monitoradas pelo\u003ca href=\"http://www2.cemaden.gov.br/\"\u003e \u003c/a\u003eCentro Nacional de Monitoramento e Alertas de Desastres Naturais (\u003ca href=\"http://www2.cemaden.gov.br/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eCemaden\u003c/a\u003e), incluem os eventos severos de 2005 e 2010, a estiagem prolongada de 2015-2016 e o colapso climático recente (2023-2024), considerado a pior e mais extensa seca da história recente.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm boletim recém divulgado, o Cemaden indicou a 97% de permanência do fenômeno Super El Niño até o início de 2027, com a combinação de temperaturas acima da média e precipitações abaixo da média em áreas do Centro-Oeste, Norte e Nordeste.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eA consequência seria o aumento das queimadas nos próximos meses, além da possibilidade de condições de seca moderada e severa concentrada no oeste do Tocantins, no centro-sul do Pará, no norte do Amazonas.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eOs dados do Cemaden também mostram que maio registrou uma pequena redução no número de terras indígenas em condição de seca severa. Ainda assim, o déficit hídrico continua presente em áreas dos Distritos Sanitários Especiais Indígenas (DSEIs), mantendo o cenário de atenção.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO meteorologista Marcelo Enrique Seluchi, coordenador geral do Cemaden, afirmou que o fenômeno ainda se encontra em intensidade moderada, mas deve continuar se fortalecendo gradualmente até o fim do ano. Apesar do avanço das previsões, ele ressalta que é cedo para definir a extensão de uma possível grande seca ou as áreas mais afetadas.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“A expectativa é de chuvas abaixo da média. Há uma junção de combinações e não sabemos como o oceano Atlântico irá se comportar. O oceano Atlântico é muito mais difícil de prever que o oceano Pacífico”, disse.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eAo analisar episódios anteriores de El Niño muito forte, Seluchi observa que todos provocaram seca proeminentes na bacia amazônica, mas com intensidade e distribuição diferentes entre as áreas da região Norte.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Cada situação de El Niño é diferente. Em alguns casos, essa seca é relativamente generalizada; em outros, fica muito mais localizada, por exemplo, no extremo norte da região Norte ou mais voltada para o Nordeste. Cada situação de El Niño é diferente. Então, a gente não consegue cravar hoje onde será o maior impacto”, acrescentou.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eDurante a \u003ca href=\"https://www.gov.br/mma/pt-br/noticias-defeso-eleitoral/reuniao-tecnica-atualiza-previsoes-climaticas-e-aponta-intensificacao-do-el-nino-ate-dezembro\" target=\"_blank\" rel=\"noreferrer noopener\"\u003equinta reunião técnica de monitoramento climático \u003c/a\u003erealizada pelo Ministério do Meio Ambiente e Mudança do Clima (MMA), no dia 11 de julho, especialistas de instituições federais e centros de pesquisa atualizaram as previsões meteorológicas e avaliaram os indicadores de risco de incêndios florestais.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eAs análises confirmam o cenário da ocorrência de El Niño na influência do regime de chuvas e as temperaturas em diferentes regiões do país ao longo do segundo semestre. Entre os principais cenários projetados estão o aumento do perigo de incêndios florestais entre agosto e outubro na Amazônia e no Brasil Central, concentrados nos estados do Amazonas, Pará, Tocantins, Maranhão e Mato Grosso.\u003c/p\u003e\n\u003ch2 class=\"wp-block-paragraph\"\u003e\u003cstrong\u003ePopulações amazônicas afetadas\u003c/strong\u003e\u003c/h2\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eAdilson Vieira, sociólogo e liderança socioambiental da Rede Grupo de Trabalho Amazônico (GTA), observa que a Amazônia chega mais vulnerável ao novo episódio de El Niño do que em eventos anteriores. Segundo ele, décadas de desmatamento, mineração, exploração madeireira, abertura de estradas e expansão da agropecuária reduziram a capacidade da floresta de resistir aos eventos extremos.\u003c/p\u003e\n\u003cdiv id=\"attachment_380166\" style=\"width: 1034px\" class=\"wp-caption alignnone\"\u003e\u003cimg decoding=\"async\" aria-describedby=\"caption-attachment-380166\" class=\"size-full wp-image-380166\" src=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1.webp\" alt=\"Registro do impacto da seca severa visíveis no cotidiano em área do entorno de Manaus, em 2024\" width=\"1024\" height=\"683\" data-agency=\"Amazônia Real/ 23.9.2024\" data-photographer=\"Juliana Pesqueira\" data-url-landscape-640=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1-640x399.webp\" srcset=\"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1.webp 1024w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1-249x166.webp 249w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1-600x400.webp 600w, https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/DSC05277-1024x683-1-768x512.webp 768w\" sizes=\"(max-width: 1024px) 100vw, 1024px\" /\u003e\u003cp id=\"caption-attachment-380166\" class=\"wp-caption-text\"\u003eRegistro dos impactos da seca severa visíveis no entorno de Manaus em 2024\u003c/p\u003e\u003c/div\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Uma floresta em pé produz umidade, ajuda a formar chuvas e protege os rios. Quando ela é derrubada ou fragmentada, perde parte dessa força. As bordas da floresta ficam mais quentes, o solo perde água e o fogo avança com mais facilidade”, afirmou.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO sociólogo enfatiza que os efeitos de um El Niño forte vão além dos impactos ambientais e atingem diretamente o \u003ca href=\"https://amazoniareal.com.br/especiais/ate-a-formiga-desapareceu/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003ecotidiano das populações amazônicas,\u003c/a\u003e especialmente indígenas e ribeirinhas, já que muitas permanecem sem infraestrutura para enfrentar períodos prolongados de estiagem.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eA redução do nível dos rios dificulta o transporte de pessoas, alimentos e medicamentos, compromete o abastecimento de água potável, reduz a pesca e provoca perdas na produção agrícola. Nas cidades, os reflexos podem incluir piora da qualidade do ar, aumento do preço dos alimentos e problemas no abastecimento de água, como ocorreu em Manaus durante as secas de 2023 e 2024,\u003ca href=\"https://amazoniareal.com.br/fumaca-volta-a-sufocar-manaus/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e quando a fumaça tóxica das queimadas  criminosas encobriu a capital amazonense por vários dias.\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Mas precisamos dizer com clareza: o El Niño não coloca fogo na floresta. O fogo tem responsáveis. Ele começa com o desmatamento, a grilagem de terras, a expansão da pecuária, as queimadas criminosas e a abertura de novas áreas para grandes projetos econômicos. A seca deixa a floresta mais inflamável, mas é a ação humana que acende o fogo”, destacou.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eVieira ressalta que os impactos também se refletem na saúde pública. Segundo ele, a fumaça das queimadas agrava doenças respiratórias como asma, bronquite, pneumonia, além de problemas cardiovasculares, atingindo principalmente crianças, idosos, gestantes, povos indígenas, ribeirinhos e trabalhadores expostos ao ar livre.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Por isso, não estamos falando apenas de um problema ambiental. Estamos falando de saúde, fome, água, transporte, trabalho e direito à vida. E, como sempre, quem paga a conta mais alta são as populações que menos contribuíram para a crise climática”.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm relação à prevenção por parte dos governos estaduais, o sociólogo afirma que é preciso antecipar as ações de resposta antes do agravamento da seca. Entre as medidas consideradas prioritárias estão o monitoramento contínuo dos rios e das condições climáticas, o fortalecimento dos órgãos ambientais e das Defesas Civis, a contratação e o treinamento permanente de brigadas indígenas e comunitárias e a formação de estoques de água potável, alimentos, medicamentos e combustível para atender comunidades que possam ficar isoladas.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003e“Não podem esperar os rios secarem, a fumaça tomar conta das cidades e as comunidades ficarem isoladas para depois declarar emergência e distribuir ajuda de forma improvisada. Os governos devem contratar e equipar brigadas indígenas e comunitárias. Essas brigadas não podem existir apenas durante a emergência ou trabalhar de forma precária. Elas precisam de remuneração, equipamentos, formação e presença permanente nos territórios”, disse.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO informe semanal do \u003ca href=\"https://www.gov.br/saude/pt-br/composicao/svsa/saude-ambiental/vigiar/monitoramento-de-incendios-florestais/2026/informe-monitoramento-de-incendios-florestais-se-27.pdf\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eMonitoramento de Incêndios Florestais para Vigilância em Saúde\u003c/a\u003e, do programa AdaptaSUS, aponta um cenário de atenção para o avanço das queimadas e da poluição do ar potencialmente perigosa para as populações da região amazônica. Na semana epidemiológica 27, divulgada em 14 de julho, Altamira (PA) registrou 30 focos de calor, enquanto Mateiros (33) e Lagoa da Confusão (28), no Tocantins, figuraram entre os municípios brasileiros com maior número de focos de incêndio.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO boletim também identificou episódios de piora da qualidade do ar em diversos estados, incluindo o Amazonas, com concentrações de material particulado fino (MP2,5) acima do limite diário recomendado pela Organização Mundial da Saúde (OMS) por mais de dois dias consecutivos. Segundo o informe, a exposição prolongada a esse tipo de poluição está associada ao aumento de sintomas respiratórios, doenças cardiovasculares e internações hospitalares.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO avanço do El Niño e seus impactos passou a ser acompanhado pelo Supremo Tribunal Federal (STF). Em maio deste ano, o ministro Flávio Dino determinou que o governo federal e os estados amazônicos informassem\u003ca href=\"https://noticias.stf.jus.br/postsnoticias/uniao-e-estados-da-amazonia-legal-e-do-pantanal-devem-informar-providencias-contra-incendio-diante-do-el-nino/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e quais ações de planejamento e prevenção estão sendo implementadas diante das previsões climáticas para a região.\u003c/a\u003e A decisão faz parte da\u003ca href=\"https://portal.stf.jus.br/processos/detalhe.asp?incidente=6007933\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e Ação de Descumprimento de Preceito Fundamental (ADPF) 743.\u003c/a\u003e\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eProcurado pela reportagem, o STF informou que a pauta continua sob acompanhamento do ministro Flávio Dino até o cumprimento integral da decisão do plenário. A Corte afirmou ainda que não pode informar quais serão os próximos desdobramentos do processo, “sob pena de adiantar decisões”.\u003c/p\u003e\n\u003ch2 class=\"wp-block-paragraph\"\u003e\u003cstrong\u003eGovernos ainda detalham ações\u003c/strong\u003e\u003c/h2\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eMesmo diante de um cenário de impactos prolongados, os governos dos estados da Amazônia ainda não detalharam quais medidas concretas serão adotadas para prevenir ou mitigar os efeitos do El Niño a partir de 2026.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm maio passado,\u003ca href=\"https://www.geledes.org.br/geledes-assina-carta-de-posicionamiento-frente-ao-el-nino-de-alta-intensidade-e-seus-impactos-no-brasil/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e mais de 70 organizações assinaram um documento\u003c/a\u003e cobrando do governo federal medidas preventivas para os impactos do El Niño. A ação, promovida pela Rede de Adaptação Antirracista e Observatório do Clima, cravou a necessidade de utilizar estratégias governamentais aliadas as ações já promovidas em territórios e comunidades\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eA reportagem da \u003cstrong\u003eAmazônia Real\u003c/strong\u003e questionou os governos do Amazonas, Acre e Roraima sobre as ações previstas para minimizar os impactos de uma possível seca, reforçar o combate aos incêndios florestais e proteger comunidades vulneráveis.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm junho,\u003ca href=\"https://g1.globo.com/am/amazonas/noticia/2026/06/09/amazonas-decreta-emergencia-climatica-e-ambiental-por-risco-de-seca-queimadas-e-ondas-de-calor.ghtml\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e o Governo do Amazonas decretou estado de emergência climática\u003c/a\u003e e ambiental por 180 dias em razão das previsões associadas ao El Niño. A medida, assinada pelo governador Roberto Cidade (União Brasil), se limitou a informar o fortalecimento das ações de monitoramento, prevenção, mitigação e preparação para enfrentar  incêndios florestais, ondas de calor e redução da disponibilidade hídrica, além de atribuir responsabilidades a órgãos como a Defesa Civil, Corpo de Bombeiros, Secretaria de Estado do Meio Ambiente (Sema), Instituto de Proteção Ambiental do Amazonas (Ipaam) e Secretaria de Estado da Saúde (SES-AM).\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm 2015, quando um El Niño intenso atingiu a Amazônia, o estado do Amazonas registrou altos índices de queimadas e incêndios florestais. \u003ca href=\"https://amazoniareal.com.br/fumaca-das-queimadas-provoca-decretacao-da-situacao-de-emergencia-em-12-cidades-do-amazonas/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eManaus ficou meses coberta de fumaça\u003c/a\u003e. Na ocasião, o governo do Amazonas chegou a \u003ca href=\"https://amazoniareal.com.br/nao-adianta-culpar-o-para-fumaca-em-manaus-veio-das-queimadas-no-amazonas-diz-inpe/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003eculpar o Pará\u003c/a\u003e, o que foi desmentido pelo Inpe.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eProcurado pela \u003cstrong\u003eAmazônia Real\u003c/strong\u003e, o governo do Amazonas não detalhou como essas medidas serão implementadas na prática, nem informou cronograma, recursos previstos ou eventual número do reforço de equipes para enfrentar uma possível intensificação dos impactos relacionados ao El Niño.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEm resposta à reportagem, o Governo de Roraima informou que ainda está em fase de planejamento para o próximo período de estiagem e que acompanha indicadores como “previsões meteorológicas, índices pluviométricos, níveis dos rios e igarapés, umidade do ar, focos de calor e condições da vegetação”.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eSegundo o Corpo de Bombeiros Militar de Roraima, o Plano Estadual de Contingência para Estiagem e Incêndios Florestais está em revisão e deverá definir níveis de alerta, procedimentos de mobilização, emprego de recursos e atendimento às comunidades afetadas. O estado afirmou que utiliza como referência a estiagem de 2023 e 2024, quando 53.314 pessoas foram diretamente afetadas e 14 municípios decretaram situação de emergência em razão da seca e dos incêndios florestais.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eEntre as ações previstas no Plano Estadual de Contingência para Estiagem e Incêndios Florestais  estão a intensificação do monitoramento dos focos de calor, campanhas de orientação e prevenção, visitas a propriedades rurais e comunidades, construção e manutenção de aceiros, posicionamento estratégico de equipes e equipamentos e, se necessário, distribuição de água potável, alimentos e outros itens de assistência humanitária, com prioridade para comunidades rurais e indígenas e localidades de difícil acesso.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO governo informou ainda que a definição das áreas prioritárias está em consolidação, com base no histórico de ocorrências, disponibilidade hídrica, presença de populações vulneráveis e dificuldades de acesso.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eSobre a estrutura para concretizar essas ações, o governo de Roraima não informou o número de brigadistas contratados neste ano para atuar em conjunto com o Corpo de Bombeiros e a Defesa Civil, também não informou o orçamento previsto para custear todas as medidas. Para o próximo período de estiagem, a manutenção ou ampliação das equipes, viaturas, equipamentos e brigadistas pelo governo de Roraima ainda está sendo dimensionada e dependerá da evolução dos prognósticos climáticos, do mapeamento das áreas de risco e da disponibilidade de recursos.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO governo do Acre não respondeu aos questionamentos enviados pela \u003cstrong\u003eAmazônia Real\u003c/strong\u003e até o fechamento desta reportagem. Em informações divulgadas em seus canais oficiais, o Estado afirma que intensifica o planejamento para enfrentar uma possível estiagem severa associada ao El Niño. Entre as medidas anunciadas está a elaboração de\u003ca href=\"https://sepi.ac.gov.br/governo-do-acre-intensifica-acoes-para-reduzir-impactos-do-super-el-nino-em-terras-indigenas-do-estado/\"\u003e um plano de contingência para os territórios indígenas\u003c/a\u003e, coordenado pela Secretaria Extraordinária dos Povos Indígenas (Sepi), em parceria com a Defesa Civil, órgãos de saúde e lideranças indígenas.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO plano do Acre para os povos indígenas prevê ações de monitoramento, logística, segurança alimentar, abastecimento de água e planejamento para transporte, combustível e apoio às famílias caso a seca se intensifique.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eO governo também informou que pretende ampliar o acesso à água potável nas aldeias por meio da construção e recuperação de poços e da implantação de reservatórios.\u003c/p\u003e\n\u003cp class=\"wp-block-paragraph\"\u003eNa área ambiental, o governo do Acre declarou que as operações de fiscalização e combate ao desmatamento e aos incêndios florestais\u003ca href=\"https://portalacre.com.br/2026/06/acoes-de-prevencao-e-monitoramento-relacionados-ao-fenomeno-el-nino-sao-apresentos-pelo-governo-durante-palestra-no-tre/\" target=\"_blank\" rel=\"noreferrer noopener\"\u003e têm priorizado as regionais do Juruá, Tarauacá-Envira, Purus, Baixo Acre e Alto Acre.\u003c/a\u003e Segundo dados oficiais, somente em 2026 o Instituto de Meio Ambiente do Acre (Imac) lavrou 95 autos de infração, aplicou R$7,16 milhões em multas e embargou 548 hectares de áreas irregulares.\u003c/p\u003e\n","createdAt":"24 de julho de 2026","featuredImage":{"node":{"debateCover":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-1920x580.webp","squareImage":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-640x640.webp","landscape640":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-640x399.webp","src":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide.webp","caption":"\u003cp\u003eQueimada no sul do Amazonas, em 29/ 08/2025\u003c/p\u003e\n","mediaDetails":{"sizes":[{"sourceUrl":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-295x166.webp","height":"166","mimeType":"image/webp","width":"295","name":"medium","__typename":"MediaSize"},{"sourceUrl":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-600x338.webp","height":"338","mimeType":"image/webp","width":"600","name":"large","__typename":"MediaSize"},{"sourceUrl":"https://midia-cdn.nexojornal.com.br/wp-content/uploads/images/2026/07/queimada-marizilda-cruppe-gp-slide-150x150.webp","height":"150","mimeType":"image/webp","width":"150","name
